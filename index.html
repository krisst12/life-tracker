<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Трекер LIFE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;color:#111;padding-bottom:80px}
.err{display:none;background:#e53935;color:#fff;padding:8px 12px;font-size:12px;white-space:pre-wrap;word-break:break-all;z-index:99}
.header{background:#FFD60A;padding:14px 16px;border-radius:0 0 16px 16px}
.header h1{font-size:22px;display:inline-block;margin-left:6px}
.ver{display:inline-block;background:rgba(255,255,255,.45);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:600;margin-top:4px}
.tabs{display:flex;gap:6px;padding:12px 12px 4px;overflow-x:auto}
.tab{flex-shrink:0;padding:8px 16px;border-radius:20px;background:#e8e8ec;border:0;font-size:14px;font-weight:600;color:#333}
.tab.on{background:#111;color:#FFD60A}
.wrap{padding:10px 12px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pcard{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:#eee;object-fit:cover;flex-shrink:0}
.avletter{width:48px;height:48px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
.pname{font-weight:700;font-size:17px}
.psub{font-size:13px;color:#777}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f0f0f0}
.hrow:last-child{border-bottom:0}
.circle{width:26px;height:26px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.circle.on{background:#FFD60A;border-color:#FFD60A}
.hname{flex:1;font-size:15px}
.done .hname{text-decoration:line-through;color:#999}
.xbtn{border:0;background:#f2f2f4;color:#999;width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:0;background:#111;color:#FFD60A;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.btn2{background:#FFD60A;color:#111}
.inp{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;margin-top:8px;outline:none}
.sec{font-size:13px;font-weight:700;color:#8a8a8e;letter-spacing:.5px;margin:14px 4px 8px}
.pbar{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-top:8px}
.pbar div{height:100%;background:#FFD60A;border-radius:6px;transition:width .3s}
.motiv{background:#fff8dc;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px;display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cel{aspect-ratio:1;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999}
.cel.full{background:#FFD60A;color:#111;font-weight:700}
.cel.part{background:#ffe89a;color:#111}
.cel.today{outline:2px solid #111}
.cel.m1{background:#ff8a80;color:#fff}.cel.m2{background:#ffcc80;color:#111}.cel.m3{background:#fff59d;color:#111}.cel.m4{background:#c5e1a5;color:#111}.cel.m5{background:#a5d6a7;color:#111}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:4px}
.dow div{text-align:center;font-size:11px;color:#999}
.rrow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f0f0f0}
.place{font-size:16px;font-weight:700;width:26px;text-align:center;flex-shrink:0}
.firecnt{font-size:13px;color:#e65100;white-space:nowrap}
.fbtn{border:0;background:#ffe0b2;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;flex-shrink:0}
.fbtn:disabled{opacity:.35}
.allok{font-size:12px;color:#2e7d32;font-weight:700}
.mrow{display:flex;justify-content:space-between;gap:8px}
.emo{font-size:26px;background:#f2f2f4;border:2px solid transparent;border-radius:14px;padding:10px 0;flex:1;text-align:center;cursor:pointer}
.emo.on{border-color:#FFD60A;background:#fff8dc}
.tog{width:52px;height:30px;border-radius:15px;background:#ddd;position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.tog.on{background:#FF9500}
.tog:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on:after{left:25px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid #f0f0f0}
.stitle{font-size:15px;font-weight:600}.ssub{font-size:12px;color:#888;margin-top:2px}
input[type=time],select{border:1px solid #ddd;border-radius:10px;padding:8px 10px;font-size:15px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;padding:8px 4px 14px;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.nav div{flex:1;text-align:center;font-size:11px;color:#999;cursor:pointer}
.nav div.on{color:#FF9500;font-weight:700}
.nav .ic{font-size:20px;display:block;margin-bottom:2px}
.hidden{display:none}
.empty{text-align:center;color:#999;font-size:14px;padding:18px 0}
.chip{display:inline-block;background:#f2f2f4;border-radius:8px;padding:2px 8px;font-size:12px;margin-right:6px;color:#555}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acard{background:#f2f2f4;border-radius:14px;padding:12px 8px;text-align:center;opacity:.45}
.acard.on{opacity:1;background:#fff8dc;outline:2px solid #FFD60A}
.acard .i{font-size:26px}
.acard .t{font-size:12px;font-weight:700;margin-top:4px}
.acard .d{font-size:11px;color:#777;margin-top:2px}
.note{font-size:12px;color:#777;margin-top:6px}
</style>
</head>
<body>
<div class="err" id="err"></div>
<div class="header"><span>🔥</span><h1>Трекер LIFE</h1><br><span class="ver">Версия 15</span></div>
<div class="tabs" id="tabs"></div>
<div class="wrap" id="view"></div>
<div class="nav" id="nav"></div>
<script>
(function(){
try{
window.onerror=function(m){var e=document.getElementById('err');e.style.display='block';e.textContent='Ошибка: '+m;};

var tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){try{tg.expand();}catch(e){}}
function tgUser(){try{return tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null;}catch(e){return null;}}
var tu=tgUser();
var ME={id:tu?String(tu.id):'self',name:tu?((tu.first_name||'')+(tu.last_name?' '+tu.last_name:'')||'Участник'):'Гость',photo:tu?(tu.photo_url||''):''};
if(!ME.name||ME.name===' '){ME.name='Гость';}

function todayKey(d){d=d||new Date();var m=(d.getMonth()+1);if(m<10)m='0'+m;var dd=d.getDate();if(dd<10)dd='0'+dd;return d.getFullYear()+'-'+m+'-'+dd;}
function dayDiff(k1,k2){var a=new Date(k1+'T12:00:00'),b=new Date(k2+'T12:00:00');return Math.round((b-a)/86400000);}

var S=JSON.parse(localStorage.getItem('lt15')||'{}');
function def(){return {habits:[],done:{},participants:[],challenges:[],mood:[],supports:{},frozen:{},set:{morn:true,mornT:'07:00',eve:true,eveT:'20:00',water:false,waterT:'12:00',hide:false}};}
if(!S.habits)S=Object.assign(def(),S);
if(!S.set)S.set=def().set;
S.participants=S.participants||[];S.challenges=S.challenges||[];S.mood=S.mood||[];S.supports=S.supports||{};S.frozen=S.frozen||{};S.done=S.done||{};
function save(){localStorage.setItem('lt15',JSON.stringify(S));}
if(!S.selfSaved){S.participants=S.participants.filter(function(p){return p.id!==ME.id;});S.participants.push({id:ME.id,name:ME.name,photo:ME.photo,days:0,local:true});S.selfSaved=true;save();}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function avatarHtml(p,sz){sz=sz||48;var st='width:'+sz+'px;height:'+sz+'px;';if(p.photo)return '<img class="avatar" style="'+st+'" src="'+esc(p.photo)+'">';return '<div class="avletter" style="'+st+'">'+esc((p.name||'Г').charAt(0).toUpperCase())+'</div>';}
function whoName(p){if(S.set.hide&&p.id===ME.id)return 'Скрытый участник';return p.name;}

function closedToday(){var t=S.done[todayKey()]||{};return S.habits.filter(function(h){return t[h.id];}).length;}
function allDoneToday(){return S.habits.length>0&&closedToday()===S.habits.length;}
function closedOn(k){if(!(k in S.done))return 0;var t=S.done[k],c=0;S.habits.forEach(function(h){if(t[h.id])c++;});return c;}
function totalClosedDays(){var c=0;for(var k in S.done){if(closedOn(k)===S.habits.length&&S.habits.length>0)c++;}return c;}
function streak(){var s=0,d=new Date();while(true){var k=todayKey(d);if(S.habits.length>0&&closedOn(k)===S.habits.length){s++;d.setDate(d.getDate()-1);}else if(k===todayKey()){d.setDate(d.getDate()-1);}else{break;}}return s;}

function markSelfDay(){if(allDoneToday()){var me=null;S.participants.forEach(function(p){if(p.id===ME.id)me=p;});if(me){me.days=Math.max(me.days||0,totalClosedDays());}S.done=todayKey() in S.done?S.done:S.done;save();}}

var TABS=['Привычки','Рейтинг','Вызовы','Настроение','Профиль'];
var tab='Привычки';
function renderTabs(){var h='';TABS.forEach(function(t){h+='<button class="tab'+(t===tab?' on':'')+'" onclick="go(\''+t+'\')">'+t+'</button>';});document.getElementById('tabs').innerHTML=h;}
function renderNav(){var icons={'Привычки':'✅','Рейтинг':'🏆','Вызовы':'⚡','Настроение':'🙂','Профиль':'👤'};var h='';TABS.forEach(function(t){h+='<div class="'+(t===tab?'on':'')+'" onclick="go(\''+t+'\')"><span class="ic">'+icons[t]+'</span>'+t+'</div>';});document.getElementById('nav').innerHTML=h;}
window.go=function(t){tab=t;render();};

function profileCard(sub){var s=sub||'Серия: '+(streak())+' · Дней: '+(totalClosedDays());return '<div class="card pcard">'+avatarHtml(ME)+'<div><div class="pname">'+esc(ME.name)+'</div><div class="psub">'+esc(s)+'</div></div></div>';}

function calHtml(colored){var h='<div class="dow"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div><div class="cal">';var now=new Date();var start=new Date(now);start.setDate(start.getDate()-34);while(start.getDay()!==1){start.setDate(start.getDate()-1);}var todayK=todayKey();
for(var i=0;i<42;i++){var d=new Date(start);d.setDate(start.getDate()+i);var k=todayKey(d);var lbl=d.getDate();var cls='cel';if(colored){var mm=S.mood.filter(function(x){return x.k===k;});var last=mm.length?mm[mm.length-1]:null;if(last)cls+=' m'+last.v;}else{var tot=S.habits.length;if(tot>0){var c=closedOn(k);if(c===tot)cls+=' full';else if(c>0)cls+=' part';}}if(k===todayK)cls+=' today';h+='<div class="'+cls+'">'+lbl+'</div>';}
return h+'</div>';}

function renderHabits(){var t=S.done[todayKey()]||{};var done=closedToday(),tot=S.habits.length;var pct=tot?Math.round(done*100/tot):0;
var monthDone=0,monthTot=0;for(var i=0;i<30;i++){var d=new Date();d.setDate(d.getDate()-i);var k=todayKey(d);if(S.habits.length>0){monthTot++;if(closedOn(k)===S.habits.length)monthDone++;}}
var mpct=monthTot?Math.round(monthDone*100/monthTot):0;
var h=profileCard()+ '<div class="card"><div style="font-size:13px;color:#666">Выполнено сегодня: <b>'+pct+'%</b> · за 30 дней: <b>'+mpct+'%</b></div><div class="pbar"><div style="width:'+pct+'%"></div></div>';
if(S.habits.length===0){h+='<div class="empty">Пока нет привычек. Добавь первую!</div>';}
S.habits.forEach(function(hb){var on=!!t[hb.id];h+='<div class="hrow'+(on?' done':'')+'"><div class="circle'+(on?' on':'')+'" onclick="tog(\''+hb.id+'\')">'+(on?'✓':'')+'</div><div class="hname">'+esc(hb.name)+'</div><button class="xbtn" onclick="delH(\''+hb.id+'\')">✕</button></div>';});
h+='<input class="inp" id="hname" placeholder="Новая привычка"><button class="btn" onclick="addH()">＋ Добавить привычку</button><div class="motiv" id="motiv"></div></div>';
h+='<div class="sec">КАЛЕНДАРЬ · 5 НЕДЕЛЬ</div><div class="card">'+calHtml(false)+'</div>';
document.getElementById('view').innerHTML=h;}

window.tog=function(id){var k=todayKey();S.done[k]=S.done[k]||{};S.done[k][id]=!S.done[k][id];
var m=document.getElementById('motiv');m.style.display='block';
if(allDoneToday()){m.textContent='🎉 День закрыт! Серия: '+streak()+'. Так держать!';markSelfDay();}else{var arr=['Ещё один шаг к цели! 🔥','Отличная работа! 💪','Ты справляешься! ✨','Каждая отметка — победа! 🏅','Дисциплина — твой супергерой! 🚀'];m.textContent=arr[Math.floor(Math.random()*arr.length)];}
save();renderHabits();};
window.addH=function(){var v=document.getElementById('hname').value.trim();if(!v)return;S.habits.push({id:'h'+Date.now(),name:v});save();renderHabits();};
window.delH=function(id){S.habits=S.habits.filter(function(h){return h.id!==id;});save();renderHabits();};

function renderRating(){var sorted=S.participants.slice().sort(function(a,b){return (b.days||0)-(a.days||0);});
var sup=S.supports[todayKey()]||[];
var h=profileCard('Твоё место: '+(sorted.findIndex(function(p){return p.id===ME.id;})+1));
if(sorted.length===0)h+='<div class="card"><div class="empty">Нет участников</div></div>';
sorted.forEach(function(p,i){var medal=['🥇','🥈','🥉'][i]||((i+1)+'');var canSup=p.id!==ME.id&&sup.indexOf(p.id)<0;
h+='<div class="card rrow"><div class="place">'+medal+'</div>'+avatarHtml(p,44)+'<div style="flex:1;min-width:0"><div class="pname" style="font-size:15px">'+esc(whoName(p))+'</div><div class="psub">Закрыто дней: '+(p.days||0)+'</div>'+(p.id===ME.id&&allDoneToday()?'<div class="allok">✅ всё выполнено</div>':'')+'</div><div class="firecnt">🔥 '+p.fires||0+'</div><button class="fbtn" '+(canSup?'onclick="sup(\''+p.id+'\')"':'disabled')+' >🔥</button></div>';});
h+='<input class="inp" id="pname" placeholder="Имя участника"><button class="btn" onclick="addP()">＋ Добавить участника</button><div class="note">Участники, вступившие в бота, появятся здесь автоматически после подключения общего сервера. Пока можно добавлять вручную.</div>';
document.getElementById('view').innerHTML=h;}
window.sup=function(id){var k=todayKey();S.supports[k]=S.supports[k]||[];if(S.supports[k].indexOf(id)>=0)return;S.supports[k].push(id);S.participants.forEach(function(p){if(p.id===id)p.fires=(p.fires||0)+1;});save();renderRating();};
window.addP=function(){var v=document.getElementById('pname').value.trim();if(!v)return;S.participants.push({id:'p'+Date.now(),name:v,photo:'',days:0,fires:0,local:true});save();renderRating();};

function renderChallenges(){var h='<div class="card"><input class="inp" id="chname" placeholder="Название вызова"><input class="inp" id="chdays" type="number" min="1" max="365" placeholder="Срок в днях"><button class="btn" onclick="addCh()">🚀 Бросить вызов</button></div>';
if(S.challenges.length===0)h+='<div class="card"><div class="empty">Вызовов пока нет. Брось первый!</div></div>';
S.challenges.forEach(function(c){var joined=c.participants.indexOf(ME.id)>=0;var days=daysInCh(c);
h+='<div class="card"><div class="pname" style="font-size:16px">'+esc(c.name)+'</div><div class="psub" style="margin:4px 0">Срок: '+c.days+' дн. · 👥 участников: '+c.participants.length+'</div><div class="pbar"><div style="width:'+Math.min(100,Math.round(days*100/c.days))+'%"></div></div><div style="margin-top:8px">';
if(!joined)h+='<button class="btn2 btn" style="margin-top:0" onclick="joinCh(\''+c.id+'\')">Принять вызов</button>';
else h+='<span class="chip">Ты участвуешь · '+days+'/'+c.days+'</span><button class="btn btn2" style="margin-top:6px" onclick="markCh(\''+c.id+'\')">＋ Отметить день</button>';
h+='<button class="xbtn" onclick="delCh(\''+c.id+'\')" style="float:right;margin-top:-30px">✕</button></div></div>';});
document.getElementById('view').innerHTML=h;}
function daysInCh(c){var n=0;var base=new Date(c.start+'T12:00:00');for(var i=0;i<c.days;i++){var d=new Date(base);d.setDate(base.getDate()+i);if(c.marks[todayKey(d)])n++;}return n;}
window.addCh=function(){var n=document.getElementById('chname').value.trim();var d=parseInt(document.getElementById('chdays').value)||7;var st=todayKey();var o={id:'c'+Date.now(),name:n,days:d,participants:[],marks:{},owner:ME.id,start:st};o.participants.push(ME.id);o.marks[st]=1;S.challenges.push(o);save();renderChallenges();};
window.joinCh=function(id){S.challenges.forEach(function(c){if(c.id===id&&c.participants.indexOf(ME.id)<0)c.participants.push(ME.id);});save();renderChallenges();};
window.markCh=function(id){S.challenges.forEach(function(c){if(c.id===id)c.marks[todayKey()]=1;});save();renderChallenges();};
window.delCh=function(id){S.challenges=S.challenges.filter(function(c){return c.id!==id;});save();renderChallenges();};

function renderMood(){var avg=0;if(S.mood.length){S.mood.forEach(function(m){avg+=m.v;});avg=Math.round(avg*100/S.mood.length/5);}
var h='<div class="card"><div class="pname" style="font-size:16px">Как ты себя чувствуешь?</div><div class="mrow" style="margin-top:12px">';
['😢','😐','🙂','😊','🤩'].forEach(function(e,i){h+='<div class="emo'+(moodSel===i+1?' on':'')+'" onclick="pickMood('+(i+1)+')">'+e+'</div>';});
h+='</div><input class="inp" id="mnote" placeholder="Заметка (необязательно)"><button class="btn btn2" onclick="saveMood()">Сохранить</button><div class="note">Средний настрой за всё время: <b>'+avg+'%</b></div></div>';
h+='<div class="sec">КАЛЕНДАРЬ НАСТРОЕНИЯ · 5 НЕДЕЛЬ</div><div class="card">'+calHtml(true)+'</div>';
h+='<div class="sec">ИСТОРИЯ</div><div class="card">';
if(!S.mood.length)h+='<div class="empty">Записей пока нет</div>';
S.mood.slice().reverse().slice(0,20).forEach(function(m){h+='<div class="hrow"><div style="font-size:20px">'+['','','😢','😐','🙂'][m.v]+'</div><div class="hname">'+esc(m.n||'—')+'</div><div class="psub">'+esc(m.k)+'</div><button class="xbtn" onclick="delMood(\''+m.k+'\')">✕</button></div>';});
h+='</div>';document.getElementById('view').innerHTML=h;}
var moodSel=0;
window.pickMood=function(v){moodSel=v;renderMood();};
window.saveMood=function(){if(!moodSel)return;var k=todayKey();S.mood=S.mood.filter(function(m){return m.k!==k;});S.mood.push({k:k,v:moodSel,n:document.getElementById('mnote').value.trim()});save();moodSel=0;renderMood();};
window.delMood=function(k){S.mood=S.mood.filter(function(m){return m.k!==k;});save();renderMood();};

function renderProfile(){var ach=[
{id:1,i:'🌱',t:'Первый шаг',d:'Закрыть первый день',ok:totalClosedDays()>=1},
{id:2,i:'⚡',t:'Разгон',d:'Серия 3 дня подряд',ok:streakBest()>=3},
{id:3,i:'🔥',t:'Неделя дисциплины',d:'Серия 7 дней подряд',ok:streakBest()>=7},
{id:4,i:'💪',t:'Две недели',d:'Серия 14 дней подряд',ok:streakBest()>=14},
{id:5,i:'🎖',t:'Месяц силы',d:'Серия 30 дней подряд',ok:streakBest()>=30},
{id:6,i:'💎',t:'Полсотни',d:'Серия 50 дней подряд',ok:streakBest()>=50},
{id:7,i:'👑',t:'Легенда',d:'Серия 100 дней подряд',ok:streakBest()>=100},
{id:8,i:'📅',t:'30 дней в деле',d:'30 закрытых дней (не обязательно подряд)',ok:totalClosedDays()>=30},
{id:9,i:'🎯',t:'Вызов принят',d:'Пройти первый вызов до конца',ok:chDone()>=1},
{id:10,i:'🏆',t:'Охотник за вызовами',d:'Пройти 5 вызовов до конца',ok:chDone()>=5},
{id:11,i:'🤝',t:'Опора сообщества',d:'Поддержать участников 10 раз',ok:supportsTotal()>=10}];
var h=profileCard('Серия: '+streak()+' · Лучшая: '+streakBest()+' · Всего дней: '+totalClosedDays());
h+='<div class="card"><div class="psub">❄️ Заморозки: 2 из 2</div><div class="note">Если пропустишь день, заморозка сработает сама и сохранит серию.</div></div>';
h+='<div class="sec">ДОСТИЖЕНИЯ · '+ach.filter(function(a){return a.ok;}).length+' ИЗ '+ach.length+'</div><div class="card"><div class="ach">';
ach.forEach(function(a){h+='<div class="acard'+(a.ok?' on':'')+'"><div class="i">'+a.i+'</div><div class="t">'+a.t+'</div><div class="d">'+a.d+'</div></div>';});
h+='</div></div><div class="sec">КАЛЕНДАРЬ · 5 НЕДЕЛЬ</div><div class="card">'+calHtml(false)+'</div>';
h+=settingsHtml();
document.getElementById('view').innerHTML=h;}
function streakBest(){var b=0,c=0,keys=[];for(var k in S.done)keys.push(k);keys.sort();keys.forEach(function(k){if(S.habits.length>0&&closedOn(k)===S.habits.length){c++;if(c>b)b=c;}else c=0;});if(allDoneToday()){var s=streak();if(s>b)b=s;}return b;}
function chDone(){var n=0;S.challenges.forEach(function(c){if(c.participants.indexOf(ME.id)>=0&&daysInCh(c)>=c.days)n++;});return n;}
function supportsTotal(){var n=0;for(var k in S.supports){S.supports[k].forEach(function(x){if(x!==ME.id)n++;});}return n;}

function settingsHtml(){var s=S.set;
return '<div class="sec">НАСТРОЙКИ</div><div class="card">'
+'<div class="srow"><div><div class="stitle">Утреннее напоминание</div><div class="ssub">Задания на день</div></div><div class="tog'+(s.morn?' on':'')+'" onclick="setTog(\'morn\')"></div></div>'
+'<div class="srow"><div class="ssub" style="font-size:15px;color:#111">Время утром</div><input type="time" value="'+s.mornT+'" onchange="setTime(\'mornT\',this.value)"></div>'
+'<div class="srow"><div><div class="stitle">Вечернее напоминание</div><div class="ssub">Придёт, если день ещё не закрыт</div></div><div class="tog'+(s.eve?' on':'')+'" onclick="setTog(\'eve\')"></div></div>'
+'<div class="srow"><div class="ssub" style="font-size:15px;color:#111">Время вечером</div><input type="time" value="'+s.eveT+'" onchange="setTime(\'eveT\',this.value)"></div>'
+'<div class="srow"><div><div class="stitle">Напоминание пить воду</div><div class="ssub">Время: '+s.waterT+' (от 10:00 до 20:00)</div></div><div class="tog'+(s.water?' on':'')+'" onclick="setTog(\'water\')"></div></div>'
+'<div class="srow"><input type="range" min="600" max="1200" step="60" value="'+timeToMin(s.waterT)+'" style="width:100%" onchange="setWater(this.value)"></div>'
+'<div class="srow"><div><div class="stitle">Скрыть имя в рейтинге</div><div class="ssub">Другие увидят «Скрытый участник»</div></div><div class="tog'+(s.hide?' on':'')+'" onclick="setTog(\'hide\')"></div></div>'
+'<div class="note">⏰ Время считается по часовому поясу твоего устройства. Сами сообщения бота настраиваются отдельно в Botmother.</div>'
+'<button class="btn" style="background:#fee;border-color:#fcc;color:#c62828" onclick="resetAll()">Сбросить весь прогресс</button></div>';}
function timeToMin(t){var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
window.setWater=function(v){var h=Math.floor(v/60),m=v%60;if(h<10)h='0'+h;if(m<10)m='0'+m;S.set.waterT=h+':'+m;save();renderProfile();};
window.setTog=function(k){S.set[k]=!S.set[k];save();renderProfile();};
window.setTime=function(k,v){S.set[k]=v;save();};
window.resetAll=function(){S=def();save();tab='Привычки';render();};

function render(){renderTabs();renderNav();if(tab==='Привычки')renderHabits();else if(tab==='Рейтинг')renderRating();else if(tab==='Вызовы')renderChallenges();else if(tab==='Настроение')renderMood();else renderProfile();}
window.render=render;
render();
}catch(e){var er=document.getElementById('err');er.style.display='block';er.textContent='Ошибка: '+e.message;}
})();
</script>
</body>
</html>
