<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Трекер LIFE</title>
<style>
:root{--acc:#FFD400;--acc-soft:#FFF6C7;--bg:#F5F5F7;--card:#FFFFFF;--txt:#1C1C1E;--mut:#8E8E93;--line:#ECECEF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'SF Pro Text',Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:86px}
.topbar{background:var(--acc);padding:16px;border-radius:0 0 18px 18px}
.topbar h1{font-size:22px;font-weight:800}
.topbar p{font-size:13px;opacity:.75}
.streak{background:var(--acc);margin:12px 16px 0;padding:14px;border-radius:16px}
.streak b{font-size:15px}
.content{padding:14px 16px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hint{color:#B25E00;background:var(--acc-soft);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.week{display:flex;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 8px;margin-bottom:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.wd i{width:34px;height:34px;border-radius:50%;background:#EFEFF1;display:block}
.wd i.on{background:var(--acc)}
.wd.today span{color:var(--txt);font-weight:700}
.seclbl{font-size:12px;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:14px 4px 8px}
.item{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.check{width:30px;height:30px;border-radius:50%;border:2px solid #E0E0E4;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.check.on{background:var(--acc);border-color:var(--acc);color:#7A5C00}
.item span{flex:1}
.del{border:none;background:none;color:#C7C7CC;font-size:18px;padding:4px 8px}
.del:active{color:#FF3B30}
.addbtn{width:100%;border:none;background:var(--card);border:2px dashed var(--acc);color:#8A6D00;font-weight:700;font-size:15px;padding:13px;border-radius:14px;margin-top:10px}
.addbtn:active{background:var(--acc-soft)}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border-radius:16px;padding:14px 6px;text-align:center}
.stat b{font-size:26px;display:block}
.stat span{font-size:11px;color:var(--mut)}
.ach{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ach .a{background:var(--card);border-radius:14px;padding:14px 6px;text-align:center;font-size:12px;color:var(--mut)}
.ach .a.got{background:var(--acc-soft);border:1.5px solid var(--acc);color:var(--txt);font-weight:600}
.ach .a em{display:block;font-style:normal;font-size:20px;margin-bottom:6px;filter:grayscale(1)}
.ach .a.got em{filter:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dn{font-size:10px;color:var(--mut);text-align:center}
.cal .d{aspect-ratio:1;border-radius:9px;background:#EFEFF1;display:flex;align-items:center;justify-content:center;font-size:11px;color:#B8B8BC}
.cal .d.done{background:var(--acc);color:#6B5200;font-weight:700}
.cal .d.today{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border:none}
.row small{display:block;color:var(--mut);font-size:12px}
.switch{width:50px;height:30px;border-radius:15px;background:#E5E5EA;position:relative;flex:none;transition:.2s}
.switch.on{background:var(--acc)}
.switch i{position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on i{left:22px}
.timepick{border:none;background:#fff;border-radius:12px;padding:8px;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.moods{display:flex;justify-content:space-between;margin:10px 0}
.moods button{font-size:30px;background:#F2F2F4;border:2px solid transparent;border-radius:14px;padding:8px 10px}
.moods button.sel{border-color:var(--acc);background:var(--acc-soft)}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px;font-family:inherit;resize:none}
.primary{width:100%;border:none;background:var(--acc);color:#5C4700;font-weight:800;font-size:16px;padding:14px;border-radius:14px;margin-top:10px}
.chip{display:inline-block;background:var(--acc-soft);color:#8A6D00;border:1px solid var(--acc);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:10px}
.prog{height:8px;background:#EFEFF1;border-radius:4px;overflow:hidden;margin-top:8px}
.prog b{display:block;height:100%;background:var(--acc)}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;padding:6px 0 14px}
.tabbar button{flex:1;border:none;background:none;font-size:10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
.tabbar button em{font-style:normal;font-size:22px}
.tabbar button.on{color:#8A6D00}
#err{display:none;background:#FF3B30;color:#fff;padding:10px 14px;font-size:12px;white-space:pre-wrap}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="err"></div>
  <div id="page"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<script>
window.onerror=function(m,s,l){var e=document.getElementById('err');e.style.display='block';e.textContent='Ошибка в строке '+l+': '+m;};
var TABS=[['hab','✅','Привычки'],['rate','🏆','Рейтинг'],['chal','⚡','Вызовы'],['mood','😊','Настроение'],['prof','👤','Профиль']];
var DEF={habits:[],done:{},streak:0,best:0,total:0,frozen:2,week:[0,0,0,0,0,0,0],rating:[],chals:[],moods:[],set:{morning:true,time:'08:00',evening:true}};
var D=load();
function load(){try{var r=localStorage.getItem('lt9');if(r)return JSON.parse(r);}catch(e){}return JSON.parse(JSON.stringify(DEF));}
function save(){try{localStorage.setItem('lt9',JSON.stringify(D));}catch(e){}}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dayName(){return ['вс','пн','вт','ср','чт','пт','сб'][new Date().getDay()];}
var tab='hab';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  var tb=document.getElementById('tabbar');var h='';
  for(var i=0;i<TABS.length;i++){var t=TABS[i];h+='<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'"><em>'+t[1]+'</em>'+t[2]+'</button>';}
  tb.innerHTML=h;
  var p=document.getElementById('page');
  if(tab==='hab')p.innerHTML=pgHab();
  else if(tab==='rate')p.innerHTML=pgRate();
  else if(tab==='chal')p.innerHTML=pgChal();
  else if(tab==='mood')p.innerHTML=pgMood();
  else p.innerHTML=pgProf();
  var bs=tb.querySelectorAll('button');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){tab=this.getAttribute('data-t');render();};
}
function pgHab(){
  var h='<div class="topbar"><h1>Привычки</h1><p>Трекер LIFE · версия 9</p></div>';
  h+='<div class="streak"><b>День в дисциплине: '+D.streak+'</b></div>';
  var allDone=D.habits.length>0;
  for(var i=0;i<D.habits.length;i++)if(!D.done[D.habits[i].id])allDone=false;
  if(D.habits.length>0)h+='<div class="content"><div class="hint">'+(allDone?'Все задания закрыты — день засчитан!':'Закрой все задания, чтобы засчитать день')+'</div></div>';
  var w='<div class="content"><div class="week">';
  var names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];var td=new Date().getDay();var ti=(td===0?6:td-1);
  for(var k=0;k<7;k++)w+='<div class="wd'+(k===ti?' today':'')+'"><i class="'+(D.week[k]?'on':'')+'"></i><span'+(k===ti?' class="t"':'')+'>'+names[k]+'</span></div>';
  w+='</div><div class="seclbl">ЗАДАНИЯ ДНЯ</div><div class="card">';
  if(D.habits.length===0)h=w+'<div class="empty">Привычек пока нет.<br>Добавь первую кнопку ниже 👇</div>';
  else{
    for(var i2=0;i2<D.habits.length;i2++){
      var hb=D.habits[i2];var on=!!D.done[hb.id];
      h+='<div class="item"><div class="check'+(on?' on':'')+'" data-ck="'+hb.id+'">'+(on?'✓':'')+'</div><span>'+esc(hb.name)+'</span><button class="del" data-dh="'+hb.id+'">✕</button></div>';
    }
  }
  h+='</div><button class="addbtn" data-add="hab">＋ Добавить привычку</button></div>';
  return h;
}
function pgRate(){
  var h='<div class="topbar"><h1>Рейтинг</h1><p>Участники сообщества</p></div><div class="content">';
  if(D.rating.length===0)h+='<div class="card"><div class="empty">Пока никого нет — рейтинг пуст.<br>Добавь участников, с кем хочешь сравниваться 👇</div></div>';
  else{
    h+='<div class="card">';
    for(var i=0;i<D.rating.length;i++){
      var u=D.rating[i];
      h+='<div class="row"><span><b>'+esc(u.name)+'</b></span><span style="display:flex;align-items:center;gap:8px"><button class="del" data-rm="'+u.id+'">−</button><b>'+u.days+'</b><button class="del" data-rp="'+u.id+'">＋</button><button class="del" data-dr="'+u.id+'">✕</button></span></div>';
    }
    h+='</div>';
  }
  h+='<button class="addbtn" data-add="rate">＋ Добавить участника</button></div>';
  return h;
}
function pgChal(){
  var h='<div class="topbar"><h1>Вызовы</h1><p>Твои личные испытания</p></div><div class="content">';
  if(D.chals.length===0)h+='<div class="card"><div class="empty">Вызовов нет. Создай свой — например,<br>«30 дней без сахара» 👇</div></div>';
  else{
    for(var i=0;i<D.chals.length;i++){
      var c=D.chals[i];
      h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(c.name)+'</b><button class="del" data-dc="'+c.id+'">✕</button></div>';
      h+='<div class="prog"><b style="width:'+Math.min(100,Math.round(c.d/c.total*100))+'%"></b></div>';
      h+='<small style="color:var(--mut);font-size:12px">'+c.d+' из '+c.total+' дней</small>';
      h+='<button class="addbtn" data-cm="'+c.id+'" style="margin-top:8px">＋ Отметить день</button></div>';
    }
  }
  h+='<button class="addbtn" data-add="chal">＋ Добавить вызов</button></div>';
  return h;
}
function pgMood(){
  var h='<div class="topbar"><h1>Настроение</h1><p>Как ты сегодня?</p></div><div class="content">';
  h+='<div class="card"><div class="moods">';
  var ms=['😄','🙂','😐','🙁','😢'];
  for(var i=0;i<5;i++)h+='<button data-m="'+i+'">'+ms[i]+'</button>';
  h+='</div><textarea id="mnote" rows="3" placeholder="Пара слов о дне…"></textarea>';
  h+='<button class="primary" data-save="mood">Сохранить</button></div><div class="seclbl">ИСТОРИЯ</div>';
  if(D.moods.length===0)h+='<div class="card"><div class="empty">Записей ещё нет</div></div>';
  else{
    h+='<div class="card">';
    for(var j=0;j<D.moods.length;j++){var m=D.moods[j];h+='<div class="row"><span>'+ms[m.m]+' <small>'+esc(m.note||'')+'</small></span><span style="text-align:right"><small>'+m.date+'</small><button class="del" data-dm="'+m.id+'">✕</button></span></div>';}
    h+='</div>';
  }
  h+='</div>';return h;
}
function pgProf(){
  var h='<div class="topbar"><h1>Профиль</h1><p>Света · участник сообщества</p></div><div class="content">';
  h+='<div class="chip">Версия 9 · ярко-жёлтый</div>';
  h+='<div class="stats"><div class="stat"><b>'+D.streak+'</b><span>текущая серия</span></div><div class="stat"><b>'+D.best+'</b><span>лучшая серия</span></div><div class="stat"><b>'+D.total+'</b><span>всего дней</span></div></div>';
  h+='<div class="card" style="margin-top:12px"><b>❄️ Заморозки: '+D.frozen+' из 2</b><br><small style="color:var(--mut)">Если пропустите день, заморозка сработает сама и сохранит серию. Обновляются каждый месяц.</small></div>';
  h+='<div class="seclbl">ДОСТИЖЕНИЯ · 1 из 11</div><div class="ach">';
  var a=[['🌱','Первый шаг','закрыть 1 день',D.total>=1],['⚡','Разгон','серия 3 дня',D.best>=3],['🔥','Неделя дисциплины','серия 7 дней',D.best>=7],['💪','Две недели','серия 14 дней',D.best>=14],['🥇','Месяц силы','серия 30 дней',D.best>=30],['💎','Полсотни','серия 50 дней',D.best>=50],['👑','Легенда','серия 100 дней',D.best>=100],['📅','30 дней в деле','30 закрытых дней',D.total>=30],['🎯','Вызов принят','пройти вызов',false],['🏆','Охотник за вызовами','5 вызовов',false],['🤝','Опора сообщества','10 поддержек',false]];
  for(var i=0;i<a.length;i++)h+='<div class="a'+(a[i][3]?' got':'')+'"><em>'+a[i][0]+'</em><b>'+a[i][1]+'</b><br>'+a[i][2]+'</div>';
  h+='</div>';
  h+='<div class="seclbl">ПОСЛЕДНИЕ 5 НЕДЕЛЬ</div><div class="card"><div class="cal">';
  var dn=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  for(var q=0;q<7;q++)h+='<div class="dn">'+dn[q]+'</div>';
  var now=new Date();var st=new Date(now);st.setDate(st.getDate()-34);
  var off=(st.getDay()+6)%7;
  for(var z=0;z<off;z++)h+='<div class="d"></div>';
  for(var d2=0;d2<35;d2++){
    var dd=new Date(st);dd.setDate(st.getDate()+d2);
    var key=dd.getFullYear()+'-'+(dd.getMonth()+1)+'-'+dd.getDate();
    var doneD=D.dates&&D.dates[key];
    var isT=(key===todayKey());
    h+='<div class="d'+(doneD?' done':'')+(isT?' today':'')+'">'+dd.getDate()+'</div>';
  }
  h+='</div></div>';
  h+='<div class="seclbl">НАСТРОЙКИ</div><div class="card">';
  h+='<div class="row"><span><b>Утреннее сообщение</b><small>Серия и задания на день</small></span><div class="switch'+(D.set.morning?' on':'')+'" data-sw="morning"><i></i></div></div>';
  h+='<div class="row"><span><b>Время утром</b><small>По вашему часовому поясу</small></span><input type="time" class="timepick" value="'+esc(D.set.time)+'" data-time="1"></div>';
  h+='<div class="row"><span><b>Вечернее напоминание</b><small>Придёт, если день ещё не закрыт</small></span><div class="switch'+(D.set.evening?' on':'')+'" data-sw="evening"><i></i></div></div>';
  h+='</div>';
  h+='<button class="addbtn" data-reset="1" style="border-color:#FFD1D1;color:#C0392B">Сбросить весь прогресс</button></div>';
  return h;
}
document.getElementById('app').addEventListener('click',function(ev){
  var el=ev.target;
  var f=function(a){while(el&&el!==this&&!el.getAttribute(a))el=el.parentNode;return el&&el!==this?el:null;};
  var n;
  if(n=f.call(this,'data-t')){tab=n.getAttribute('data-t');render();return;}
  if(n=f.call(this,'data-ck')){var id=n.getAttribute('data-ck');
    if(D.done[id])delete D.done[id];else D.done[id]=1;
    var all=true;for(var i=0;i<D.habits.length;i++)if(!D.done[D.habits[i].id])all=false;
    if(all&&D.habits.length>0){
      var t=new Date().getDay();var ti=(t===0?6:t-1);
      if(!D.week[ti]){D.week[ti]=1;D.streak++;D.total++;if(D.streak>D.best)D.best=D.streak;
        D.dates=D.dates||{};D.dates[todayKey()]=1;}
    }
    save();render();return;}
  if(n=f.call(this,'data-dh')){var id2=n.getAttribute('data-dh');
    D.habits=D.habits.filter(function(x){return x.id!==id2;});delete D.done[id2];save();render();return;}
  if(n=f.call(this,'data-add')){var w=n.getAttribute('data-add');
    if(w==='hab'){var nm=prompt('Название привычки:');if(nm&&nm.trim())D.habits.push({id:'h'+Date.now(),name:nm.trim()});}
    if(w==='rate'){var nm2=prompt('Имя участника:');if(nm2&&nm2.trim())D.rating.push({id:'r'+Date.now(),name:nm2.trim(),days:0});}
    if(w==='chal'){var nm3=prompt('Название вызова:');if(nm3&&nm3.trim()){var dd=prompt('На сколько дней?','30');D.chals.push({id:'c'+Date.now(),name:nm3.trim(),d:0,total:parseInt(dd)||30});}}
    save();render();return;}
  if(n=f.call(this,'data-rp')){var r1=D.rating.filter(function(x){return x.id===n.getAttribute('data-rp');})[0];if(r1){r1.days++;save();render();}return;}
  if(n=f.call(this,'data-rm')){var r2=D.rating.filter(function(x){return x.id===n.getAttribute('data-rm');})[0];if(r2&&r2.days>0){r2.days--;save();render();}return;}
  if(n=f.call(this,'data-dr')){D.rating=D.rating.filter(function(x){return x.id!==n.getAttribute('data-dr');});save();render();return;}
  if(n=f.call(this,'data-cm')){var c=D.chals.filter(function(x){return x.id===n.getAttribute('data-cm');})[0];if(c){c.d++;if(c.d>=c.total)alert('Вызов пройден! 🎉');save();render();}return;}
  if(n=f.call(this,'data-dc')){D.chals=D.chals.filter(function(x){return x.id!==n.getAttribute('data-dc');});save();render();return;}
  if(n=f.call(this,'data-m')){var bs=document.querySelectorAll('.moods button');for(var i2=0;i2<5;i2++)bs[i2].classList.remove('sel');n.classList.add('sel');n.setAttribute('data-sel','1');return;}
  if(n=f.call(this,'data-save')){var sn=document.querySelector('.moods button.sel');var mi=sn?sn.getAttribute('data-sel'):null;
    if(mi===null){alert('Выбери смайлик 🙂');return;}
    D.moods.unshift({id:'m'+Date.now(),m:parseInt(mi),note:document.getElementById('mnote').value,date:todayKey()});save();render();return;}
  if(n=f.call(this,'data-dm')){D.moods=D.moods.filter(function(x){return x.id!==n.getAttribute('data-dm');});save();render();return;}
  if(n=f.call(this,'data-sw')){var k=n.getAttribute('data-sw');D.set[k]=!D.set[k];save();render();return;}
  if(n=f.call(this,'data-reset')){if(confirm('Обнулить весь прогресс?')){D=JSON.parse(JSON.stringify(DEF));save();render();}return;}
});
document.getElementById('app').addEventListener('change',function(ev){
  if(ev.target.getAttribute&&ev.target.getAttribute('data-time')){D.set.time=ev.target.value;save();}
});
render();
</script>
</body>
</html>
