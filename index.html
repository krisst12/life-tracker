<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Трекер LIFE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Arial,sans-serif}
body{background:#f6f6f8;padding-bottom:90px}
#err{display:none;background:#d93025;color:#fff;font-size:11px;padding:4px 10px;word-break:break-all}
.wrap{max-width:640px;margin:0 auto;padding:12px}
.header{background:#ffd21e;border-radius:18px;padding:16px;margin-bottom:12px}
.header h1{font-size:22px}
.header .ver{display:inline-block;background:#fff;border-radius:10px;padding:3px 10px;font-size:13px;margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 16px;border-radius:20px;border:none;background:#e9e9ee;font-size:14px;font-weight:600;color:#333}
.tab.active{background:#111;color:#ffd21e}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pcard{display:flex;align-items:center;gap:12px}
.pcard img,.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e5e5ea;display:flex;align-items:center;justify-content:center;font-size:20px;color:#888}
.pname{font-weight:700;font-size:17px}
.psub{font-size:13px;color:#888}
.btn{width:100%;padding:13px;border:none;border-radius:14px;background:#111;color:#ffd21e;font-size:15px;font-weight:700;margin-top:10px}
.btn.ghost{background:#f0f0f4;color:#333}
input[type=text]{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;margin-top:8px;outline:none}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.hrow:last-child{border-bottom:none}
.circle{width:26px;height:26px;border-radius:50%;border:2px solid #111;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.circle.done{background:#111;color:#ffd21e}
.hname{flex:1;font-size:15px}
.hname.st{ text-decoration:line-through;color:#aaa}
.x{background:none;border:none;color:#ccc;font-size:18px;padding:4px}
.bar{height:8px;background:#eee;border-radius:4px;margin:8px 0}
.bar>div{height:100%;background:#ffd21e;border-radius:4px}
.small{font-size:12px;color:#888}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;font-size:10px;color:#aaa;font-weight:700}
.cell{aspect-ratio:1;border-radius:8px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999}
.cell.full{background:#111;color:#ffd21e}
.cell.part{background:#ffe98a;color:#663c00}
.cell.m1{background:#ff8a80}.cell.m2{background:#ffb74d}.cell.m3{background:#ffe082}.cell.m4{background:#aed581}.cell.m5{background:#81c784}
.cell.today{outline:2px solid #111}
.moodbtn{font-size:30px;background:#f6f6f8;border:2px solid transparent;border-radius:14px;padding:8px;cursor:pointer}
.moodbtn.sel{border-color:#111;background:#ffe98a}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.medal{font-size:20px;width:26px;text-align:center}
.fire{background:#fff0d6;border:none;border-radius:12px;padding:7px 12px;font-size:14px;flex-shrink:0}
.fire:disabled{opacity:.35}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 4px 14px;border-top:1px solid #eee;z-index:5}
.bnav{background:none;border:none;font-size:10px;color:#8e8e93;display:flex;flex-direction:column;align-items:center;gap:2px}
.bnav .ico{font-size:20px}
.bnav.active{color:#c79a00}
.switch{width:46px;height:26px;border-radius:13px;background:#ddd;position:relative;flex-shrink:0;transition:.2s}
.switch.on{background:#34c759}
.switch::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.switch.on::after{left:22px}
.srow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.srow .lab{flex:1}
.lab b{display:block;font-size:14px}
.lab span{font-size:12px;color:#888}
.ach{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0}
.ach:last-child{border:none}
.ach .ico{font-size:24px;filter:grayscale(1);opacity:.45}
.ach.got .ico{filter:none;opacity:1}
.ach .t{font-size:14px;font-weight:600}
.ach .d{font-size:12px;color:#888}
.mot{background:#fff8dd;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px;display:none}
.stat{display:flex;gap:8px;margin-top:10px}
.stat>div{flex:1;background:#f6f6f8;border-radius:12px;padding:10px;text-align:center}
.stat .n{font-size:18px;font-weight:800}
.stat .l{font-size:10px;color:#888}
.section{font-size:12px;font-weight:800;color:#999;letter-spacing:.5px;margin:14px 0 8px}
</style>
</head>
<body>
<div id="err"></div>
<div class="wrap">
  <div class="header"><h1>🔥 Трекер LIFE</h1><span class="ver">Версия 20</span></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>
<div class="bottom" id="bottom"></div>
<script>
try{
window.onerror=function(m){var e=document.getElementById('err');e.style.display='block';e.textContent='Ошибка: '+m;};

/* ---------- профиль ---------- */
var TGU=null;
try{
  var tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){tg.ready&&tg.ready();tg.expand&&tg.expand();
    var u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(u&&u.first_name)TGU={name:u.first_name+(u.last_name?' '+u.last_name:''),photo:(u.photo_url)||null};
  }
  if(!TGU){ /* запасной разбор строки initData */
    var raw=location.hash||location.search;
    var m=raw.match(/user=([^&]+)/);
    if(m){try{var p=JSON.parse(decodeURIComponent(m[1]));TGU={name:(p.first_name||'')+(p.last_name?' '+p.last_name:''),photo:p.photo_url||null};}catch(e){}}
  }
}catch(e){}
var APP={key:'lifeTracker20'};
APP.st=JSON.parse(localStorage.getItem(APP.key)||'null')||{habits:[],moods:[],challenges:[],settings:{morning:1,water1:1,water2:1,evening:1,hideName:0},customName:'',supportLog:{}};
APP.save=function(){localStorage.setItem(APP.key,JSON.stringify(APP.st));};
APP.today=function(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);};
APP.myName=function(){return TGU?TGU.name:(APP.st.customName||'Гость');};
APP.myPhoto=function(){return TGU?TGU.photo:null;};

/* ---------- данные ---------- */
function closedDates(){
  var set={};
  APP.st.habits.forEach(function(h){Object.keys(h.history||{}).forEach(function(d){if(h.history[d])set[d]=true;});});
  return set;
}
function fullyClosed(){ // даты, где выполнены ВСЕ существующие привычки
  var out={};
  if(!APP.st.habits.length)return out;
  var all={};
  APP.st.habits.forEach(function(h){Object.keys(h.history||{}).forEach(function(d){all[d]=true;});});
  Object.keys(all).forEach(function(d){
    var ok=true;APP.st.habits.forEach(function(h){if(!h.history[d])ok=false;});
    if(ok)out[d]=true;
  });
  return out;
}
function stats(){
  var f=fullyClosed(),days=Object.keys(f).length,streak=0;
  var d=new Date();
  for(var i=0;i<400;i++){var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    if(f[k])streak++;else if(i>0)break;
    d.setDate(d.getDate()-1);}
  var sup=0;Object.keys(APP.st.supportLog).forEach(function(k){sup+=Object.keys(APP.st.supportLog[k]).length;});
  var ch=APP.st.challenges.filter(function(c){return c.done>=c.total;}).length;
  return {days:days,streak:streak,supports:sup,challenges:ch};
}
var ACH=[
 ['👟','Первый шаг','Закрыт первый день',function(s){return s.days>=1}],
 ['🚀','Разгон','Серия из 3 дней подряд',function(s){return s.streak>=3}],
 ['📅','Неделя дисциплины','Серия из 7 дней подряд',function(s){return s.streak>=7}],
 ['🗓️','Две недели','Серия из 14 дней подряд',function(s){return s.streak>=14}],
 ['💪','Месяц силы','Серия из 30 дней подряд',function(s){return s.streak>=30}],
 ['⚡','Полсотни','Серия из 50 дней подряд',function(s){return s.streak>=50}],
 ['🏆','Легенда','Серия из 100 дней подряд',function(s){return s.streak>=100}],
 ['🌟','30 дней в деле','30 закрытых дней (не обязательно подряд)',function(s){return s.days>=30}],
 ['🎯','Вызов принят','Пройти один вызов до конца',function(s){return s.challenges>=1}],
 ['🎖️','Охотник за вызовами','Пройти 5 вызовов до конца',function(s){return s.challenges>=5}],
 ['🤝','Опора сообщества','Поддержать участников 10 раз',function(s){return s.supports>=10}]
];

/* ---------- рендер ---------- */
var TABS=[['habits','Привычки','✅'],['rating','Рейтинг','🏆'],['challenges','Вызовы','⚡'],['mood','Настроение','🙂'],['profile','Профиль','👤']];
var cur='habits';
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function profileCard(sub){
  var img=APP.myPhoto()?'<img src="'+APP.myPhoto()+'" onerror="this.style.display=\'none\'">':'<div class="avatar">👤</div>';
  return '<div class="card pcard">'+img+'<div><div class="pname">'+esc(APP.myName())+'</div><div class="psub">'+(sub||'')+'</div></div></div>';
}
function nameEditor(){
  if(TGU)return '';
  return '<div class="card"><div class="small">Telegram не передал имя — впиши его один раз, и оно сохранится:</div><input type="text" id="nm" placeholder="Твоё имя" value="'+esc(APP.st.customName)+'"><button class="btn" onclick="saveName()">Сохранить имя</button></div>';
}
window.saveName=function(){APP.st.customName=(document.getElementById('nm').value||'').trim()||'Участник';APP.save();render();};
function cal5(classFn){
  var dows=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],h='<div class="section">КАЛЕНДАРЬ · 5 НЕДЕЛЬ</div><div class="card"><div class="cal">';
  dows.forEach(function(w){h+='<div class="dow">'+w+'</div>';});
  var d=new Date();d.setHours(0,0,0,0);
  d.setDate(d.getDate()-34-((d.getDay()||7)-1));
  for(var i=0;i<35;i++){var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    h+='<div class="cell '+(classFn?classFn(k):'')+(k===APP.today()?' today':'')+'">'+d.getDate()+'</div>';
    d.setDate(d.getDate()+1);}
  return h+'</div></div>';
}
function pct(n){return Math.round(n*100)+'%';}

function viewHabits(){
  var s=stats(),t=APP.today(),done=0;
  APP.st.habits.forEach(function(h){if(h.history&&h.history[t])done++;});
  var p=APP.st.habits.length?done/APP.st.habits.length:0;
  var days30=0,tot30=0,d=new Date();
  for(var i=0;i<30;i++){var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    if(APP.st.habits.length){tot30++;APP.st.habits.forEach(function(h){if(h.history&&h.history[k])days30++;});}
    d.setDate(d.getDate()-1);}
  var p30=APP.st.habits.length?(days30/(APP.st.habits.length*30)):0;
  var rows='';
  APP.st.habits.forEach(function(h){
    var ok=h.history&&h.history[t];
    rows+='<div class="hrow"><div class="circle '+(ok?'done':'')+'" onclick="toggleH(\''+h.id+'\')">'+(ok?'✓':'')+'</div><div class="hname '+(ok?'st':'')+'">'+esc(h.name)+'</div><button class="x" onclick="delH(\''+h.id+'\')">✕</button></div>';
  });
  var h=profileCard('Серия: '+s.streak+' · дней: '+s.days)
    +'<div class="card"><div class="small">Выполнено сегодня: '+pct(p)+' · за 30 дней: '+pct(p30)+'</div><div class="bar"><div style="width:'+Math.round(p*100)+'%"></div></div>'
    +(rows||'<div class="small" style="text-align:center;padding:10px">Пока нет привычек. Добавь первую!</div>')
    +'<input type="text" id="newH" placeholder="Новая привычка"><button class="btn" onclick="addH()">＋ Добавить привычку</button><div class="mot" id="mot"></div></div>'
    +nameEditor()
    +cal5(function(k){var f=fullyClosed();if(f[k])return 'full';var any=0,tot=0;APP.st.habits.forEach(function(hh){tot++;if(hh.history&&hh.history[k])any++;});return tot&&any?'part':'';});
  return h;
}
window.addH=function(){var v=document.getElementById('newH').value.trim();if(!v)return;APP.st.habits.push({id:'h'+Date.now(),name:v,history:{}});APP.save();render();};
window.delH=function(id){APP.st.habits=APP.st.habits.filter(function(h){return h.id!==id;});APP.save();render();};
window.toggleH=function(id){
  var h=APP.st.habits.filter(function(x){return x.id===id;})[0];if(!h)return;
  var t=APP.today();h.history=h.history||{};
  var closing=false;
  if(h.history[t]){delete h.history[t];}else{h.history[t]=1;}
  var f=fullyClosed();
  if(f[t]&&!APP.st._closed[t]){closing=true;APP.st._closed=APP.st._closed||{};APP.st._closed[t]=1;}
  APP.save();
  var m=document.getElementById('mot');
  if(m){m.style.display='block';
    if(closing){m.textContent='🔥 День закрыт! Серия: '+stats().streak+'. Так держать!';}
    else{m.textContent=['Отличный шаг! 💪','Ещё один шаг к цели! 🔥','Так держать! ✨','Дисциплина — это ты! 👊','Прогресс налицо! 🚀'][Math.floor(Math.random()*5)];}
  }
  if(!m||closing)render();else drawTab();
};

function viewRating(){
  var s=stats(),t=APP.today(),all=1;
  APP.st.habits.forEach(function(h){if(!h.history||!h.history[t])all=0;});
  var dayOk=APP.st.habits.length&&all;
  var myKey='me';
  var log=APP.st.supportLog[t]||{};
  var hide=APP.st.settings.hideName;
  var row='<div class="rrow"><div class="medal">🥇</div>'+(APP.myPhoto()?'<img src="'+APP.myPhoto()+'" class="avatar">':'<div class="avatar">👤</div>')+
    '<div style="flex:1"><div class="pname">'+(hide?'Скрытый участник':esc(APP.myName()))+'</div><div class="psub">Закрыто дней: '+s.days+' · 🔥 '+Object.keys(APP.st.supportLog).reduce(function(a,k){return a+0;},0)+' получено</div><div class="psub">'+(dayOk?'✅ всё выполнено':'')+'</div></div>'+
    '<button class="fire" disabled title="Себя поддержать нельзя">🔥 '+0+'</button></div>';
  return '<div class="card pcard"><div style="flex:1"><div class="pname">'+(hide?'Скрытый участник':esc(APP.myName()))+'</div><div class="psub">Твоё место: 1</div></div></div>'
    +'<div class="card">'+row+'<div class="small" style="text-align:center;padding:10px">Участники, вступившие в бота, появятся здесь автоматически (нужен общий сервер — следующий шаг)</div></div>';
}

function viewChallenges(){
  var s=stats(),h='<div class="card">';
  APP.st.challenges.forEach(function(c){
    var p=c.total?c.done/c.total:0;
    h+='<div class="card"><div class="pname">'+esc(c.name)+'</div><div class="psub">Срок: '+c.total+' дней · участников: '+c.members+'</div><div class="bar"><div style="width:'+Math.round(p*100)+'%"></div></div><div class="small">Пройдено: '+c.done+' из '+c.total+'</div><button class="btn" onclick="markC(\''+c.id+'\')">＋ Отметить день</button><button class="btn ghost" onclick="acceptC(\''+c.id+'\')">Принять вызов</button></div>';
  });
  h+='<input type="text" id="cn" placeholder="Название вызова"><input type="text" id="cd" placeholder="Срок в днях" inputmode="numeric"><button class="btn" onclick="addC()">Бросить вызов</button></div>';
  return h;
}
window.addC=function(){
  var n=document.getElementById('cn').value.trim()||'Вызов',d=parseInt(document.getElementById('cd').value)||7;
  APP.st.challenges.push({id:'c'+Date.now(),name:n,total:d,done:0,members:1,accepted:true});APP.save();render();
};
window.markC=function(id){var c=APP.st.challenges.filter(function(x){return x.id===id;})[0];if(c&&c.done<c.total){c.done++;APP.save();render();}};
window.acceptC=function(id){var c=APP.st.challenges.filter(function(x){return x.id===id;})[0];if(c){c.accepted=true;c.members=Math.max(c.members,1);APP.save();render();}};

function viewMood(){
  var em=['😞','😕','😐','🙂','😍'],h='<div class="card"><div class="small">Как ты себя чувствуешь сегодня?</div><div style="display:flex;justify-content:space-around;margin-top:10px">';
  var sel=null,t=APP.today();
  APP.st.moods.forEach(function(m){if(m.date===t)sel=m.emoji;});
  em.forEach(function(e,i){h+='<button class="moodbtn '+(sel===e?'sel':'')+'" onclick="setMood('+i+')">'+e+'</button>';});
  h+='</div><input type="text" id="mnote" placeholder="Заметка о дне" value="'+esc((APP.st.moods.filter(function(m){return m.date===t;})[0]||{}).note||'')+'"><button class="btn" onclick="saveMood()">Сохранить</button></div>';
  var avg=0;if(APP.st.moods.length){APP.st.moods.forEach(function(m){avg+=(em.indexOf(m.emoji)+1);});avg=avg/APP.st.moods.length;}
  h+='<div class="card"><div class="small">Самочувствие за всё время: '+(APP.st.moods.length?pct((avg-1)/4):'—')+'</div></div>';
  var map={};APP.st.moods.forEach(function(m){map[m.date]=em.indexOf(m.emoji)+1;});
  h+=cal5(function(k){return map[k]?'m'+map[k]:'';});
  return h;
}
window.setMood=function(i){var t=APP.today(),em=['😞','😕','😐','🙂','😍'],ex=APP.st.moods.filter(function(m){return m.date===t;})[0];
  if(ex)ex.emoji=em[i];else APP.st.moods.push({date:t,emoji:em[i],note:''});APP.save();render();};
window.saveMood=function(){var t=APP.today(),n=document.getElementById('mnote').value,ex=APP.st.moods.filter(function(m){return m.date===t;})[0];
  if(ex)ex.note=n;else APP.st.moods.push({date:t,emoji:'😐',note:n});APP.save();render();};

function viewProfile(){
  var s=stats(),st=APP.st.settings;
  var h=profileCard('Дней: '+s.days+' · серия: '+s.streak)
    +'<div class="stat"><div><div class="n">'+s.days+'</div><div class="l">дней закрыто</div></div><div><div class="n">'+s.streak+'</div><div class="l">серия</div></div><div><div class="n">'+s.challenges+'</div><div class="l">вызовы</div></div><div><div class="n">'+s.supports+'</div><div class="l">поддержки</div></div></div>'
    +'<div class="card"><div class="small" style="margin-top:6px">🧊 Заморозки: 2 из 2</div></div>'
    +'<div class="section">ДОСТИЖЕНИЯ</div><div class="card">';
  ACH.forEach(function(a){var got=a[3](s);
    h+='<div class="ach '+(got?'got':'')+'"><div class="ico">'+a[0]+'</div><div><div class="t">'+a[1]+' '+(got?'✅':'')+'</div><div class="d">'+a[2]+'</div></div></div>';});
  h+='</div>'
    +cal5(function(k){var f=fullyClosed();if(f[k])return 'full';var any=0,tot=0;APP.st.habits.forEach(function(hh){tot++;if(hh.history&&hh.history[k])any++;});return tot&&any?'part':'';})
    +'<div class="section">НАПОМИНАНИЯ ПРИХОДЯТ: 08:00 · 10:00 · 15:00 · 20:00</div><div class="card">';
  var rows=[['morning','Утреннее напоминание','Задания на день · 08:00'],['water1','Напоминание пить воду №1','10:00'],['water2','Напоминание пить воду №2','15:00'],['evening','Вечернее напоминание','Придёт, если день ещё не закрыт · 20:00'],['hideName','Скрыть имя в рейтинге','Твоё имя не увидят другие']];
  rows.forEach(function(r){
    h+='<div class="srow"><div class="lab"><b>'+r[1]+'</b><span>'+r[2]+'</span></div><div class="switch '+(st[r[0]]?'on':'')+'" onclick="tog(\''+r[0]+'\')"></div></div>';});
  h+='</div><div class="card"><button class="btn ghost" onclick="resetAll()">Сбросить весь прогресс</button></div>';
  return h;
}
window.tog=function(k){APP.st.settings[k]=APP.st.settings[k]?0:1;APP.save();drawTab();};
window.resetAll=function(){if(confirm('Точно сбросить весь прогресс?')){APP.st={habits:[],moods:[],challenges:[],settings:{morning:1,water1:1,water2:1,evening:1,hideName:0},customName:APP.st.customName,supportLog:{}};APP.save();render();}};

function drawTab(){
  var c=document.getElementById('content');
  c.innerHTML=cur==='habits'?viewHabits():cur==='rating'?viewRating():cur==='challenges'?viewChallenges():cur==='mood'?viewMood():viewProfile();
}
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="tab '+(cur===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
  document.getElementById('bottom').innerHTML=TABS.map(function(t){return '<button class="bnav '+(cur===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')"><span class="ico">'+t[2]+'</span>'+t[1]+'</button>';}).join('');
  drawTab();
}
window.go=function(t){cur=t;render();window.scrollTo(0,0);};
render();
}catch(e){var er=document.getElementById('err');er.style.display='block';er.textContent='Ошибка: '+e.message;}
</script>
</body>
</html>
