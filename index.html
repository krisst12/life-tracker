<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Трекер LIFE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#f2f2f7;color:#111;padding-bottom:80px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.errbar{display:none;background:#e53935;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;margin:8px auto;max-width:560px;word-break:break-all}
.header{background:#FFD400;border-radius:16px;padding:16px;margin-bottom:12px}
.header h1{font-size:24px;margin-bottom:6px}
.ver{display:inline-block;background:rgba(0,0,0,.15);padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.tab{flex:0 0 auto;background:#e9e9eb;border:none;border-radius:20px;padding:9px 16px;font-size:14px;font-weight:600;color:#333}
.tab.on{background:#111;color:#FFD400}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pcard{display:flex;align-items:center;gap:12px}
.ava{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#ddd;flex:0 0 auto}
.ava-letter{width:52px;height:52px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#555;flex:0 0 auto}
.pname{font-size:18px;font-weight:700}
.psub{font-size:13px;color:#777}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.hrow:last-child{border-bottom:none}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #ccc;background:#fff;flex:0 0 auto;font-size:15px}
.chk.on{background:#FFD400;border-color:#FFD400}
.hname{flex:1;font-size:16px}
.hname.done{text-decoration:line-through;color:#aaa}
.del{background:none;border:none;font-size:20px;color:#c33;padding:4px}
.big{display:block;width:100%;background:#111;color:#FFD400;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;margin-top:12px}
input[type=text]{width:100%;border:1.5px solid #ddd;border-radius:12px;padding:12px;font-size:16px;margin-top:12px}
.bar{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#FFC400}
.small{font-size:13px;color:#777}
.muted{color:#999;font-size:14px;text-align:center;padding:14px 0}
.cal{background:#f7f7f8;border-radius:14px;padding:12px}
.crow{display:flex;gap:6px;margin-bottom:6px}
.cday{flex:1;aspect-ratio:1;border-radius:10px;background:#ececee;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999}
.cday.cpart{background:#FFF3B0;color:#7a6a00}
.cday.cfull{background:#FFD400;color:#111;font-weight:700}
.cday.ctoday{outline:2px solid #E8890C;outline-offset:-2px}
.cday.m1{background:#ff8a80}.cday.m2{background:#ffcc80}.cday.m3{background:#fff59d}.cday.m4{background:#c5e1a5}.cday.m5{background:#a5d6a7}
.lbl{font-size:12px;font-weight:700;color:#999;letter-spacing:.5px;margin-bottom:8px}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.medal{font-size:22px;width:28px;text-align:center;flex:0 0 auto}
.firebtn{background:#fff3e0;border:1px solid #ffd9a0;border-radius:20px;padding:5px 10px;font-size:14px;flex:0 0 auto}
.firebtn.off{opacity:.35}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.sw{width:50px;height:30px;border-radius:15px;background:#dcdce0;position:relative;flex:0 0 auto;transition:.2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#E8890C}
.sw.on i{left:23px}
select,input[type=time]{border:1.5px solid #ddd;border-radius:10px;padding:8px;font-size:15px;background:#fff}
.chbtn{background:#eee;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600}
.emoji{font-size:34px;padding:8px;border-radius:14px;border:2px solid transparent;background:#f4f4f5}
.emoji.on{border-color:#E8890C;background:#fff3e0}
textarea{width:100%;border:1.5px solid #ddd;border-radius:12px;padding:12px;font-size:15px;margin-top:10px;min-height:70px;font-family:inherit}
.ach{background:#f4f4f5;border-radius:14px;padding:12px 10px;text-align:center;opacity:.45}
.ach.open{opacity:1;background:#fff8e0;border:1.5px solid #E8890C}
.ach .ic{font-size:26px}
.ach .t{font-size:13px;font-weight:700;margin-top:4px}
.ach .d{font-size:11px;color:#777;margin-top:2px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:#f4f4f5;border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:#777}
.mot{background:#fff8e0;border:1px solid #f0d060;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5ea;display:flex;padding:6px 0 10px;z-index:10}
.nbtn{flex:1;background:none;border:none;font-size:11px;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.nbtn .ic{font-size:22px}
.nbtn.on{color:#E8890C;font-weight:700}
h2.sec{font-size:13px;font-weight:800;color:#999;letter-spacing:.8px;margin:16px 0 8px}
</style>
</head>
<body>
<div class="errbar" id="errbar"></div>
<div class="wrap">
<div class="header"><h1>&#128293; Трекер LIFE</h1><span class="ver">Версия 16</span></div>
<div class="tabs">
<button class="tab" id="tb_habits" onclick="showTab('habits')">Привычки</button>
<button class="tab" id="tb_rating" onclick="showTab('rating')">Рейтинг</button>
<button class="tab" id="tb_chal" onclick="showTab('chal')">Вызовы</button>
<button class="tab" id="tb_mood" onclick="showTab('mood')">Настроение</button>
<button class="tab" id="tb_prof" onclick="showTab('prof')">Профиль</button>
</div>
<div id="view"></div>
</div>
<div class="nav">
<button class="nbtn" id="nb_habits" onclick="showTab('habits')"><span class="ic">&#9989;</span>Привычки</button>
<button class="nbtn" id="nb_rating" onclick="showTab('rating')"><span class="ic">&#127942;</span>Рейтинг</button>
<button class="nbtn" id="nb_chal" onclick="showTab('chal')"><span class="ic">&#9889;</span>Вызовы</button>
<button class="nbtn" id="nb_mood" onclick="showTab('mood')"><span class="ic">&#128522;</span>Настроение</button>
<button class="nbtn" id="nb_prof" onclick="showTab('prof')"><span class="ic">&#128100;</span>Профиль</button>
</div>
<script>
window.onerror=function(m){var e=document.getElementById('errbar');if(e){e.style.display='block';e.textContent='Ошибка: '+m;}};

var USER={id:'me',name:'Гость',photo:null};
try{
 if(window.Telegram&&window.Telegram.WebApp){
  Telegram.WebApp.ready();Telegram.WebApp.expand();
  var u=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user;
  if(u&&u.id){USER={id:'u'+u.id,name:((u.first_name||'')+' '+(u.last_name||'')).trim()||'Участник',photo:u.photo_url||null};}
 }
}catch(e){}

var S=loadState();
function loadState(){
 try{var r=localStorage.getItem('life_v16');if(r)return JSON.parse(r);}catch(e){}
 return {habits:[],mood:[],challenges:[],fired:{},firedCount:0,settings:{morning:true,morningTime:'07:00',evening:true,eveningTime:'20:00',water:true,waterTime:'12:00',hide:false}};
}
function saveState(){try{localStorage.setItem('life_v16',JSON.stringify(S));}catch(e){}}
function pad(n){return String(n).padStart(2,'0');}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return fmt(new Date());}
function keyAgo(n){var d=new Date();d.setDate(d.getDate()-n);return fmt(d);}
var CUR_TAB='habits';
function showTab(t){CUR_TAB=t;render();}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function avatarHTML(u,size){
 var s=size||52;
 if(u.photo)return '<img class="ava" style="width:'+s+'px;height:'+s+'px" src="'+esc(u.photo)+'">';
 return '<div class="ava-letter" style="width:'+s+'px;height:'+s+'px">'+esc((u.name||'?').charAt(0).toUpperCase())+'</div>';
}
function isClosed(key){
 if(S.habits.length===0)return false;
 for(var i=0;i<S.habits.length;i++){if(!S.habits[i].done||!S.habits[i].done[key])return false;}
 return true;
}
function isPartial(key){
 if(S.habits.length===0)return false;var c=0;
 for(var i=0;i<S.habits.length;i++){if(S.habits[i].done&&S.habits[i].done[key])c++;}
 return c>0&&c<S.habits.length;
}
function closedDates(){var set={};for(var i=0;i<200;i++){var k=keyAgo(i);if(isClosed(k))set[k]=1;}return set;}
function streaks(){
 var set=closedDates(),keys=Object.keys(set).sort();if(!keys.length)return{cur:0,best:0};
 var best=1,cur=1;
 for(var i=1;i<keys.length;i++){
  var a=new Date(keys[i-1]+'T00:00:00'),b=new Date(keys[i]+'T00:00:00');
  var diff=(b-a)/86400000;
  if(diff===1){cur++;if(cur>best)best=cur;}else{cur=1;}
 }
 var curNow=0,k=todayKey();
 if(set[k]){curNow=1;var n=1;while(set[keyAgo(-n)]){curNow++;n++;}}
 else{var n2=1;while(set[keyAgo(n2)]){curNow++;n2++;}}
 return {cur:curNow,best:best};
}
function totalClosed(){return Object.keys(closedDates()).length;}
function chCompleted(){var n=0;for(var i=0;i<S.challenges.length;i++){var c=S.challenges[i];if(c.joined&&(c.myDays||[]).length>=c.dur)n++;}return n;}
function achDefs(st){
 return [
  {ic:'\ud83c\udf31',t:'Первый шаг',d:'Закрыть первый день',ok:totalClosed()>=1},
  {ic:'\u26a1',t:'Разгон',d:'Серия 3 дня подряд',ok:st.best>=3},
  {ic:'\ud83d\udd25',t:'Неделя дисциплины',d:'Серия 7 дней подряд',ok:st.best>=7},
  {ic:'\ud83d\udcaa',t:'Две недели',d:'Серия 14 дней подряд',ok:st.best>=14},
  {ic:'\ud83c\udfc5',t:'Месяц силы',d:'Серия 30 дней подряд',ok:st.best>=30},
  {ic:'\ud83d\udc8e',t:'Полсотни',d:'Серия 50 дней подряд',ok:st.best>=50},
  {ic:'\ud83d\udc51',t:'Легенда',d:'Серия 100 дней подряд',ok:st.best>=100},
  {ic:'\ud83d\udcc5',t:'30 дней в деле',d:'30 закрытых дней (не обязательно подряд)',ok:totalClosed()>=30},
  {ic:'\ud83c\udfaf',t:'Вызов принят',d:'Пройти первый вызов до конца',ok:chCompleted()>=1},
  {ic:'\ud83c\udfc6',t:'Охотник за вызовами',d:'Пройти 5 вызовов до конца',ok:chCompleted()>=5},
  {ic:'\ud83e\udd1d',t:'Опора сообщества',d:'Поддержать участников 10 раз',ok:(S.firedCount||0)>=10}
 ];
}
function calHTML(kind){
 var closed=closedDates(),out='',now=new Date();
 var dow=(now.getDay()+6)%7;
 var start=new Date();start.setDate(now.getDate()-dow-28);
 for(var w=0;w<5;w++){
  out+='<div class="crow">';
  for(var d=0;d<7;d++){
   var dt=new Date(start);dt.setDate(start.getDate()+w*7+d);
   var key=fmt(dt),dayN=dt.getDate(),cls='cday';
   if(dt<=now){
    if(kind==='habits'){if(closed[key])cls+=' cfull';else if(isPartial(key))cls+=' cpart';}
    if(kind==='mood'){for(var i=0;i<S.mood.length;i++){if(S.mood[i].date===key){cls+=' m'+S.mood[i].val;break;}}}
   }
   if(key===todayKey())cls+=' ctoday';
   out+='<div class="'+cls+'">'+dayN+'</div>';
  }
  out+='</div>';
 }
 return out;
}
var MOTIV=['Ещё один шаг к цели! \ud83d\udd25','Так держать! \ud83d\udc4d','Отличная работа! \u2728','Ты справляешься! \ud83d\udcaf','Продолжай в том же духе! \ud83d\ude80'];
var MOTIV_FULL=['День закрыт! Серия: ','Ты закрыл(а) весь день! Серия: ','Все задания выполнены! Серия: '];
var lastMot='';

function avatarCard(extra){
 var nm=S.settings.hide?(CUR_TAB==='rating'?'Скрытый участник':USER.name):USER.name;
 return '<div class="card pcard">'+avatarHTML(USER,52)+'<div><div class="pname">'+esc(nm)+'</div><div class="psub">'+extra+'</div></div></div>';
}

function renderHabits(){
 var st=streaks(),h='',i;
 h+=avatarCard('Серия: '+st.cur+' \u00b7 дней: '+totalClosed());
 var doneN=0;for(i=0;i<S.habits.length;i++){if(S.habits[i].done&&S.habits[i].done[todayKey()])doneN++;}
 var pct=S.habits.length?Math.round(doneN*100/S.habits.length):0;
 var monthPct=Math.round(totalClosed()/30*100);if(monthPct>100)monthPct=100;
 h+='<div class="card"><div class="small">Выполнено сегодня: <b>'+pct+'%</b> \u00b7 за 30 дней: <b>'+monthPct+'%</b></div>';
 h+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
 if(S.habits.length===0)h+='<div class="muted">Пока нет привычек. Добавь первую!</div>';
 for(i=0;i<S.habits.length;i++){
  var hb=S.habits[i],on=hb.done&&hb.done[todayKey()];
  h+='<div class="hrow"><button class="chk'+(on?' on':'')+'" onclick="toggleHabit('+hb.id+')">'+(on?'\u2713':'')+'</button>';
  h+='<div class="hname'+(on?' done':'')+'">'+esc(hb.name)+'</div>';
  h+='<button class="del" onclick="delHabit('+hb.id+')">\u2715</button></div>';
 }
 h+='<input type="text" id="newhabit" placeholder="Новая привычка">';
 h+='<button class="big" onclick="addHabit()">\uff0b Добавить привычку</button></div>';
 if(lastMot)h+='<div class="mot">'+lastMot+'</div>';
 h+='<h2 class="sec">КАЛЕНДАРЬ \u00b7 5 НЕДЕЛЬ</h2><div class="cal">'+calHTML('habits')+'</div>';
 return h;
}
function addHabit(){
 var el=document.getElementById('newhabit');if(!el)return;
 var v=el.value.trim();if(!v)return;
 S.habits.push({id:Date.now(),name:v,done:{}});el.value='';saveState();render();
}
function toggleHabit(id){
 var i;for(i=0;i<S.habits.length;i++){if(S.habits[i].id===id)break;}
 if(i>=S.habits.length)return;
 var hb=S.habits[i];hb.done=hb.done||{};
 if(hb.done[todayKey()])delete hb.done[todayKey()];
 else{hb.done[todayKey()]=1;lastMot=MOTIV[Math.floor(Math.random()*MOTIV.length)];
  if(isClosed(todayKey()))lastMot='<b>'+MOTIV_FULL[Math.floor(Math.random()*MOTIV_FULL.length)]+streaks().cur+' \ud83d\udd25</b>';}
 saveState();render();
}
function delHabit(id){S.habits=S.habits.filter(function(h){return h.id!==id;});saveState();render();}

function renderRating(){
 var st=streaks(),allDone=isClosed(todayKey()),h='';
 var nm=S.settings.hide?'Скрытый участник':USER.name;
 var medal=totalClosed()>=1?'\ud83e\udd47':'';
 h+='<div class="card pcard">'+(medal?'<div class="medal">'+medal+'</div>':'')+avatarHTML(USER,52);
 h+='<div style="flex:1"><div class="pname">'+esc(nm)+'</div><div class="psub">Твоё место: 1 \u00b7 закрыто дней: '+totalClosed()+(allDone?' \u00b7 \u2705 всё выполнено':'')+'</div></div>';
 h+='<div style="text-align:center"><div style="font-size:20px">\ud83d\udd25</div><div class="small">'+(S.firesGot||0)+'</div></div></div>';
 h+='<div class="card"><div class="muted">Участники, вступившие в бота, появятся здесь автоматически \u2014 для этого нужен общий сервер (следующий шаг). Поддержать \ud83d\udd25 можно каждого участника один раз в день, кроме себя.</div></div>';
 return h;
}

function renderChal(){
 var h='<div class="card">';
 h+='<input type="text" id="chname" placeholder="Название вызова">';
 h+='<select id="chdur" style="width:100%;margin-top:10px;padding:12px;border:1.5px solid #ddd;border-radius:12px;font-size:16px">';
 for(var i=7;i<=100;i+=7){h+='<option value="'+i+'">'+i+' дней</option>';}
 h+='</select>';
 h+='<button class="big" onclick="addChal()">\ud83d\udcaf Бросить вызов</button></div>';
 if(S.challenges.length===0)h+='<div class="card"><div class="muted">Пока нет вызовов. Брось первый!</div></div>';
 for(var j=0;j<S.challenges.length;j++){
  var c=S.challenges[j],days=(c.myDays||[]).length,pct=Math.min(100,Math.round(days*100/c.dur));
  h+='<div class="card"><div style="font-weight:700;font-size:16px">'+esc(c.name)+'</div>';
  h+='<div class="small" style="margin:4px 0">Срок: '+c.dur+' дней \u00b7 участников: '+c.accepted+'</div>';
  h+='<div class="bar"><i style="width:'+pct+'%"></i></div><div class="small" style="margin:6px 0">Отмечено дней: '+days+' из '+c.dur+(pct>=100?' \u00b7 \u2705 пройден!':'')+'</div>';
  h+='<div style="display:flex;gap:8px;margin-top:8px">';
  if(!c.joined)h+='<button class="chbtn" onclick="joinChal('+c.id+')">\u2705 Принять вызов</button>';
  else h+='<button class="chbtn" onclick="markChal('+c.id+')">\uff0b Отметить день</button>';
  h+='<button class="del" onclick="delChal('+c.id+')">\u2715</button></div></div>';
 }
 return h;
}
function addChal(){
 var el=document.getElementById('chname'),sl=document.getElementById('chdur');if(!el||!sl)return;
 var v=el.value.trim();if(!v)return;
 S.challenges.push({id:Date.now(),name:v,dur:parseInt(sl.value),joined:true,myDays:[],accepted:1});
 el.value='';saveState();render();
}
function joinChal(id){for(var i=0;i<S.challenges.length;i++){if(S.challenges[i].id===id&&!S.challenges[i].joined){S.challenges[i].joined=true;S.challenges[i].accepted=(S.challenges[i].accepted||0)+1;break;}}saveState();render();}
function markChal(id){
 for(var i=0;i<S.challenges.length;i++){
  var c=S.challenges[i];
  if(c.id===id&&c.joined){c.myDays=c.myDays||[];
   if(c.myDays.indexOf(todayKey())<0){c.myDays.push(todayKey());
    if(c.myDays.length>=c.dur)lastMot='<b>\ud83c\udfc6 Вызов «'+esc(c.name)+'» пройден!</b>';
    else lastMot='День вызова отмечен! \ud83d\udcaa';}
  }
 }
 saveState();render();
}
function delChal(id){S.challenges=S.challenges.filter(function(c){return c.id!==id;});saveState();render();}

var moodSel=0;
function renderMood(){
 var h='<div class="card"><div class="lbl">КАК ТЫ СЕБЯ ЧУВСТВУЕШЬ?</div><div style="display:flex;gap:8px;justify-content:center">';
 var em=['\ud83d\ude20','\ud83d\ude41','\ud83d\ude10','\ud83d\ude42','\ud83d\ude00'];
 for(var i=1;i<=5;i++)h+='<button class="emoji'+(moodSel===i?' on':'')+'" onclick="setMood('+i+')">'+em[i-1]+'</button>';
 h+='</div><textarea id="mnote" placeholder="Заметка (необязательно)"></textarea>';
 h+='<button class="big" onclick="saveMood()">Сохранить</button>';
 var avg=null;if(S.mood.length){var s=0;for(var i=0;i<S.mood.length;i++)s+=S.mood[i].val;avg=s/S.mood.length;}
 var pct=avg?Math.round((avg-1)/4*100):0;
 h+='<div class="small" style="margin-top:10px">Самочувствие за всё время: <b>'+pct+'%</b></div></div>';
 h+='<div class="card"><div class="lbl">КАЛЕНДАРЬ НАСТРОЕНИЯ \u00b7 5 НЕДЕЛЬ</div><div class="cal">'+calHTML('mood')+'</div>';
 h+='<div class="small" style="margin-top:8px">\ud83d\ude20 плохо \u2192 \ud83d\ude00 отлично</div></div>';
 if(S.mood.length){h+='<div class="card"><div class="lbl">ИСТОРИЯ</div>';
  for(var j=S.mood.length-1;j>=0&&j>S.mood.length-8;j--){
   var m=S.mood[j];
   h+='<div class="rrow"><div>'+em[m.val-1]+'</div><div style="flex:1"><div class="small">'+m.date+'</div>'+(m.note?'<div style="font-size:14px">'+esc(m.note)+'</div>':'')+'</div>';
   h+='<button class="del" onclick="delMood('+j+')">\u2715</button></div>';
  }
  h+='</div>';}
 return h;
}
function setMood(v){moodSel=v;render();}
function saveMood(){
 if(!moodSel){lastMot='';S.mood.forEach(function(){});alert('Сначала выбери смайлик');return;}
 var note='';try{note=document.getElementById('mnote').value;}catch(e){}
 var found=false;for(var i=0;i<S.mood.length;i++){if(S.mood[i].date===todayKey()){S.mood[i].val=moodSel;S.mood[i].note=note;found=true;}}
 if(!found)S.mood.push({date:todayKey(),val:moodSel,note:note});
 saveState();render();
}
function delMood(i){S.mood.splice(i,1);saveState();render();}

function renderProf(){
 var st=streaks(),h='';
 h+=avatarCard('Участник сообщества');
 h+='<div class="grid3"><div class="stat"><b>'+st.cur+'</b><span>текущая серия</span></div><div class="stat"><b>'+st.best+'</b><span>лучшая серия</span></div><div class="stat"><b>'+totalClosed()+'</b><span>всего дней</span></div></div>';
 h+='<div class="card"><b>\u2744\ufe0f Заморозки: 2 из 2</b><div class="small" style="margin-top:4px">Если пропустите день, заморозка сработает сама и сохранит серию. Обновляются каждый месяц.</div></div>';
 h+='<h2 class="sec">ДОСТИЖЕНИЯ</h2><div class="grid3">';
 var defs=achDefs(st);
 for(var i=0;i<defs.length;i++){var a=defs[i];
  h+='<div class="ach'+(a.ok?' open':'')+'"><div class="ic">'+a.ic+'</div><div class="t">'+a.t+'</div><div class="d">'+a.d+'</div>'+(a.ok?'<div class="d">\u2705 получено</div>':'')+'</div>';}
 h+='</div>';
 h+='<h2 class="sec">КАЛЕНДАРЬ \u00b7 5 НЕДЕЛЬ</h2><div class="cal">'+calHTML('habits')+'</div>';
 h+='<h2 class="sec">НАСТРОЙКИ</h2><div class="card">';
 h+='<div class="setrow"><div><b>Утреннее напоминание</b><div class="small">Задания на день</div></div><div class="sw'+(S.settings.morning?' on':'')+'" onclick="tog(\'morning\')"><i></i></div></div>';
 h+='<div class="setrow"><div><b>Время утром</b><div class="small">По твоему часовому поясу</div></div><input type="time" value="'+S.settings.morningTime+'" onchange="setTime(\'morningTime\',this.value)"></div>';
 h+='<div class="setrow"><div><b>Вечернее напоминание</b><div class="small">Придёт, если день ещё не закрыт</div></div><div class="sw'+(S.settings.evening?' on':'')+'" onclick="tog(\'evening\')"><i></i></div></div>';
 h+='<div class="setrow"><div><b>Время вечером</b><div class="small">По твоему часовому поясу</div></div><input type="time" value="'+S.settings.eveningTime+'" onchange="setTime(\'eveningTime\',this.value)"></div>';
 var wt=S.settings.waterTime||'12:00';
 h+='<div class="setrow"><div><b>Напоминание пить воду</b><div class="small">Время: <b id="wtlabel">'+wt+'</b></div></div><div class="sw'+(S.settings.water?' on':'')+'" onclick="tog(\'water\')"><i></i></div></div>';
 h+='<div style="padding:8px 0"><input type="range" min="600" max="1200" step="30" value="'+sliderVal(wt)+'" style="width:100%" oninput="setWater(this.value)"></div>';
 h+='<div class="setrow"><div><b>Скрыть имя в рейтинге</b></div><div class="sw'+(S.settings.hide?' on':'')+'" onclick="tog(\'hide\')"><i></i></div></div>';
 h+='</div>';
 h+='<button class="big" style="background:#fff;color:#c33;border:1.5px solid #c33" onclick="resetAll()">Сбросить весь прогресс</button>';
 return h;
}
function sliderVal(t){var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
function setWater(v){S.settings.waterTime=pad(Math.floor(v/60))+':'+pad(v%60);saveState();var l=document.getElementById('wtlabel');if(l)l.textContent=S.settings.waterTime;}
function tog(k){S.settings[k]=!S.settings[k];saveState();render();}
function setTime(k,v){if(v){S.settings[k]=v;saveState();}}
function resetAll(){if(confirm('Точно сбросить весь прогресс?')){S={habits:[],mood:[],challenges:[],fired:{},firedCount:0,settings:{morning:true,morningTime:'07:00',evening:true,eveningTime:'20:00',water:true,waterTime:'12:00',hide:false}};saveState();render();}}

function render(){
 ['habits','rating','chal','mood','prof'].forEach(function(t){
  var tb=document.getElementById('tb_'+t),nb=document.getElementById('nb_'+t);
  if(tb)tb.className='tab'+(CUR_TAB===t?' on':'');
  if(nb)nb.className='nbtn'+(CUR_TAB===t?' on':'');
 });
 var v=document.getElementById('view'),html='';
 try{
  if(CUR_TAB==='habits')html=renderHabits();
  else if(CUR_TAB==='rating')html=renderRating();
  else if(CUR_TAB==='chal')html=renderChal();
  else if(CUR_TAB==='mood')html=renderMood();
  else html=renderProf();
 }catch(e){html='<div class="card" style="color:#c33">Ошибка отрисовки: '+esc(e.message)+'</div>';}
 v.innerHTML=html;
}
render();
</script>
</body>
</html>
