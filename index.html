<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Трекер LIFE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--y:#ffd60a;--bg:#f4f4f2;--card:#fff;--tx:#1a1a1a;--mut:#8a8a86;--ok:#1f9d55}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--tx)}
#err{display:none;background:#c62828;color:#fff;padding:8px 12px;font-size:12px;white-space:pre-wrap}
.head{background:var(--y);padding:16px 20px 12px}
.head h1{font-size:24px}.badge{display:inline-block;background:#f3b500;color:#5a4400;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:6px}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:#e6e6e2;border:none;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:#1a1a1a;color:var(--y)}
.body{padding:0 12px 90px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:10px}
.avatar{width:46px;height:46px;border-radius:50%;background:#ddd;object-fit:cover;flex:0 0 auto}
.av-ph{width:46px;height:46px;border-radius:50%;background:#d7d7d3;display:flex;align-items:center;justify-content:center;font-weight:700;color:#777;flex:0 0 auto}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:6px;background:#eee;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);border-radius:6px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #eee;border-radius:12px;margin-bottom:8px}
.hname{flex:1}.done .hname{text-decoration:line-through;color:var(--mut)}
.circ{width:28px;height:28px;border-radius:50%;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;background:#fff}
.circ.on{background:var(--y);border-color:#e0b400}
.x{color:#c33;font-size:16px;cursor:pointer;padding:4px}
.big{width:100%;padding:13px;border:none;border-radius:12px;background:#1a1a1a;color:var(--y);font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.inp{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;margin-bottom:8px}
.motiv{background:#fff8d6;border:1px solid #f3d84a;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .d{aspect-ratio:1;border-radius:8px;background:#ececea;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999}
.cal .hd{font-size:10px;color:#999;background:none}
.cal .full{background:var(--y);color:#4a3a00;font-weight:700}
.cal .part{background:#ffe98a;color:#6b5500}
.cal .m1{background:#f8b4b4}.cal .m2{background:#fcd9a0}.cal .m3{background:#fdf3b0}.cal .m4{background:#d9f2c8}.cal .m5{background:#b8e6a9}
.rrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #eee;border-radius:12px;margin-bottom:8px}
.medal{font-size:20px;width:28px;text-align:center;flex:0 0 auto}
.fire{background:#fff0e6;border:1px solid #f5b678;color:#c2410c;border:none;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;flex:0 0 auto}
.fire.off{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{border:1px solid #eee;border-radius:12px;padding:10px;font-size:12px}
.ach b{font-size:13px;display:block}
.ach.got{border:2px solid var(--y);background:#fffbe6}
.ach .st{color:var(--mut)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f0f0ee;font-size:14px}
.tg{width:44px;height:26px;border-radius:14px;background:#ddd;position:relative;cursor:pointer;flex:0 0 auto}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:#1a1a1a}.tg.on::after{left:21px}
.emoji{font-size:34px;cursor:pointer;padding:4px;filter:grayscale(1);opacity:.5}
.emoji.on{filter:none;opacity:1}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e2;display:flex;padding:6px 4px 10px}
.tbi{flex:1;text-align:center;font-size:10px;color:#777;cursor:pointer}
.tbi .ic{font-size:20px}.tbi.on{color:#b8860b;font-weight:700}
.h2{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:14px 0 8px}
.pill{display:inline-block;background:#f0efe9;border-radius:14px;padding:4px 10px;font-size:12px;margin:0 6px 6px 0}
</style></head><body>
<div id="err"></div>
<script>
window.onerror=function(m,s,l){var e=document.getElementById('err');e.style.display='block';e.textContent='Ошибка: '+m+' (строка '+l+')';};
</script>
<div id="app"></div>
<script>
var tg=window.Telegram&&window.Telegram.WebApp;
try{if(tg){tg.ready();tg.expand();}}catch(e){}
var U=null;
try{U=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)?tg.initDataUnsafe.user:null;}catch(e){}
var ME={id:U?String(U.id):'me',name:U?[U.first_name,U.last_name].filter(Boolean).join(' '):'Гость',photo:(U&&U.photo_url)?U.photo_url:''};

var KEY='life_tracker_v18';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
var S=load();
S.habits=S.habits||[];S.log=S.log||{};S.ch=S.ch||[];S.moods=S.moods||{};S.fires=S.fires||{};
S.settings=S.settings||{morning:true,w1:true,w2:true,evening:true,hide:false};
S.freezeUsed=S.freezeUsed||0;S.supports=S.supports||0;S.chDone=S.chDone||0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return fmt(new Date())}

function dayStat(ds){var t=0,done=0;for(var i=0;i<S.habits.length;i++){t++;if(S.log[ds]&&S.log[ds][S.habits[i].id])done++;}return{t:t,done:done,full:t>0&&done===t,part:t>0&&done>0&&done<t};}
function streak(){var s=0,d=new Date();if(!dayStat(fmt(d)).full)d.setDate(d.getDate()-1);while(dayStat(fmt(d)).full){s++;d.setDate(d.getDate()-1);}return s;}
function bestStreak(){var dates=Object.keys(S.log).sort(),b=0,c=0,prev=null;for(var i=0;i<dates.length;i++){if(dayStat(dates[i]).full){if(prev){var p=new Date(prev),q=new Date(dates[i]);p.setDate(p.getDate()+1);if(fmt(p)===fmt(q))c++;else c=1;}else c=1;b=Math.max(b,c);prev=dates[i];}else{c=0;prev=null;}}return Math.max(b,streak());}
function totalClosed(){var n=0,dates=Object.keys(S.log);for(var i=0;i<dates.length;i++)if(dayStat(dates[i]).full)n++;return n;}
function todayPct(){if(!S.habits.length)return 0;return Math.round(100*dayStat(today()).done/S.habits.length);}
function pct30(){var s=0,n=0;for(var i=0;i<30;i++){var d=new Date();d.setDate(d.getDate()-i);var st=dayStat(fmt(d));if(st.t>0){s+=st.done/st.t;n++;}}return n?Math.round(100*s/n):0;}
var MOT=['Ещё один шаг к цели! 🔥','Так держать! Продолжай 💪','Отлично! Ты ближе к цели ✨','Каждая отметка — победа! 🏆','Дисциплина — твой суперсила! ⚡'];
function showMotiv(){var m=MOT[Math.floor(Math.random()*MOT.length)];if(dayStat(today()).full&&S.habits.length)m='День закрыт! Серия: '+streak()+' дн. 🔥';var el=document.getElementById('motiv');if(el)el.textContent=m;}

var TAB='habits';
function tabs(){return[['habits','Привычки','✅'],['rating','Рейтинг','🏆'],['ch','Вызовы','⚡'],['mood','Настроение','🙂'],['profile','Профиль','👤']];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function card(p,n){return '<div class="row"><div class="av-ph">'+esc((p.name||'?').charAt(0).toUpperCase())+'</div><div><b>'+esc(p.name)+'</b><div class="mut">'+n+'</div></div></div>';}
function avatarImg(p){return p.photo?'<img class="avatar" src="'+esc(p.photo)+'" onerror="this.style.display=\'none\'">':'<div class="av-ph">'+esc((p.name||'?').charAt(0).toUpperCase())+'</div>';}

function calWeeks(colorFn){var h='<div class="cal">';var hd=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];for(var i=0;i<7;i++)h+='<div class="hd">'+hd[i]+'</div>';
var d=new Date();d.setDate(d.getDate()-4*7-((d.getDay()+6)%7));
for(var r=0;r<5;r++)for(var c=0;c<7;c++){var cl=fmt(d),ds=fmt(d);var cls=colorFn(ds,d);h+='<div class="d '+cls+'">'+d.getDate()+'</div>';d.setDate(d.getDate()+1);}return h+'</div>';}

function vHabits(){var st=dayStat(today());
var h=avatarImg(ME)+'<div class="row"><div><b>'+esc(ME.name)+'</b><div class="mut">Серия: '+streak()+' · дней: '+totalClosed()+'</div></div></div>';
h+='<div style="margin-top:10px" class="mut">Выполнено сегодня: '+todayPct()+'% · за 30 дней: '+pct30()+'%</div><div class="bar"><i style="width:'+todayPct()+'%"></i></div>';
h+='<div id="motiv" class="motiv">Отметь выполненное — и день закроется!</div>';
if(!S.habits.length)h+='<div class="mut" style="text-align:center;padding:10px">Пока нет привычек. Добавь первую!</div>';
for(var i=0;i<S.habits.length;i++){var hb=S.habits[i],on=!!(S.log[today()]&&S.log[today()][hb.id]);
h+='<div class="hrow '+(on?'done':'')+'"><div class="circ '+(on?'on':'')+'" data-act="toggle" data-id="'+hb.id+'">'+(on?'✓':'')+'</div><div class="hname">'+esc(hb.name)+'</div><div class="x" data-act="delH" data-id="'+hb.id+'">✕</div></div>';}
h+='<input class="inp" id="habitInp" placeholder="Новая привычка"><button class="big" data-act="addH">＋ Добавить привычку</button>';
h+='<div class="h2">КАЛЕНДАРЬ · 5 НЕДЕЛЬ</div><div class="card">'+calWeeks(function(ds){var s=dayStat(ds);if(s.full)return'full';if(s.part)return'part';return'';})+'</div>';
h+='<div class="mut" style="text-align:center;padding:4px">Напоминания: 08:00 · вода 10:00 и 15:00 · вечер 20:00</div>';
return card('','')&&'<div class="card">'+h+'</div>';}

function vRating(){var fired=S.fires[today()]||[];
var h=avatarImg(ME)+'<div class="row"><div><b>'+esc(ME.name)+'</b><div class="mut">Твоё место: 1</div></div></div>';
h+='<div class="card" style="margin-top:12px">';
h+='<div class="rrow"><div class="medal">🥇</div>'+avatarImg(ME)+'<div style="flex:1"><b>'+esc(S.settings.hide?ME.name:ME.name)+'</b><div class="mut">Дней пройдено: '+totalClosed()+' · огоньков: '+fired.length+'</div>'+(dayStat(today()).full?'<div class="mut" style="color:var(--ok)">✅ всё выполнено сегодня</div>':'')+'</div><button class="fire off" title="Себя поддержать нельзя">🔥</button></div>';
h+='<div class="mut" style="text-align:center;padding:8px">Участники, вступившие в бота, появятся здесь сами</div></div>';
h+='<div class="mut" style="text-align:center;padding:4px">🔥 — поддержка. Любому один раз в день, кроме себя.</div>';
return '<div class="card">'+h+'</div>';}

function vCh(){var h='<input class="inp" id="chName" placeholder="Название вызова"><input class="inp" id="chDays" type="number" min="1" value="7" placeholder="Дней"><button class="big" data-act="mkCh">Бросить вызов</button>';
if(!S.ch.length)h+='<div class="mut" style="text-align:center;padding:12px">Вызовов пока нет. Брось первый!</div>';
for(var i=0;i<S.ch.length;i++){var c=S.ch[i],pr=c.participants||[],inc=pr.indexOf(ME.id)>=0,pct=Math.min(100,Math.round(100*(c.progress||0)/c.days));
h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(c.name)+'</b><span class="pill">'+(c.done?'✅ пройден':c.days+' дн.')+'</span></div>';
h+='<div class="mut" style="margin:6px 0">Участников: '+pr.length+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>';
h+='<div class="row" style="margin-top:8px">'+(c.done?'<div class="mut">Вызов пройден! 🎉</div>':(inc?'<button class="big" style="flex:1" data-act="markCh" data-id="'+c.id+'">＋ Отметить день</button>':'<button class="big" style="flex:1" data-act="accCh" data-id="'+c.id+'">Принять вызов</button>'))+'<div class="x" data-act="delCh" data-id="'+c.id+'">✕</div></div></div>';}
return h;}

function vMood(){var EM=['😞','😕','😐','🙂','😄'];var t=S.moods[today()];
var h='<div style="text-align:center">';
for(var i=0;i<5;i++)h+='<span class="emoji '+(t&&t.e===i?'on':'')+'" data-act="mood" data-id="'+i+'">'+EM[i]+'</span>';
h+='</div><input class="inp" style="margin-top:10px" id="moodNote" placeholder="Как прошёл день?" value="'+(t?esc(t.note||''):'')+'"><button class="big" data-act="saveMood">Сохранить</button>';
h+='<div class="h2">КАЛЕНДАРЬ НАСТРОЕНИЯ · 5 НЕДЕЛЬ</div><div class="card">'+calWeeks(function(ds){var m=S.moods[ds];return m?('m'+(m.e+1)):'';})+'</div>';
var vals=Object.keys(S.moods).map(function(k){return S.moods[k].e;});
var pct=vals.length?Math.round(100*(vals.reduce(function(a,b){return a+b;},0)+vals.length)/(5*vals.length)):0;
h+='<div class="card"><b>Самочувствие: '+pct+'%</b><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mut">Среднее по '+vals.length+' записям</div></div>';
return '<div class="card">'+h+'</div>';}

var ACH=[['Первый шаг','Закрыт первый день',1,0],['Разгон','Серия из 3 дней подряд',3,0],['Неделя дисциплины','Серия из 7 дней подряд',7,0],['Две недели','Серия из 14 дней подряд',14,0],['Месяц силы','Серия из 30 дней подряд',30,0],['Полсотни','Серия из 50 дней подряд',50,0],['Легенда','Серия из 100 дней подряд',100,0],['30 дней в деле','30 закрытых дней (не подряд)',30,1],['Вызов принят','Пройти один вызов до конца',1,2],['Охотник за вызовами','Пройти 5 вызовов до конца',5,2],['Опора сообщества','Поддержать участников 10 раз',10,3]];
function achGot(a){var st=bestStreak(),tc=totalClosed();
if(a[3]===0)return a[3]===1?tc>=a[2]:st>=a[2];
if(a[3]===1)return tc>=a[2];
if(a[3]===2)return S.chDone>=a[2];
if(a[3]===3)return S.supports>=a[2];return false;}

function vProfile(){var h=avatarImg(ME)+'<div class="row"><div><b>'+esc(ME.name)+'</b><div class="mut">Участник трекера</div></div></div>';
h+='<div class="grid" style="margin-top:12px"><div class="card"><b>'+streak()+'</b><div class="mut">серия</div></div><div class="card"><b>'+bestStreak()+'</b><div class="mut">лучшая серия</div></div><div class="card"><b>'+totalClosed()+'</b><div class="mut">всего дней</div></div><div class="card"><b>'+(2-S.freezeUsed)+' из 2</b><div class="mut">заморозки</div></div></div>';
h+='<div class="h2">ДОСТИЖЕНИЯ · '+ACH.filter(achGot).length+' ИЗ '+ACH.length+'</div><div class="card"><div class="grid">';
for(var i=0;i<ACH.length;i++){var a=ACH[i],g=achGot(a);h+='<div class="ach '+(g?'got':'')+'"><b>'+(g?'✅ ':'')+esc(a[0])+'</b>'+esc(a[1])+'<div class="st">'+(g?'открыто':'закрыто')+'</div></div>';}
h+='</div></div>';
h+='<div class="h2">КАЛЕНДАРЬ · 5 НЕДЕЛЬ</div><div class="card">'+calWeeks(function(ds){var s=dayStat(ds);if(s.full)return'full';if(s.part)return'part';return'';})+'</div>';
h+='<div class="h2">НАСТРОЙКИ</div><div class="card">';
var rows=[['morning','Утреннее напоминание — задания на день','08:00'],['w1','Напоминание пить воду','10:00'],['w2','Напоминание пить воду','15:00'],['evening','Вечернее напоминание — если день не закрыт','20:00'],['hide','Скрыть имя в рейтинге','']];
for(var j=0;j<rows.length;j++){var r=rows[j];h+='<div class="srow"><div>'+esc(r[1])+(r[2]?'<div class="mut">'+r[2]+'</div>':'')+'</div><div class="tg '+(S.settings[r[0]]?'on':'')+'" data-act="set" data-id="'+r[0]+'"></div></div>';}
h+='</div><button class="big" data-act="reset" style="background:#c62828;color:#fff">Сбросить весь прогресс</button>';
return '<div class="card">'+h+'</div>';}

function render(){var t=tabs(),top='',i;for(i=0;i<t.length;i++)top+='<button class="tab '+(TAB===t[i][0]?'on':'')+'" data-act="tab" data-id="'+t[i][0]+'">'+t[i][1]+'</button>';
var body='';try{if(TAB==='habits')body=vHabits();else if(TAB==='rating')body=vRating();else if(TAB==='ch')body=vCh();else if(TAB==='mood')body=vMood();else body=vProfile();}catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent='Ошибка отрисовки: '+e.message;}
var bar='';for(i=0;i<t.length;i++)bar+='<div class="tbi '+(TAB===t[i][0]?'on':'')+'" data-act="tab" data-id="'+t[i][0]+'"><div class="ic">'+t[i][2]+'</div>'+t[i][1]+'</div>';
document.getElementById('app').innerHTML='<div class="head"><h1>🔥 Трекер LIFE</h1><span class="badge">Версия 18</span></div><div class="tabs">'+top+'</div><div class="body">'+body+'</div><div class="tabbar">'+bar+'</div>';}

document.addEventListener('click',function(ev){var el=ev.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
if(a==='tab'){TAB=id;render();return;}
if(a==='addH'){var inp=document.getElementById('habitInp');var v=(inp.value||'').trim();if(!v)return;S.habits.push({id:Date.now(),name:v});save();render();showMotiv();return;}
if(a==='toggle'){var ds=today();S.log[ds]=S.log[ds]||{};S.log[ds][id]=!S.log[ds][id];save();render();showMotiv();return;}
if(a==='delH'){S.habits=S.habits.filter(function(x){return String(x.id)!==String(id)});save();render();return;}
if(a==='mkCh'){var n=(document.getElementById('chName').value||'').trim(),dd=parseInt(document.getElementById('chDays').value,10)||7;if(!n)return;S.ch.push({id:Date.now(),name:n,days:dd,participants:[],progress:0,done:false});save();render();return;}
if(a==='accCh'){var c=findCh(id);if(c&&!c.participants)c.participants=[];if(c&&c.participants.indexOf(ME.id)<0)c.participants.push(ME.id);save();render();return;}
if(a==='markCh'){var c2=findCh(id);if(c2){c2.progress=(c2.progress||0)+1;if(c2.progress>=c2.days&&!c2.done){c2.done=true;S.chDone++;}save();}render();return;}
if(a==='delCh'){S.ch=S.ch.filter(function(x){return String(x.id)!==String(id)});save();render();return;}
if(a==='mood'){S.moods[today()]=S.moods[today()]||{note:''};S.moods[today()].e=parseInt(id,10);save();render();return;}
if(a==='saveMood'){var nt=document.getElementById('moodNote');S.moods[today()]=S.moods[today()]||{e:2};S.moods[today()].note=nt?nt.value:'';save();render();return;}
if(a==='set'){S.settings[id]=!S.settings[id];save();render();return;}
if(a==='reset'){if(confirm('Сбросить весь прогресс?')){localStorage.removeItem(KEY);location.reload();}return;}
});
function findCh(id){for(var i=0;i<S.ch.length;i++)if(String(S.ch[i].id)===String(id))return S.ch[i];return null;}

render();
</script></body></html>
