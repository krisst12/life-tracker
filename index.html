<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Трекер LIFE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#f2f2f5;padding-bottom:80px}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
.header{background:#ffd60a;padding:18px 16px 14px;border-radius:0 0 18px 18px}
.header h1{font-size:24px}
.badge{display:inline-block;background:#f4c400;border-radius:10px;padding:3px 10px;font-size:13px;margin-top:6px;font-weight:600}
.err{background:#c0392b;color:#fff;padding:8px 12px;border-radius:10px;margin:8px 0;font-size:13px;display:none}
.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.pill{background:#e4e4e9;border:none;border-radius:20px;padding:10px 16px;font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer}
.pill.on{background:#1a1a1a;color:#ffd60a}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pcard{display:flex;align-items:center;gap:12px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e4e4e9}
.avafall{width:56px;height:56px;border-radius:50%;background:#e4e4e9;display:flex;align-items:center;justify-content:center;font-size:24px;color:#777}
.pname{font-size:19px;font-weight:700}
.psub{font-size:13px;color:#777;margin-top:2px}
.pbar{height:6px;background:#e4e4e9;border-radius:4px;margin:10px 0 4px;overflow:hidden}
.pbar>div{height:100%;background:#ffd60a;border-radius:4px;transition:width .3s}
.plabel{font-size:12px;color:#777}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.hrow:last-child{border-bottom:none}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #ccc;background:#fff;cursor:pointer;flex-shrink:0;font-size:15px;display:flex;align-items:center;justify-content:center;color:#1a1a1a}
.chk.done{background:#ffd60a;border-color:#ffd60a}
.hname{flex:1;font-size:16px}
.hname.done{text-decoration:line-through;color:#aaa}
.del{background:none;border:none;font-size:18px;color:#bbb;cursor:pointer;padding:4px}
input[type=text]{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px 14px;font-size:15px;margin:6px 0}
.bigbtn{width:100%;background:#1a1a1a;color:#ffd60a;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.mot{background:#fffbe6;border:1px solid #ffe08a;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.closed{background:#fff6c9;border:1px solid #ffd60a;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dow{font-size:11px;color:#999;text-align:center;padding:2px 0}
.cell{aspect-ratio:1;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:12px;color:#bbb}
.cell.full{background:#ffd60a;color:#1a1a1a;font-weight:700}
.cell.part{background:#ffe98a;color:#5a4a00}
.cell.m1{background:#e57373;color:#fff}.cell.m2{background:#ffb74d;color:#5a3200}.cell.m3{background:#ffe082;color:#5a4a00}.cell.m4{background:#aed581;color:#2d4a12}.cell.m5{background:#66bb6a;color:#fff}
.cell.today{outline:2px solid #1a1a1a}
.sec{font-size:12px;letter-spacing:.5px;color:#777;font-weight:700;margin:14px 0 8px;text-transform:uppercase}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.rrow:last-child{border-bottom:none}
.rplace{width:30px;text-align:center;font-size:16px;font-weight:700}
.rname{flex:1;font-size:16px;font-weight:600}
.rsub{font-size:12px;color:#777}
.firebtn{background:#fff2cc;border:none;border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;font-weight:600}
.firebtn.off{background:#eee;color:#aaa;cursor:default}
.ravatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#e4e4e9}
.emoji5{display:flex;gap:10px;justify-content:space-between;margin:8px 0}
.emoji5 button{font-size:34px;background:#f4f4f6;border:2px solid transparent;border-radius:16px;padding:8px;cursor:pointer;flex:1}
.emoji5 button.on{border-color:#1a1a1a;background:#fff6c9}
.note{width:100%;border:1px solid #ddd;border-radius:12px;padding:10px;font-size:14px;min-height:60px;font-family:inherit}
.ach{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;margin-bottom:8px;background:#f6f6f8}
.ach.got{background:#fff6c9;border:1px solid #ffd60a}
.ach .em{font-size:26px}
.ach .t{font-weight:700;font-size:15px}
.ach .d{font-size:12px;color:#777}
.srow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}
.srow:last-child{border-bottom:none}
.st{font-size:15px}
.st b{display:block;font-size:15px}
.st span{font-size:12px;color:#777}
.sw{width:50px;height:30px;border-radius:16px;background:#ddd;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.sw.on{background:#ffd60a}
.sw::after{content:'';position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s}
.sw.on::after{left:22px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e5e5;z-index:10}
.bnav button{flex:1;background:none;border:none;padding:8px 0 10px;font-size:11px;color:#888;cursor:pointer}
.bnav button.on{color:#e6a800;font-weight:700}
.bnav .ic{font-size:20px;display:block;margin-bottom:2px}
.mut{color:#777;font-size:14px;text-align:center;padding:16px 8px}
.hint{font-size:12px;color:#999;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="header"><h1>🔥 Трекер LIFE</h1><span class="badge" id="ver">Версия 21</span></div>
<div class="err" id="err"></div>
<div class="wrap">
  <div class="pills">
    <button class="pill on" data-tab="habits" onclick="setTab('habits')">Привычки</button>
    <button class="pill" data-tab="rating" onclick="setTab('rating')">Рейтинг</button>
    <button class="pill" data-tab="chall" onclick="setTab('chall')">Вызовы</button>
    <button class="pill" data-tab="mood" onclick="setTab('mood')">Настроение</button>
    <button class="pill" data-tab="profile" onclick="setTab('profile')">Профиль</button>
  </div>
  <div id="content"></div>
</div>
<div class="bnav">
  <button class="on" data-tab="habits" onclick="setTab('habits')"><span class="ic">✅</span>Привычки</button>
  <button data-tab="rating" onclick="setTab('rating')"><span class="ic">🏆</span>Рейтинг</button>
  <button data-tab="chall" onclick="setTab('chall')"><span class="ic">⚡</span>Вызовы</button>
  <button data-tab="mood" onclick="setTab('mood')"><span class="ic">🙂</span>Настроение</button>
  <button data-tab="profile" onclick="setTab('profile')"><span class="ic">👤</span>Профиль</button>
</div>
<script>
'use strict';
function fatal(msg){var e=document.getElementById('err');e.textContent=msg;e.style.display='block';}

/* --- USER: первый ход скрипта, до всего остального --- */
var USER={name:'',photo:'',source:'none'};
(function(){
  try{
    var tg=window.Telegram&&window.Telegram.WebApp;
    var u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(u){
      USER.name=(u.first_name||'')+(u.last_name?' '+u.last_name:'');
      if(!USER.name&&u.username)USER.name='@'+u.username;
      USER.photo=u.photo_url||'';
      USER.source='telegram';
    } else {
      var m=location.hash.match(/tgWebAppData=([^&]+)/);
      if(m){try{var d=JSON.parse(decodeURIComponent(decodeURIComponent(m[1])));if(d&&d.user){USER.name=d.user.first_name||'';USER.photo=d.user.photo_url||'';USER.source='telegram-hash';}}catch(e){}}
    }
  }catch(e){fatal('Профиль: не удалось получить данные Telegram');}
})();

/* --- STATE --- */
var DEF={name:'',habits:[],challenges:[],doneChallenges:[],moods:{},fires:{},firesGiven:{},settings:{morning:true,water1:true,water2:true,evening:true,hideName:false},others:[]};
var S;
try{S=JSON.parse(localStorage.getItem('lifeTrackerV21')||'null')||JSON.parse(JSON.stringify(DEF));}catch(e){S=JSON.parse(JSON.stringify(DEF));}
Object.keys(DEF).forEach(function(k){if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(DEF[k]));});
if(!USER.name&&S.name){USER.name=S.name;USER.source='saved';}
function save(){try{localStorage.setItem('lifeTrackerV21',JSON.stringify(S));}catch(e){fatal('Не удалось сохранить данные');}}

/* --- DATES --- */
function ds(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function today(){return ds(new Date());}
function addD(s,n){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return ds(d);}

/* --- STATS --- */
function habitsOn(date){var c=0;S.habits.forEach(function(h){if(h.done&&h.done[date])c++;});return c;}
function allDone(date){return S.habits.length>0&&habitsOn(date)===S.habits.length;}
function closedDays(){var c=0,d,t=today();for(var i=0;i<365;i++){d=addD(t,-i);if(allDone(d))c++;}return c;}
function streak(){var s=0,d,t=today();for(var i=0;i<365;i++){d=addD(t,-i);if(allDone(d))s++;else if(i>0)break;else if(S.habits.length>0)break;else return 0;}return s;}
function pctToday(){if(!S.habits.length)return 0;return Math.round(100*habitsOn(today())/S.habits.length);}
function pct30(){if(!S.habits.length)return 0;var done=0;for(var i=0;i<30;i++){done+=habitsOn(addD(today(),-i));}return Math.min(100,Math.round(100*done/(S.habits.length*30)));}
function firesTotal(){var c=0;Object.keys(S.fires).forEach(function(d){c+=S.fires[d].length;});return c;}
function firesGivenTotal(){var c=0;Object.keys(S.firesGiven).forEach(function(d){c+=S.firesGiven[d].length;});return c;}
function doneChallenges(){return S.doneChallenges.length;}

/* --- ACHIEVEMENTS --- */
var ACH=[
 {em:'👣',t:'Первый шаг',d:'Закрыт первый день',ok:function(){return closedDays()>=1||streak()>=1;}},
 {em:'🚀',t:'Разгон',d:'Серия из 3 дней подряд',ok:function(){return streak()>=3;}},
 {em:'📅',t:'Неделя дисциплины',d:'Серия из 7 дней подряд',ok:function(){return streak()>=7;}},
 {em:'🗓️',t:'Две недели',d:'Серия из 14 дней подряд',ok:function(){return streak()>=14;}},
 {em:'💪',t:'Месяц силы',d:'Серия из 30 дней подряд',ok:function(){return streak()>=30;}},
 {em:'🏅',t:'Полсотни',d:'Серия из 50 дней подряд',ok:function(){return streak()>=50;}},
 {em:'👑',t:'Легенда',d:'Серия из 100 дней подряд',ok:function(){return streak()>=100;}},
 {em:'🎯',t:'30 дней в деле',d:'30 закрытых дней (не обязательно подряд)',ok:function(){return closedDays()>=30;}},
 {em:'⚔️',t:'Вызов принят',d:'Пройти один вызов до конца',ok:function(){return doneChallenges()>=1;}},
 {em:'🏹',t:'Охотник за вызовами',d:'Пройти 5 вызовов до конца',ok:function(){return doneChallenges()>=5;}},
 {em:'🤝',t:'Опора сообщества',d:'Поддержать участников 10 раз',ok:function(){return firesGivenTotal()>=10;}}
];

/* --- MOTIVATION --- */
var MOT=['Ещё один шаг к цели! 🔥','Отлично! Так держать 💪','Ты сильнее, чем думаешь 🔥','Дисциплина — это свобода ⭐','Каждая отметка приближает тебя к мечте ✨'];
function mot(){return MOT[Math.floor(Math.random()*MOT.length)];}

/* --- RENDER --- */
var TAB='habits';
function setTab(t){TAB=t;document.querySelectorAll('.pill,.bnav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t);});render();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ava(photo,cls){var initial=USER.name?esc(USER.name.charAt(0).toUpperCase()):'Г';
 return photo?'<img class="'+cls+'" src="'+esc(photo)+'" onerror="this.outerHTML=\'<div class=\u0022avafall\u0022>\'+\''+initial+'\'+\u0027</div>\u0027">':'<div class="avafall">'+initial+'</div>';}
function myName(){return (S.settings.hideName&&TAB==='rating')?'Скрытый участник':(USER.name||'Гость');}

function calHTML(colorFn){
  var t=new Date(),off=(t.getDay()+6)%7,start=new Date(t);start.setDate(t.getDate()-((34)-off)-((start.getDay()+6)%7-off));
  start=new Date(t.getFullYear(),t.getMonth(),t.getDate()-34);start=new Date(start.getFullYear(),start.getMonth(),start.getDate()-((start.getDay()+6)%7));
  var h='<div class="cal"><div class="dow">Пн</div><div class="dow">Вт</div><div class="dow">Ср</div><div class="dow">Чт</div><div class="dow">Пт</div><div class="dow">Сб</div><div class="dow">Вс</div>';
  for(var i=0;i<35;i++){var d=new Date(start);d.setDate(start.getDate()+i);var key=ds(d);
    var cls='cell';var cl=colorFn(key);
    if(cl)cls+=' '+cl;
    if(key===today())cls+=' today';
    if(key>today())cls='';
    h+='<div class="'+cls+'">'+(key>today()?'':d.getDate())+'</div>';
  }
  return h+'</div>';
}

function render(){
  try{R[TAB]();}catch(e){fatal('Ошибка отрисовки: '+e.message);console.error(e);}
}

var R={};

/* --- HABITS TAB --- */
R.habits=function(){
  var c=document.getElementById('content');
  var h='<div class="card pcard">'+ava(USER.photo,'avatar')+'<div><div class="pname">'+esc(myName())+'</div><div class="psub">Серия: '+streak()+' · дней: '+closedDays()+'</div></div></div>';
  h+='<div class="card"><div class="plabel">Выполнено сегодня: '+pctToday()+'% · за 30 дней: '+pct30()+'%</div><div class="pbar"><div style="width:'+pctToday()+'%"></div></div>';
  if(S.habits.length===0){h+='<div class="mut">Пока нет привычек. Добавь первую!</div>';}
  else{
    var any=false;
    S.habits.forEach(function(hb){
      var done=hb.done&&hb.done[today()];
      h+='<div class="hrow"><div class="chk'+(done?' done':'')+'" onclick="toggleHabit('+hb.id+')">'+(done?'✓':'')+'</div><div class="hname'+(done?' done':'')+'">'+esc(hb.name)+'</div><button class="del" onclick="delHabit('+hb.id+')">✕</button></div>';
      if(done)any=true;
    });
    if(allDone(today()))h+='<div class="closed">День закрыт! Серия: '+streak()+' 🔥</div>';
  }
  h+='<div class="mot" id="mot" style="display:none"></div>';
  h+='<input type="text" id="nh" placeholder="Новая привычка"><button class="bigbtn" onclick="addHabit()">＋ Добавить привычку</button></div>';
  h+='<div class="sec">Календарь · 5 недель</div><div class="card">'+calHTML(function(k){if(!S.habits.length||habitsOn(k)===0)return '';return allDone(k)?'full':'part';})+'</div>';
  h+='<div class="hint">Напоминания приходят от бота: утро 08:00 · вода 10:00 и 15:00 · вечер 20:00</div>';
  c.innerHTML=h;
};
window.toggleHabit=function(id){
  var hb=S.habits.find(function(x){return x.id===id;});if(!hb)return;
  hb.done=hb.done||{};
  if(hb.done[today()]){delete hb.done[today()];}else{hb.done[today()]=true;
    var m=document.getElementById('mot');if(m){m.textContent=mot();m.style.display='block';setTimeout(function(){m.style.display='none';},2500);}}
  save();render();
};
window.delHabit=function(id){S.habits=S.habits.filter(function(x){return x.id!==id;});save();render();};
window.addHabit=function(){var i=document.getElementById('nh');var v=(i.value||'').trim();if(!v)return;S.habits.push({id:Date.now(),name:v,done:{}});i.value='';save();render();};

/* --- RATING TAB --- */
R.rating=function(){
  var c=document.getElementById('content');
  var h='<div class="card pcard">'+ava(USER.photo,'avatar')+'<div><div class="pname">'+esc(USER.name||'Гость')+'</div><div class="psub">Твоё место: 1</div></div></div>';
  var me={name:myName(),photo:USER.photo,days:closedDays(),fires:firesTotal(),me:true};
  var list=[me].concat(S.others.map(function(o){return{name:o.hide?'Скрытый участник':o.name,photo:o.photo,days:o.days||0,fires:o.fires||0,me:false,id:o.id};}));
  list.sort(function(a,b){return b.days-a.days;});
  var medals=['🥇','🥈','🥉'];
  h+='<div class="card">';
  list.forEach(function(p,i){
    var medal=medals[i]||(i+1);
    var supported=p.me||((S.firesGiven[today()]||[]).indexOf(p.id||'me')>=0);
    h+='<div class="rrow"><div class="rplace">'+medal+'</div>'+(p.photo?'<img class="ravatar" src="'+esc(p.photo)+'">':'<div class="avafall" style="width:40px;height:40px;font-size:16px">'+esc((p.name||'У').charAt(0).toUpperCase())+'</div>')+
    '<div class="rname">'+esc(p.name)+(p.me&&allDone(today())?' <span style="color:#2e7d32;font-size:12px">✅ всё выполнено</span>':'')+'<div class="rsub">Дней пройдено: '+p.days+' · 🔥 '+p.fires+'</div></div>'+
    (p.me?'':'<button class="firebtn'+(supported?' off':'')+'" onclick="support(\''+esc(p.id||'')+'\')">'+(supported?'🔥 уже поддержан':'🔥 Поддержать')+'</button>')+'</div>';
  });
  h+='</div>';
  if(S.others.length===0)h+='<div class="hint">Участники, вступившие в бота, появятся здесь автоматически — для этого нужен общий сервер, он подключается отдельно.</div>';
  c.innerHTML=h;
};
window.support=function(id){
  if(!id)return;
  var tod=today();S.firesGiven[tod]=S.firesGiven[tod]||[];
  if(S.firesGiven[tod].indexOf(id)>=0)return;
  S.firesGiven[tod].push(id);
  var o=S.others.find(function(x){return x.id===id;});if(o)o.fires=(o.fires||0)+1;
  save();render();
};

/* --- CHALLENGES TAB --- */
R.chall=function(){
  var c=document.getElementById('content');
  var h='<div class="card"><input type="text" id="cn" placeholder="Название вызова"><input type="text" id="cd" placeholder="Срок в днях, например 14"><button class="bigbtn" onclick="createChall()">⚡ Бросить вызов</button></div>';
  if(!S.challenges.length)h+='<div class="mut">Пока нет вызовов. Брось первый!</div>';
  S.challenges.forEach(function(ch){
    var marked=Object.keys(ch.marked||{}).length;
    var pct=Math.min(100,Math.round(100*marked/ch.days));
    h+='<div class="card"><div class="pname" style="font-size:17px">'+esc(ch.name)+'</div><div class="psub">Срок: '+ch.days+' дн. · участников: '+ch.participants+'</div><div class="pbar"><div style="width:'+pct+'%"></div></div><div class="plabel">'+marked+' из '+ch.days+' дней</div>';
    if(!ch.joined)h+='<button class="bigbtn" style="background:#ffd60a;color:#1a1a1a" onclick="acceptChall('+ch.id+')">Принять вызов</button>';
    else if(!ch.done)h+='<button class="bigbtn" style="background:#ffd60a;color:#1a1a1a" onclick="markChall('+ch.id+')">＋ Отметить день</button>';
    else h+='<div class="closed">Вызов пройден! 🏆</div>';
    h+='</div>';
  });
  c.innerHTML=h;
};
window.createChall=function(){
  var n=document.getElementById('cn'),d=document.getElementById('cd');
  var name=(n.value||'').trim(),days=parseInt(d.value,10);
  if(!name||!days||days<1)return;
  S.challenges.push({id:Date.now(),name:name,days:days,joined:true,marked:{},done:false,participants:1});
  n.value='';d.value='';save();render();
};
window.acceptChall=function(id){var ch=S.challenges.find(function(x){return x.id===id;});if(!ch)return;ch.joined=true;ch.participants=(ch.participants||1)+1;save();render();};
window.markChall=function(id){
  var ch=S.challenges.find(function(x){return x.id===id;});if(!ch)return;
  var t=today();ch.marked=ch.marked||{};
  if(ch.marked[t])return;
  ch.marked[t]=true;
  if(Object.keys(ch.marked).length>=ch.days&&!ch.done){ch.done=true;if(S.doneChallenges.indexOf(ch.id)<0)S.doneChallenges.push(ch.id);}
  save();render();
};

/* --- MOOD TAB --- */
var EMO=['😞','😕','😐','🙂','😄'];
R.mood=function(){
  var c=document.getElementById('content');
  var m=S.moods[today()]||{};
  var vals=Object.keys(S.moods).map(function(k){return S.moods[k].e;});
  var pct=vals.length?Math.round(100*vals.reduce(function(a,b){return a+b;},0)/(vals.length*5)):0;
  var h='<div class="card"><div class="pname" style="font-size:17px">Как ты себя чувствуешь сегодня?</div><div class="pbar"><div style="width:'+pct+'%"></div></div><div class="plabel">Среднее самочувствие: '+pct+'%</div>';
  h+='<div class="emoji5">';
  for(var i=1;i<=5;i++)h+='<button class="'+(m.e===i?'on':'')+'" onclick="saveMood('+i+')">'+EMO[i-1]+'</button>';
  h+='</div><textarea class="note" id="mn" placeholder="Заметка (необязательно)">'+esc(m.note||'')+'</textarea>';
  h+='<button class="bigbtn" onclick="saveMoodNote()">Сохранить настроение</button></div>';
  h+='<div class="sec">Календарь настроения · 5 недель</div><div class="card">'+calHTML(function(k){return S.moods[k]?'m'+S.moods[k].e:'';})+'</div>';
  h+='<div class="hint">📅 Кнопка календаря всегда доступна в этом разделе — цвет дня показывает настроение от красного к зелёному.</div>';
  c.innerHTML=h;
};
window.saveMood=function(e){var t=today();S.moods[t]=S.moods[t]||{};S.moods[t].e=e;if(S.moods[t].note===undefined)S.moods[t].note='';save();render();};
window.saveMoodNote=function(){var t=today();var v=document.getElementById('mn').value;S.moods[t]=S.moods[t]||{};S.moods[t].note=v;if(!S.moods[t].e)S.moods[t].e=3;save();render();};

/* --- PROFILE TAB --- */
R.profile=function(){
  var c=document.getElementById('content');
  var h='<div class="card pcard">'+ava(USER.photo,'avatar')+'<div><div class="pname">'+esc(USER.name||'Гость')+'</div><div class="psub">Серия: '+streak()+' · закрыто дней: '+closedDays()+'</div></div></div>';
  h+='<div class="sec">Достижения</div><div class="card">';
  ACH.forEach(function(a){
    var got=a.ok();
    h+='<div class="ach'+(got?' got':'')+'"><div class="em">'+a.em+'</div><div><div class="t">'+a.t+' '+(got?'✅':'')+'</div><div class="d">'+a.d+'</div></div></div>';
  });
  h+='</div>';
  h+='<div class="card"><div class="pname" style="font-size:16px">🧊 Заморозки</div><div class="psub">Доступно: 2 из 2</div></div>';
  if(!USER.name)h+='<div class="card"><div class="pname" style="font-size:16px">Твоё имя</div><input type="text" id="mn2" placeholder="Например, Света"><button class="bigbtn" onclick="saveName()">Сохранить</button><div class="hint">Telegram не передал имя — впиши его один раз, и оно появится на всех вкладках.</div></div>';
  h+='<div class="sec">Настройки</div><div class="card">';
  h+=swRow('morning','Утреннее напоминание','Задания на день · 08:00');
  h+=swRow('water1','Напоминание пить воду №1','10:00');
  h+=swRow('water2','Напоминание пить воду №2','15:00');
  h+=swRow('evening','Вечернее напоминание','Придёт, если день ещё не закрыт · 20:00');
  h+=swRow('hideName','Скрыть имя в рейтинге','Твоё имя заменится на «Скрытый участник»');
  h+='<div class="hint">Время напоминаний одно для всех и задаётся в боте (Botmother → Рассылки). Тумблер включает или выключает напоминание для тебя.</div></div>';
  c.innerHTML=h;
};
function swRow(key,title,sub){
  return '<div class="srow"><div class="st"><b>'+title+'</b><span>'+sub+'</span></div><div class="sw'+(S.settings[key]?' on':'')+'" onclick="tgl(\''+key+'\')"></div></div>';
}
window.tgl=function(k){S.settings[k]=!S.settings[k];save();render();};
window.saveName=function(){var v=(document.getElementById('mn2').value||'').trim();if(!v)return;S.name=v;USER.name=v;USER.source='saved';save();render();};

/* --- START --- */
render();
</script>
</body>
</html>
