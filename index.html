<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трекер LIFE</title>
<script>
window.onerror = function(msg, src, line){
  var b = document.getElementById('errbar');
  if(b){ b.style.display='block'; b.textContent = 'Ошибка: ' + msg + ' (строка ' + line + ')'; }
  return false;
};
</script>
<style>
:root{ --acc:#FFD400; --bg:#F5F5F7; --card:#FFFFFF; --txt:#111; --mut:#8E8E93; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ margin:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; color:var(--txt); }
#errbar{ display:none; background:#E5484D; color:#fff; padding:10px 14px; font-size:13px; position:fixed; top:0; left:0; right:0; z-index:99; }
.top{ background:var(--acc); padding:16px 16px 12px; }
.top .t{ font-size:22px; font-weight:700; }
.top .b{ display:inline-block; margin-top:4px; background:rgba(255,255,255,.6); border-radius:10px; padding:2px 10px; font-size:12px; font-weight:600; }
#view{ padding:14px 14px 90px; }
.card{ background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; }
.head{ background:var(--acc); }
.head .big{ font-size:20px; font-weight:700; }
.muted{ color:var(--mut); font-size:13px; margin-top:4px; }
.h2{ font-size:13px; font-weight:700; color:var(--mut); letter-spacing:.5px; margin:14px 4px 8px; }
.row{ display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid #EFEFF2; }
.row:last-child{ border-bottom:none; }
.grow{ flex:1; }
.chk{ width:32px; height:32px; border-radius:50%; border:2px solid #D8D8DE; background:#fff; font-size:16px; font-weight:700; flex:none; }
.chk.on{ background:var(--acc); border-color:var(--acc); }
.del{ background:none; border:none; color:#C7C7CC; font-size:18px; padding:6px; }
.mini{ width:32px; height:32px; border-radius:10px; border:none; background:#EFEFF2; font-size:16px; font-weight:700; }
.btn{ display:block; width:100%; margin-top:12px; background:var(--acc); border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:700; }
.btn2{ display:block; width:100%; margin-top:10px; background:#EFEFF2; border:none; border-radius:14px; padding:12px; font-size:15px; font-weight:600; color:#333; }
.empty{ text-align:center; color:var(--mut); font-size:14px; }
.bar{ height:10px; border-radius:6px; background:#EFEFF2; margin-top:8px; overflow:hidden; }
.bar > div{ height:100%; background:var(--acc); }
.emoji{ font-size:34px; padding:10px; background:#F2F2F7; border-radius:14px; border:2px solid transparent; }
.emoji.sel{ border-color:var(--acc); background:#FFF7CC; }
.ta{ width:100%; border:1px solid #E4E4EA; border-radius:12px; padding:10px; font-size:15px; font-family:inherit; min-height:70px; }
.stat{ flex:1; text-align:center; background:var(--card); border-radius:16px; padding:14px 4px; }
.stat .n{ font-size:24px; font-weight:800; }
.stat .l{ font-size:12px; color:var(--mut); margin-top:2px; }
.stats{ display:flex; gap:10px; margin-bottom:12px; }
.ach{ display:inline-block; width:31%; margin:1%; background:#F2F2F7; border-radius:14px; padding:12px 4px; text-align:center; vertical-align:top; }
.ach .ic{ font-size:26px; }
.ach .an{ font-size:12px; font-weight:700; margin-top:4px; }
.ach .ad{ font-size:10px; color:var(--mut); margin-top:2px; }
.ach.on{ background:#FFF7CC; border:1px solid var(--acc); }
.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal .cd{ aspect-ratio:1; border-radius:10px; background:#EFEFF2; display:flex; align-items:center; justify-content:center; font-size:11px; color:#B9B9C0; }
.cal .cd.done{ background:var(--acc); color:#111; font-weight:700; }
.cal .cd.today{ outline:2px solid #111; outline-offset:-2px; }
.tgl{ width:52px; height:32px; border-radius:16px; background:#D8D8DE; border:none; position:relative; flex:none; }
.tgl.on{ background:var(--acc); }
.tgl span{ position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:left .15s; }
.tgl.on span{ left:23px; }
input[type=time]{ border:1px solid #E4E4EA; border-radius:10px; padding:6px 8px; font-size:15px; }
.tabbar{ position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #E4E4EA; display:flex; padding:6px 0 10px; z-index:10; }
.tab{ flex:1; background:none; border:none; font-size:11px; color:var(--mut); display:flex; flex-direction:column; align-items:center; gap:2px; }
.tab .ti{ font-size:20px; }
.tab.active{ color:#111; font-weight:700; }
.danger{ color:#E5484D; }
</style>
</head>
<body>
<div id="errbar"></div>
<div class="top">
  <div class="t">Трекер LIFE</div>
  <div class="b">Версия 10</div>
</div>
<div id="view"></div>
<div class="tabbar">
  <button class="tab active" data-tab="habits" onclick="go('habits')"><span class="ti">✅</span><span>Привычки</span></button>
  <button class="tab" data-tab="rating" onclick="go('rating')"><span class="ti">🏆</span><span>Рейтинг</span></button>
  <button class="tab" data-tab="challenges" onclick="go('challenges')"><span class="ti">⚡</span><span>Вызовы</span></button>
  <button class="tab" data-tab="mood" onclick="go('mood')"><span class="ti">😊</span><span>Настроение</span></button>
  <button class="tab" data-tab="profile" onclick="go('profile')"><span class="ti">👤</span><span>Профиль</span></button>
</div>
<script>
var KEY = 'lifeTrackerV10';
var S = load();

function fresh(){
  return { cur:'habits', habits:[], rating:[], challenges:[], moods:[], doneDates:[],
    freezes:2, moodSel:-1, moodNote:'', settings:{ morning:true, morningTime:'08:00', evening:true } };
}
function load(){
  try{
    var r = localStorage.getItem(KEY);
    if(r){ var d = JSON.parse(r); var f = fresh();
      for(var k in f){ if(!(k in d)) d[k] = f[k]; }
      return d; }
  }catch(e){}
  return fresh();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function uid(){ return Date.now() % 100000000 + Math.floor(Math.random()*1000); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ds(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function today(){ return ds(new Date()); }
function parseD(iso){ var p = iso.split('-'); return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2])); }
function nextDay(iso){ var d = parseD(iso); d.setDate(d.getDate()+1); return ds(d); }
var MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmt(iso){ var p = iso.split('-'); return parseInt(p[2]) + ' ' + MON[parseInt(p[1])-1]; }

function streak(){
  var set = {};
  for(var i=0;i<S.doneDates.length;i++) set[S.doneDates[i]] = 1;
  var d = new Date();
  if(!set[ds(d)]) d.setDate(d.getDate()-1);
  var n = 0;
  while(set[ds(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function bestStreak(){
  var list = S.doneDates.slice().sort(function(a,b){ return parseD(a) - parseD(b); });
  var best = 0, c = 0, prev = null;
  for(var i=0;i<list.length;i++){
    if(prev && nextDay(prev) === list[i]) c++; else c = 1;
    if(c > best) best = c;
    prev = list[i];
  }
  return best;
}

function go(t){ S.cur = t; save(); render(); }

function render(){
  var v = document.getElementById('view');
  if(S.cur === 'habits') v.innerHTML = viewHabits();
  else if(S.cur === 'rating') v.innerHTML = viewRating();
  else if(S.cur === 'challenges') v.innerHTML = viewChallenges();
  else if(S.cur === 'mood') v.innerHTML = viewMood();
  else v.innerHTML = viewProfile();
  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    if(tabs[i].getAttribute('data-tab') === S.cur) tabs[i].classList.add('active');
    else tabs[i].classList.remove('active');
  }
  window.scrollTo(0,0);
}

/* ----- ПРИВЫЧКИ ----- */
function viewHabits(){
  var h = '';
  h += '<div class="card head"><div class="big">Серия: ' + streak() + '</div>';
  h += '<div class="muted">Закрой все привычки, чтобы засчитать день</div></div>';
  h += '<div class="h2">ПРИВЫЧКИ</div>';
  if(S.habits.length === 0) h += '<div class="card empty">Пока пусто. Добавь первую привычку!</div>';
  h += '<div class="card">';
  for(var i=0;i<S.habits.length;i++){
    var it = S.habits[i];
    var done = !!it.dates[today()];
    h += '<div class="row">';
    h += '<button class="chk' + (done?' on':'') + '" onclick="toggleHabit(' + it.id + ')">' + (done?'✓':'') + '</button>';
    h += '<div class="grow">' + esc(it.name) + '</div>';
    h += '<button class="del" onclick="delHabit(' + it.id + ')">✕</button>';
    h += '</div>';
  }
  h += '</div>';
  h += '<button class="btn" onclick="addHabit()">＋ Добавить привычку</button>';
  return h;
}
function addHabit(){
  var n = prompt('Название привычки:');
  if(n && n.replace(/\s/g,'')){
    S.habits.push({ id: uid(), name: n.trim(), dates: {} });
    refreshDone();
  }
}
function delHabit(id){
  var out = [];
  for(var i=0;i<S.habits.length;i++){ if(S.habits[i].id !== id) out.push(S.habits[i]); }
  S.habits = out;
  refreshDone();
}
function toggleHabit(id){
  var t = today();
  for(var i=0;i<S.habits.length;i++){
    if(S.habits[i].id === id){
      if(S.habits[i].dates[t]) delete S.habits[i].dates[t];
      else S.habits[i].dates[t] = 1;
    }
  }
  refreshDone();
}
function refreshDone(){
  var t = today();
  var all = S.habits.length > 0;
  for(var i=0;i<S.habits.length;i++){ if(!S.habits[i].dates[t]) all = false; }
  var idx = S.doneDates.indexOf(t);
  if(all && idx < 0) S.doneDates.push(t);
  if(!all && idx >= 0) S.doneDates.splice(idx, 1);
  save();
  render();
}

/* ----- РЕЙТИНГ ----- */
function viewRating(){
  var h = '';
  h += '<div class="h2">РЕЙТИНГ УЧАСТНИКОВ</div>';
  if(S.rating.length === 0) h += '<div class="card empty">Пока никого нет.<br>Добавь участников и следи за их сериями!</div>';
  var list = S.rating.slice().sort(function(a,b){ return b.days - a.days; });
  h += '<div class="card">';
  for(var i=0;i<list.length;i++){
    var it = list[i];
    h += '<div class="row">';
    h += '<div class="grow"><b>' + esc(it.name) + '</b><div class="muted">' + it.days + ' дн. в дисциплине</div></div>';
    h += '<button class="mini" onclick="rateDays(' + it.id + ',-1)">−</button>';
    h += '<button class="mini" onclick="rateDays(' + it.id + ',1)">＋</button>';
    h += '<button class="del" onclick="delRating(' + it.id + ')">✕</button>';
    h += '</div>';
  }
  h += '</div>';
  h += '<button class="btn" onclick="addRating()">＋ Добавить участника</button>';
  return h;
}
function addRating(){
  var n = prompt('Имя участника:');
  if(n && n.replace(/\s/g,'')){
    S.rating.push({ id: uid(), name: n.trim(), days: 0 });
    save(); render();
  }
}
function rateDays(id, v){
  for(var i=0;i<S.rating.length;i++){
    if(S.rating[i].id === id){
      S.rating[i].days += v;
      if(S.rating[i].days < 0) S.rating[i].days = 0;
    }
  }
  save(); render();
}
function delRating(id){
  var out = [];
  for(var i=0;i<S.rating.length;i++){ if(S.rating[i].id !== id) out.push(S.rating[i]); }
  S.rating = out;
  save(); render();
}

/* ----- ВЫЗОВЫ ----- */
function viewChallenges(){
  var h = '';
  h += '<div class="h2">ВЫЗОВЫ</div>';
  if(S.challenges.length === 0) h += '<div class="card empty">Пока нет вызовов.<br>Создай свой и отмечай дни!</div>';
  for(var i=0;i<S.challenges.length;i++){
    var it = S.challenges[i];
    var pct = it.total > 0 ? Math.min(100, Math.round(it.days * 100 / it.total)) : 0;
    h += '<div class="card">';
    h += '<div class="row"><div class="grow"><b>' + esc(it.name) + '</b><div class="muted">' + it.days + ' из ' + it.total + ' дней</div></div>';
    h += '<button class="del" onclick="delChallenge(' + it.id + ')">✕</button></div>';
    h += '<div class="bar"><div style="width:' + pct + '%"></div></div>';
    h += '<button class="btn2" onclick="markDay(' + it.id + ')">＋ Отметить день</button>';
    h += '</div>';
  }
  h += '<button class="btn" onclick="addChallenge()">＋ Добавить вызов</button>';
  return h;
}
function addChallenge(){
  var n = prompt('Название вызова:');
  if(!n || !n.replace(/\s/g,'')) return;
  var t = prompt('Сколько дней длится вызов?', '30');
  var num = parseInt(t);
  if(isNaN(num) || num < 1) num = 30;
  S.challenges.push({ id: uid(), name: n.trim(), total: num, days: 0 });
  save(); render();
}
function markDay(id){
  for(var i=0;i<S.challenges.length;i++){
    if(S.challenges[i].id === id && S.challenges[i].days < S.challenges[i].total) S.challenges[i].days++;
  }
  save(); render();
}
function delChallenge(id){
  var out = [];
  for(var i=0;i<S.challenges.length;i++){ if(S.challenges[i].id !== id) out.push(S.challenges[i]); }
  S.challenges = out;
  save(); render();
}

/* ----- НАСТРОЕНИЕ ----- */
var EMO = ['😄','🙂','😐','😞','😢'];
function viewMood(){
  var h = '';
  h += '<div class="h2">КАК СЕБЯ ЧУВСТВУЕШЬ?</div>';
  h += '<div class="card"><div style="display:flex;gap:8px;justify-content:space-between">';
  for(var i=0;i<EMO.length;i++){
    h += '<button class="emoji' + (S.moodSel===i?' sel':'') + '" onclick="pickMood(' + i + ')">' + EMO[i] + '</button>';
  }
  h += '</div>';
  h += '<textarea class="ta" placeholder="Заметка за день (необязательно)" oninput="S.moodNote=this.value;save()">' + esc(S.moodNote || '') + '</textarea>';
  h += '<button class="btn" onclick="saveMood()">Сохранить</button></div>';
  h += '<div class="h2">ИСТОРИЯ</div>';
  if(S.moods.length === 0) h += '<div class="card empty">Здесь появятся твои записи.</div>';
  for(var j=0;j<S.moods.length;j++){
    var m = S.moods[j];
    h += '<div class="card"><div class="row"><div style="font-size:26px">' + EMO[m.e] + '</div>';
    h += '<div class="grow"><b>' + fmt(m.date) + '</b>' + (m.note ? '<div class="muted">' + esc(m.note) + '</div>' : '') + '</div>';
    h += '<button class="del" onclick="delMood(' + m.id + ')">✕</button></div></div>';
  }
  return h;
}
function pickMood(i){ S.moodSel = i; save(); render(); }
function saveMood(){
  if(S.moodSel < 0){ alert('Сначала выбери смайлик'); return; }
  S.moods.unshift({ id: uid(), date: today(), e: S.moodSel, note: S.moodNote || '' });
  S.moodSel = -1; S.moodNote = '';
  save(); render();
}
function delMood(id){
  var out = [];
  for(var i=0;i<S.moods.length;i++){ if(S.moods[i].id !== id) out.push(S.moods[i]); }
  S.moods = out;
  save(); render();
}

/* ----- ПРОФИЛЬ ----- */
function viewProfile(){
  var h = '';
  h += '<div class="h2">СТАТИСТИКА</div>';
  h += '<div class="stats">';
  h += '<div class="stat"><div class="n">' + streak() + '</div><div class="l">текущая серия</div></div>';
  h += '<div class="stat"><div class="n">' + bestStreak() + '</div><div class="l">лучшая серия</div></div>';
  h += '<div class="stat"><div class="n">' + S.doneDates.length + '</div><div class="l">всего дней</div></div>';
  h += '</div>';
  h += '<div class="card"><div class="row"><div style="font-size:28px">❄️</div>';
  h += '<div class="grow"><b>Заморозки: 2 из 2</b><div class="muted">Если пропустите день, заморозка сработает сама и сохранит серию. Обновляются каждый месяц.</div></div></div></div>';

  var achs = achList();
  h += '<div class="h2">ДОСТИЖЕНИЯ · ' + achs.on + ' ИЗ ' + achs.list.length + '</div>';
  h += '<div class="card">';
  for(var i=0;i<achs.list.length;i++){
    var a = achs.list[i];
    h += '<div class="ach' + (a.done?' on':'') + '"><div class="ic">' + a.ic + '</div>';
    h += '<div class="an">' + a.name + '</div><div class="ad">' + a.desc + '</div></div>';
  }
  h += '</div>';

  h += '<div class="h2">ПОСЛЕДНИЕ 5 НЕДЕЛЬ</div>';
  h += '<div class="card">' + calendar() + '</div>';

  h += '<div class="h2">НАСТРОЙКИ</div>';
  h += '<div class="card">';
  h += '<div class="row"><div class="grow"><b>Утреннее сообщение</b><div class="muted">Серия и задания на день</div></div>';
  h += '<button class="tgl' + (S.settings.morning?' on':'') + '" onclick="tglMorning()"><span></span></button></div>';
  h += '<div class="row"><div class="grow"><b>Время утром</b><div class="muted">По вашему часовому поясу</div></div>';
  h += '<input type="time" value="' + S.settings.morningTime + '" onchange="S.settings.morningTime=this.value;save()"></div>';
  h += '<div class="row"><div class="grow"><b>Вечернее напоминание</b><div class="muted">Придёт, если день ещё не закрыт</div></div>';
  h += '<button class="tgl' + (S.settings.evening?' on':'') + '" onclick="tglEvening()"><span></span></button></div>';
  h += '</div>';
  h += '<button class="btn2 danger" onclick="resetAll()">Сбросить весь прогресс</button>';
  return h;
}
function tglMorning(){ S.settings.morning = !S.settings.morning; save(); render(); }
function tglEvening(){ S.settings.evening = !S.settings.evening; save(); render(); }

function achList(){
  var st = streak(), tot = S.doneDates.length;
  var doneCh = 0;
  for(var i=0;i<S.challenges.length;i++){ if(S.challenges[i].days >= S.challenges[i].total) doneCh++; }
  var l = [
    { ic:'🌱', name:'Первый шаг', desc:'Закрыть первый день', done: tot >= 1 },
    { ic:'⚡', name:'Разгон', desc:'Серия 3 дня подряд', done: st >= 3 },
    { ic:'🔥', name:'Неделя дисциплины', desc:'Серия 7 дней подряд', done: st >= 7 },
    { ic:'💪', name:'Две недели', desc:'Серия 14 дней подряд', done: st >= 14 },
    { ic:'🎖️', name:'Месяц силы', desc:'Серия 30 дней подряд', done: st >= 30 },
    { ic:'💎', name:'Полсотни', desc:'Серия 50 дней подряд', done: st >= 50 },
    { ic:'👑', name:'Легенда', desc:'Серия 100 дней подряд', done: st >= 100 },
    { ic:'📅', name:'30 дней в деле', desc:'30 закрытых дней (не обязательно подряд)', done: tot >= 30 },
    { ic:'🎯', name:'Вызов принят', desc:'Пройти первый вызов до конца', done: doneCh >= 1 },
    { ic:'🏆', name:'Охотник за вызовами', desc:'Пройти 5 вызовов до конца', done: doneCh >= 5 },
    { ic:'🤝', name:'Опора сообщества', desc:'Поддержать участников 10 раз', done: false }
  ];
  var on = 0;
  for(var k=0;k<l.length;k++){ if(l[k].done) on++; }
  return { list: l, on: on };
}

function calendar(){
  var set = {};
  for(var i=0;i<S.doneDates.length;i++) set[S.doneDates[i]] = 1;
  var d = new Date();
  var wd = (d.getDay() + 6) % 7; // 0 = Пн
  d.setDate(d.getDate() - wd - 28); // понедельник 4 недели назад
  var h = '<div class="cal">';
  var days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  for(var k=0;k<7;k++) h += '<div class="cd" style="background:none;color:#8E8E93;font-weight:700">' + days[k] + '</div>';
  var t = today();
  for(var n=0;n<35;n++){
    var iso = ds(d);
    var cls = 'cd';
    if(set[iso]) cls += ' done';
    if(iso === t) cls += ' today';
    h += '<div class="' + cls + '">' + d.getDate() + '</div>';
    d.setDate(d.getDate() + 1);
  }
  h += '</div>';
  return h;
}

function resetAll(){
  if(confirm('Точно обнулить весь прогресс?')){
    S = fresh();
    save();
    render();
  }
}

render();
</script>
</body>
</html>
