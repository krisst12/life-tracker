<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Трекер LIFE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #f4f4f0; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #1a1a1a; }
  body { max-width: 640px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }
  #errbox { display: none; background: #d93025; color: #fff; padding: 8px 12px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .header { background: #ffd400; padding: 18px 16px 14px; }
  .header h1 { font-size: 24px; font-weight: 800; }
  .ver { display: inline-block; margin-top: 6px; background: rgba(0,0,0,.12); border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
  .tabs { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; position: sticky; top: 0; background: #f4f4f0; z-index: 5; }
  .tab { border: none; background: #e6e6e1; color: #333; padding: 9px 16px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; flex-shrink: 0; font-family: inherit; }
  .tab.on { background: #1a1a1a; color: #ffd400; }
  .page { display: none; padding: 4px 12px 12px; }
  .page.on { display: block; }
  .card { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .profile-row { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #eee; }
  .avatar-ph { width: 52px; height: 52px; border-radius: 50%; background: #e8e8e3; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #888; }
  .pname { font-size: 18px; font-weight: 700; }
  .pstats { font-size: 13px; color: #777; margin-top: 2px; }
  .section-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #999; margin: 14px 4px 8px; text-transform: uppercase; }
  .habit { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid #f0f0ec; }
  .habit:last-child { border-bottom: none; }
  .circle { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #c9c9c2; background: #fff; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: transparent; }
  .circle.done { background: #ffd400; border-color: #1a1a1a; color: #1a1a1a; }
  .hname { flex: 1; font-size: 16px; }
  .hname.done { text-decoration: line-through; color: #aaa; }
  .xbtn { border: none; background: none; color: #c0c0ba; font-size: 20px; cursor: pointer; padding: 4px 8px; font-family: inherit; }
  .btn { width: 100%; border: none; background: #1a1a1a; color: #ffd400; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; font-family: inherit; }
  .btn2 { width: 100%; border: none; background: #ecece7; color: #333; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit; }
  .inp { width: 100%; border: 1px solid #ddd; border-radius: 12px; padding: 12px; font-size: 15px; margin-top: 10px; font-family: inherit; }
  .empty { text-align: center; color: #999; font-size: 14px; padding: 26px 10px; }
  .bar { height: 10px; background: #ecece7; border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: #ffd400; border-radius: 6px; transition: width .3s; }
  .barinfo { font-size: 13px; color: #777; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #1a1a1a; color: #ffd400; padding: 12px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; z-index: 20; max-width: 90%; text-align: center; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .dow { text-align: center; font-size: 11px; color: #999; font-weight: 600; padding-bottom: 2px; }
  .day { aspect-ratio: 1; border-radius: 10px; background: #f1f1ec; color: #b5b5ae; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
  .day.part { background: #ffe98a; color: #7a5c00; }
  .day.full { background: #ffd400; color: #1a1a1a; }
  .day.today { outline: 2px solid #1a1a1a; outline-offset: 1px; }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid #f0f0ec; }
  .rank-row:last-child { border-bottom: none; }
  .medal { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; }
  .firebtn { border: 1px solid #eee; background: #fafaf6; color: #ff6a00; font-size: 18px; padding: 6px 10px; border-radius: 12px; cursor: pointer; font-family: inherit; }
  .firebtn:disabled { opacity: .35; }
  .firecount { font-size: 13px; color: #888; }
  .ch-btn { display: inline-block; border: none; background: #1a1a1a; color: #ffd400; padding: 9px 14px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; margin: 6px 6px 0 0; font-family: inherit; }
  .ch-btn.ghost { background: #ecece7; color: #333; }
  .setrow { display: flex; align-items: center; justify-content: space-between; padding: 13px 2px; border-bottom: 1px solid #f2f2ee; }
  .setrow:last-child { border-bottom: none; }
  .setname { font-size: 15px; font-weight: 600; }
  .setsub { font-size: 12px; color: #999; margin-top: 2px; }
  .switch { width: 48px; height: 28px; border-radius: 16px; background: #ddd; border: none; position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on { background: #ffd400; }
  .switch.on::after { left: 23px; }
  .ach { display: flex; align-items: center; gap: 12px; padding: 10px 2px; }
  .ach-ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #f0f0eb; filter: grayscale(1); opacity: .55; flex-shrink: 0; }
  .ach.got .ach-ic { background: #ffd400; filter: none; opacity: 1; }
  .ach-name { font-size: 14px; font-weight: 700; }
  .ach-sub { font-size: 12px; color: #999; }
  .moodrow { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .mood { font-size: 30px; padding: 8px; border-radius: 14px; background: #f4f4ef; cursor: pointer; border: 2px solid transparent; }
  .mood.sel { border-color: #1a1a1a; background: #ffe98a; }
  .fz { background: #f4f4ef; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #666; margin-top: 8px; }
  .note { font-size: 12px; color: #999; margin-top: 6px; }
  .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 640px; background: #fff; border-top: 1px solid #eee; display: flex; z-index: 10; }
  .nav button { flex: 1; border: none; background: none; padding: 8px 2px 10px; font-size: 11px; color: #999; cursor: pointer; font-family: inherit; }
  .nav button.on { color: #1a1a1a; font-weight: 700; }
  .nav .ic { font-size: 20px; display: block; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="errbox"></div>
<div class="header"><h1>🔥 Трекер LIFE</h1><span class="ver">Версия 17</span></div>
<div class="tabs">
  <button class="tab on" data-p="habits">Привычки</button>
  <button class="tab" data-p="rank">Рейтинг</button>
  <button class="tab" data-p="chal">Вызовы</button>
  <button class="tab" data-p="mood">Настроение</button>
  <button class="tab" data-p="prof">Профиль</button>
</div>
<div id="habits" class="page on"></div>
<div id="rank" class="page"></div>
<div id="chal" class="page"></div>
<div id="mood" class="page"></div>
<div id="prof" class="page"></div>
<div class="nav">
  <button data-p="habits" class="on"><span class="ic">✅</span>Привычки</button>
  <button data-p="rank"><span class="ic">🏆</span>Рейтинг</button>
  <button data-p="chal"><span class="ic">⚡️</span>Вызовы</button>
  <button data-p="mood"><span class="ic">🙂</span>Настроение</button>
  <button data-p="prof"><span class="ic">👤</span>Профиль</button>
</div>
<script>
(function(){
  window.onerror = function(m, s, l) {
    var e = document.getElementById('errbox');
    if (e) { e.style.display='block'; e.textContent = 'Ошибка: ' + m + ' (строка ' + l + ')'; }
  };
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }
  function me() {
    var u = null;
    try { if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) u = tg.initDataUnsafe.user; } catch(e) {}
    return u || null;
  }
  function myName() {
    var u = me();
    if (u) return u.first_name || u.username || 'Участник';
    return 'Гость';
  }
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
  function todayKey() { var d = new Date(); var m = d.getMonth()+1; var dd = d.getDate(); return d.getFullYear() + '-' + (m<10?'0':'') + m + '-' + (dd<10?'0':'') + dd; }
  function toast(t) {
    var old = document.getElementById('tst'); if (old) old.remove();
    var el = document.createElement('div'); el.className='toast'; el.id='tst'; el.textContent=t;
    document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 2600);
  }
  var MOTIV = ['Отлично! Ещё один шаг к цели! 🔥','Так держать! 💪','Красиво закрыто! ✨','Ты сильнее, чем думаешь 💪','Прогресс налицо! 🔥'];
  var data = load('lf', { habits: [], checks: {}, mood: [], chals: [], accepted: {}, fires: {}, fireDays: {}, doneAll: {}, settings: { mute: true, w1: true, w2: true, eve: true, hide: false } });

  function checksToday() {
    var t = todayKey();
    if (!data.checks[t]) data.checks[t] = {};
    return data.checks[t];
  }
  function pct(arr, obj) {
    if (!arr.length) return 0;
    var n = 0; for (var i=0;i<arr.length;i++) if (obj && obj[arr[i].id]) n++;
    return Math.round(n*100/arr.length);
  }
  function totalDays() { var n=0; for (var k in data.doneAll) if (data.doneAll[k]) n++; return n; }
  function streak() {
    var n = 0; var d = new Date();
    for(;;) {
      var m=d.getMonth()+1, dd=d.getDate();
      var k = d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
      if (data.doneAll[k]) { n++; d.setDate(d.getDate()-1); } else break;
    }
    return n;
  }
  function closedAll(key) { return !!data.doneAll[key]; }
  function supportsCount() { var n=0; for (var k in data.fires) { var o=data.fires[k]; for (var kk in o) n+=o[kk]; } return n; }
  function chalDone() { var n=0; for (var i=0;i<data.chals.length;i++) if (data.chals[i].finished) n++; return n; }
  function achList() {
    var s = streak(), t = totalDays(), c = chalDone(), sp = supportsCount();
    return [
      { ic:'👟', n:'Первый шаг', s:'Закрыт первый день', got: t>=1 },
      { ic:'🚀', n:'Разгон', s:'Серия 3 дня подряд', got: s>=3 },
      { ic:'📅', n:'Неделя дисциплины', s:'Серия 7 дней подряд', got: s>=7 },
      { ic:'🗓️', n:'Две недели', s:'Серия 14 дней подряд', got: s>=14 },
      { ic:'💪', n:'Месяц силы', s:'Серия 30 дней подряд', got: s>=30 },
      { ic:'⭐️', n:'Полсотни', s:'Серия 50 дней подряд', got: s>=50 },
      { ic:'👑', n:'Легенда', s:'Серия 100 дней подряд', got: s>=100 },
      { ic:'🏆', n:'30 дней в деле', s:'30 закрытых дней (не подряд)', got: t>=30 },
      { ic:'⚡️', n:'Вызов принят', s:'Пройден 1 вызов до конца', got: c>=1 },
      { ic:'🎯', n:'Охотник за вызовами', s:'Пройдено 5 вызовов до конца', got: c>=5 },
      { ic:'🤝', n:'Опора сообщества', s:'Поддержал участников 10 раз', got: sp>=10 }
    ];
  }

  // calendars
  function calHTML(colorFn) {
    var h = '<div class="cal">';
    var dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    for (var i=0;i<dows.length;i++) h += '<div class="dow">'+dows[i]+'</div>';
    var now = new Date(); now.setHours(0,0,0,0);
    var start = new Date(now); start.setDate(start.getDate() - 34);
    while (start.getDay() != 1) start.setDate(start.getDate()-1);
    var cur = new Date(start);
    for (var r=0; r<35; r++) {
      var m = cur.getMonth()+1, dd = cur.getDate();
      var key = cur.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
      var cls = 'day';
      var st = colorFn ? colorFn(key, cur) : null;
      if (st === 2) cls += ' full'; else if (st === 1) cls += ' part';
      if (cur.getTime() === now.getTime()) cls += ' today';
      h += '<div class="'+cls+'">'+dd+'</div>';
      cur.setDate(cur.getDate()+1);
    }
    return h + '</div>';
  }

  // ===== PAGE: HABITS =====
  function renderHabits() {
    var el = document.getElementById('habits');
    var ct = checksToday();
    var p1 = pct(data.habits, ct);
    var html = '<div class="card"><div class="profile-row">' + avatarHTML() +
      '<div><div class="pname">'+esc(myName())+'</div><div class="pstats">Серия: '+streak()+' · дней: '+totalDays()+'</div></div></div></div>';
    html += '<div class="card"><div class="barinfo">Выполнено сегодня: <b>'+p1+'%</b></div><div class="bar"><div style="width:'+p1+'%"></div></div>';
    if (!data.habits.length) {
      html += '<div class="empty">Пока нет привычек. Добавь первую!</div>';
    } else {
      for (var i=0;i<data.habits.length;i++) {
        var h = data.habits[i];
        var done = !!ct[h.id];
        html += '<div class="habit"><div class="circle'+(done?' done':'')+'" data-todo="toggle" data-id="'+h.id+'">'+(done?'✓':'')+'</div>'+
          '<div class="hname'+(done?' done':'')+'">'+esc(h.name)+'</div>'+
          '<button class="xbtn" data-todo="del" data-id="'+h.id+'">✕</button></div>';
      }
    }
    html += '<input class="inp" id="hname" placeholder="Новая привычка"><button class="btn" data-todo="add">＋ Добавить привычку</button></div>';
    html += '<div class="section-title">Календарь · 5 недель</div><div class="card">'+calHTML(function(k){ return closedAll(k) ? 2 : null; })+'</div>';
    html += '<div class="note">Напоминания приходят в 8:00 (задания на день), 10:00 и 15:00 (пить воду) и 20:00 (вечернее). Управлять ими можно в боте.</div>';
    el.innerHTML = html;
  }

  function avatarHTML() {
    var u = me();
    if (u && u.photo_url) return '<img class="avatar" src="'+u.photo_url+'" alt="">';
    return '<div class="avatar-ph">'+(myName()[0]||'Г')+'</div>';
  }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ===== PAGE: RANK =====
  function renderRank() {
    var el = document.getElementById('rank');
    var html = '<div class="card"><div class="profile-row"><div class="medal">🥇</div>' + avatarHTML() +
      '<div style="flex:1"><div class="pname">'+esc(myName())+'</div><div class="pstats">Закрыто дней: '+totalDays()+' · 🔥 '+firesOf('me')+'</div></div></div></div>';
    html += '<div class="card"><div class="empty">Участники, вступившие в бота, появятся здесь автоматически после подключения общего сервера.</div></div>';
    el.innerHTML = html;
  }
  function firesOf(id) { return 0; }

  // ===== PAGE: CHALLENGES =====
  function renderChal() {
    var el = document.getElementById('chal');
    var html = '<div class="card"><div class="barinfo">Брось вызов себе или другим — отметка дня каждый день, пока не закончится срок.</div>';
    if (!data.chals.length) html += '<div class="empty">Пока нет вызовов.</div>';
    for (var i=0;i<data.chals.length;i++) {
      var c = data.chals[i];
      var acc = !!data.accepted[c.id];
      var pr = Math.min(c.days, c.done||0);
      html += '<div style="margin-top:12px"><div class="hname" style="font-weight:700">'+esc(c.name)+'</div>'+
        '<div class="pstats">Срок: '+c.days+' дн. · участников: '+(c.members||1)+'</div>'+
        '<div class="bar"><div style="width:'+Math.round(pr*100/c.days)+'%"></div></div>';
      if (!acc) html += '<button class="ch-btn" data-chal="accept" data-id="'+c.id+'">Принять вызов</button>';
      else {
        html += '<button class="ch-btn" data-chal="day" data-id="'+c.id+'">＋ Отметить день</button>';
        if (pr >= c.days && !c.finished) html += '<span class="pstats">✅ Вызов пройден!</span>';
      }
      html += '<button class="ch-btn ghost" data-chal="del" data-id="'+c.id+'">✕ Удалить</button></div>';
    }
    html += '<input class="inp" id="cname" placeholder="Название вызова"><button class="btn2" id="cdays">Срок: '+(data._cd||7)+' дн. (нажми, чтобы поменять)</button><button class="btn" data-chal="add">⚡️ Бросить вызов</button></div>';
    el.innerHTML = html;
  }

  // ===== PAGE: MOOD =====
  var MOODS = ['😫','😕','😐','🙂','😄'];
  function renderMood() {
    var el = document.getElementById('mood');
    var html = '<div class="card"><div class="barinfo">Как ты себя чувствуешь сегодня?</div><div class="moodrow">';
    for (var i=0;i<5;i++) html += '<div class="mood'+(data._m===i?' sel':'')+'" data-mood="'+i+'">'+MOODS[i]+'</div>';
    html += '</div><input class="inp" id="mnote" placeholder="Заметка (необязательно)"><button class="btn" data-mood-save="1">Сохранить</button></div>';
    var avg = 0;
    if (data.mood.length) { var s=0; for (var i=0;i<data.mood.length;i++) s += (data.mood[i].v+1); avg = Math.round(s*100/(data.mood.length*5)); }
    html += '<div class="card"><div class="barinfo">Среднее самочувствие: <b>'+avg+'%</b></div><div class="bar"><div style="width:'+avg+'%"></div></div></div>';
    html += '<div class="section-title">Календарь настроения</div><div class="card">'+calHTML(function(k){
      var mm = null; for (var i=0;i<data.mood.length;i++) if (data.mood[i].d===k) mm = data.mood[i].v;
      if (mm===null) return null; return mm>=3 ? 2 : (mm>=1 ? 1 : 0);
    })+'</div>';
    if (data.mood.length) {
      html += '<div class="section-title">История</div><div class="card">';
      for (var j=data.mood.length-1;j>=Math.max(0,data.mood.length-7);j--) {
        html += '<div class="habit"><span style="font-size:22px">'+MOODS[data.mood[j].v]+'</span><div class="hname" style="font-size:14px">'+data.mood[j].d+(data.mood[j].n?' · '+esc(data.mood[j].n):'')+'</div><button class="xbtn" data-mood-del="'+j+'">✕</button></div>';
      }
      html += '</div>';
    }
    el.innerHTML = html;
  }

  // ===== PAGE: PROFILE =====
  function renderProf() {
    var el = document.getElementById('prof');
    var html = '<div class="card"><div class="profile-row">' + avatarHTML() +
      '<div><div class="pname">'+esc(myName())+'</div><div class="pstats">Серия: '+streak()+' · Лучше: '+bestStreak()+' · Всего дней: '+totalDays()+'</div></div></div></div>';
    var s = streak();
    html += '<div class="card"><div class="barinfo">Серия: <b>'+s+' дн.</b> 🔥 · Всего закрыто: <b>'+totalDays()+'</b></div><div class="bar"><div style="width:'+Math.min(100, s*100/100)+'%"></div></div>'+
      '<div class="fz">❄️ Заморозки: 2 из 2 — пропусти день без потери серии</div></div>';
    html += '<div class="section-title">Достижения</div><div class="card">';
    var list = achList();
    for (var i=0;i<list.length;i++) {
      html += '<div class="ach'+(list[i].got?' got':'')+'"><div class="ach-ic">'+list[i].ic+'</div><div><div class="ach-name">'+list[i].n+(list[i].got?' ✅':'')+'</div><div class="ach-sub">'+list[i].s+'</div></div></div>';
    }
    html += '</div>';
    html += '<div class="section-title">Календарь · 5 недель</div><div class="card">'+calHTML(function(k){ return closedAll(k) ? 2 : null; })+'</div>';
    html += '<div class="section-title">Настройки</div><div class="card">';
    html += setRow('mute','Утреннее напоминание','Задания на день · 08:00');
    html += setRow('w1','Напоминание пить воду №1','10:00');
    html += setRow('w2','Напоминание пить воду №2','15:00');
    html += setRow('eve','Вечернее напоминание','Придёт, если день ещё не закрыт · 20:00');
    html += setRow('hide','Скрыть имя в рейтинге','');
    html += '<div class="note">Время напоминаний одинаковое для всех: 8:00, 10:00, 15:00 и 20:00. Переключатель включает и выключает напоминание для тебя.</div>';
    html += '<button class="btn2" data-prof="reset">Сбросить весь прогресс</button>';
    html += '</div>';
    el.innerHTML = html;
  }
  function setRow(key, name, sub) {
    return '<div class="setrow"><div><div class="setname">'+name+'</div>'+(sub?'<div class="setsub">'+sub+'</div>':'')+'</div><button class="switch'+(data.settings[key]?' on':'')+'" data-set="'+key+'"></button></div>';
  }
  function bestStreak() { return Math.max(streak(), load('lf_best', 0)); }
  function saveBest() { if (streak() > load('lf_best',0)) save('lf_best', streak()); }

  // ===== RENDER DISPATCH =====
  function render() {
    renderHabits(); renderRank(); renderChal(); renderMood(); renderProf();
  }

  function closeDayIfAll() {
    var ct = checksToday();
    if (data.habits.length) {
      var all = true;
      for (var i=0;i<data.habits.length;i++) if (!ct[data.habits[i].id]) all = false;
      var t = todayKey();
      if (all && !data.doneAll[t]) { data.doneAll[t] = true; toast('День закрыт! Серия: '+streak()+' 🔥'); saveBest(); }
    }
    save('lf', data);
  }

  document.addEventListener('click', function(ev) {
    var el = ev.target;
    if (!el || !el.dataset) return;
    var d = el.dataset;

    // tabs
    var tab = el.closest ? el.closest('.tab') : null;
    var nav = el.closest ? el.closest('.nav button') : null;
    if (tab || nav) {
      var p = (tab||nav).dataset.p;
      var ts = document.querySelectorAll('.tab');
      for (var i=0;i<ts.length;i++) ts[i].classList.toggle('on', ts[i].dataset.p===p);
      var ps = document.querySelectorAll('.page');
      for (var j=0;j<ps.length;j++) ps[j].classList.toggle('on', ps[j].id===p);
      var nb = document.querySelectorAll('.nav button');
      for (var k2=0;k2<nb.length;k2++) nb[k2].classList.toggle('on', nb[k2].dataset.p===p);
      window.scrollTo(0,0);
      return;
    }
    // habits
    if (d.todo === 'toggle') {
      var ct = checksToday();
      ct[d.id] = !ct[d.id];
      if (ct[d.id]) toast(MOTIV[Math.floor(Math.random()*MOTIV.length)]);
      closeDayIfAll(); renderHabits(); return;
    }
    if (d.todo === 'del') {
      for (var i2=0;i2<data.habits.length;i2++) if (String(data.habits[i2].id)===d.id) data.habits.splice(i2,1);
      save('lf', data); closeDayIfAll(); renderHabits(); return;
    }
    if (d.todo === 'add') {
      var inp = document.getElementById('hname');
      var v = inp ? inp.value.trim() : '';
      if (!v) { toast('Впиши название привычки'); return; }
      data.habits.push({ id: Date.now(), name: v });
      save('lf', data); renderHabits(); return;
    }
    // challenges
    if (d.chal === 'add') {
      var cn = document.getElementById('cname');
      var cv = cn ? cn.value.trim() : '';
      if (!cv) { toast('Впиши название вызова'); return; }
      data.chals.push({ id: Date.now(), name: cv, days: data._cd || 7, done: 0, members: 1, finished: false });
      save('lf', data); renderChal(); return;
    }
    if (d.chal === 'accept') {
      data.accepted[d.id] = true;
      for (var i3=0;i3<data.chals.length;i3++) if (String(data.chals[i3].id)===d.id) data.chals[i3].members = (data.chals[i3].members||1)+1;
      toast('Вызов принят! ⚡️');
      save('lf', data); renderChal(); return;
    }
    if (d.chal === 'day') {
      for (var i4=0;i4<data.chals.length;i4++) if (String(data.chals[i4].id)===d.id) {
        var c2 = data.chals[i4];
        if ((c2.done||0) < c2.days) c2.done = (c2.done||0)+1;
        if (c2.done >= c2.days && !c2.finished) { c2.finished = true; toast('Вызов пройден до конца! 🎉'); }
      }
      save('lf', data); renderChal(); return;
    }
    if (d.chal === 'del') {
      for (var i5=0;i5<data.chals.length;i5++) if (String(data.chals[i5].id)===d.id) data.chals.splice(i5,1);
      delete data.accepted[d.id];
      save('lf', data); renderChal(); return;
    }
    // mood
    if (d.mood !== undefined && d.mood !== null && d.mood !== '') {
      data._m = parseInt(d.mood, 10);
      save('lf', data); renderMood(); return;
    }
    if (d.moodSave) {
      if (data._m === undefined || data._m === null) { toast('Сначала выбери смайлик'); return; }
      var mn = document.getElementById('mnote');
      var today = todayKey();
      for (var i6=0;i6<data.mood.length;i6++) if (data.mood[i6].d===today) data.mood.splice(i6,1);
      data.mood.push({ d: today, v: data._m, n: mn ? mn.value.trim() : '' });
      save('lf', data); toast('Настроение сохранено 🙂'); renderMood(); return;
    }
    if (d.moodDel !== undefined) {
      data.mood.splice(parseInt(d.moodDel,10),1);
      save('lf', data); renderMood(); return;
    }
    // settings
    if (d.set) {
      data.settings[d.set] = !data.settings[d.set];
      save('lf', data); renderProf(); return;
    }
    if (d.prof === 'reset') {
      if (confirm('Точно сбросить весь прогресс?')) {
        data = { habits: [], checks: {}, mood: [], chals: [], accepted: {}, fires: {}, fireDays: {}, doneAll: {}, settings: { mute: true, w1: true, w2: true, eve: true, hide: false } };
        save('lf', data); save('lf_best', 0); render(); toast('Прогресс сброшен');
      }
      return;
    }
  }, false);

  document.addEventListener('click', function(ev) {
    var el = ev.target;
    if (el && el.id === 'cdays') {
      var v = parseInt(prompt('Срок вызова в днях:', String(data._cd||7)), 10);
      if (v && v > 0) { data._cd = v; save('lf', data); renderChal(); }
    }
  }, false);

  render();
})();
</script>
</body>
</html>
