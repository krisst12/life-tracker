<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер LIFE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#FAFAFA;color:#222;padding-bottom:90px}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:#FFD400;padding:14px;z-index:10;max-width:520px;margin:0 auto}
header h1{font-size:20px;font-weight:800}
.ver{display:inline-block;margin-top:4px;background:rgba(0,0,0,.08);border-radius:8px;padding:2px 10px;font-size:12px;font-weight:700}
.errbox{position:fixed;top:0;left:0;right:0;background:#d32f2f;color:#fff;padding:8px 12px;font-size:12px;z-index:99;display:none;white-space:pre-wrap}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;z-index:10}
.tabs button{flex:1;background:none;border:none;padding:10px 2px;font-size:11px;color:#888;cursor:pointer}
.tabs button.on{color:#111;font-weight:700}
.tabs .ico{font-size:20px;display:block}
.card{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.h2{margin:18px 0 2px;font-size:13px;font-weight:800;color:#888;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #f0f0f0}
.row:last-child{border-bottom:none}
.circ{width:30px;height:30px;border-radius:50%;border:2px solid #ccc;background:#fff;cursor:pointer;flex-shrink:0}
.circ.on{background:#FFD400;border-color:#111}
.hname{flex:1;font-size:16px}
.hname.done{text-decoration:line-through;color:#aaa}
.x{background:none;border:none;font-size:18px;color:#c0392b;cursor:pointer;padding:4px 6px}
.btn{display:block;width:100%;background:#FFD400;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.btn2{background:#fff;border:2px solid #FFD400;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
input[type=text]{width:100%;border:1.5px solid #ddd;border-radius:12px;padding:11px;font-size:15px;margin-top:12px}
.bar{height:10px;background:#eee;border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#FFD400;border-radius:6px}
.pct{font-size:13px;font-weight:700;margin-top:4px;color:#555}
.prof{display:flex;align-items:center;gap:10px}
.ava{width:42px;height:42px;border-radius:50%;background:#FFD400;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0}
.ava img{width:100%;height:100%;object-fit:cover}
.stat{flex:1;background:#F2F2F2;border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:26px;display:block}
.stat span{font-size:11px;color:#888}
.ach{display:inline-block;width:31%;margin:1%;background:#F2F2F2;border-radius:14px;padding:12px 6px;text-align:center;vertical-align:top}
.ach.on{background:#FFF6CC;border:2px solid #FFD400}
.ach .e{font-size:26px}
.ach .t{font-size:12px;font-weight:700;margin-top:4px}
.ach .d{font-size:10px;color:#888;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .dn{text-align:center;font-size:10px;color:#999;font-weight:700}
.cal .d{aspect-ratio:1;border-radius:10px;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#bbb}
.cal .d.part{background:#FFF3B0;color:#7a6400}
.cal .d.full{background:#FFD400;color:#111;font-weight:700}
.cal .d.today{outline:2px solid #111;outline-offset:-2px;font-weight:800;color:#111}
.mood{width:52px;height:52px;border:none;background:#F2F2F2;border-radius:14px;font-size:26px;cursor:pointer;margin:0 4px}
.mood.on{background:#FFD400;outline:2px solid #111;outline-offset:-2px}
.emo{font-size:30px}
.stg{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #f0f0f0}
.stg .txt{flex:1}
.stg .txt b{display:block;font-size:15px}
.stg .txt span{font-size:12px;color:#888}
.switch{position:relative;width:48px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#ccc;border-radius:16px;cursor:pointer;transition:.2s}
.sl:before{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked + .sl{background:#111}
.switch input:checked + .sl:before{transform:translateX(20px)}
input[type=time]{border:1.5px solid #ddd;border-radius:10px;padding:8px;font-size:15px}
.motiv{background:#FFF6CC;border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:700;display:none}
.medal{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.fire{background:#FFF;border:1.5px solid #eee;border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer;flex-shrink:0}
.fire:disabled{opacity:.35;cursor:default}
.note{font-size:11px;color:#999;margin-top:8px}
</style>
</head>
<body>
<div class="errbox" id="errbox"></div>
<header><h1>🔥 Трекер LIFE</h1><span class="ver" id="verbadge">Версия 13</span></header>
<div class="wrap" id="content"></div>
<div class="tabs" id="tabs"></div>
<script>
window.onerror=function(m,s,l){var e=document.getElementById('errbox');e.style.display='block';e.textContent='Ошибка: '+m+' (строка '+l+')';};

var TABS=[['hab','📅','Привычки'],['rate','🏆','Рейтинг'],['calls','⚡','Вызовы'],['mood','😊','Настроение'],['prof','👤','Профиль']];
var cur='hab';
var TG=null,tgUser=null;
try{ if(window.Telegram&&Telegram.WebApp){TG=Telegram.WebApp;TG.ready();tgUser=TG.initDataUnsafe?TG.initDataUnsafe.user:null;} }catch(e){}

function load(){try{return JSON.parse(localStorage.getItem('lt13')||'{}')}catch(e){return{}}}
var S=load();
S.habits=S.habits||[];
S.calls=S.calls||[];
S.moods=S.moods||{};
S.fires=S.fires||{};
S.settings=S.settings||{morning:true,morningTime:'07:00',evening:true,eveningTime:'20:00',water:false,waterTime:'12:00',hideName:false};
function save(){localStorage.setItem('lt13',JSON.stringify(S))}

var me={id:'me',name:(tgUser&&(tgUser.first_name||tgUser.username))||'Я',photo:(tgUser&&tgUser.photo_url)||null};
if(!S.me){S.me={name:me.name,photo:me.photo};save();}
else{me={id:'me',name:S.me.name||me.name,photo:S.me.photo||me.photo};}
if(!S.people){S.people=[];if(me.name&&me.name!=='Я')S.people.push({id:'me',name:me.name,photo:me.photo,days:0});}
function people(){var arr=S.people.slice();if(!arr.some(function(p){return p.id==='me'}))arr.unshift({id:'me',name:me.name,photo:me.photo,days:0});return arr}

function tds(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function hDone(h,d){return h.done&&h.done[d]}
function dayDone(d){if(S.habits.length===0)return false;for(var i=0;i<S.habits.length;i++){if(!hDone(S.habits[i],d))return false}return true}
function closedDates(){var r=[],i,d;for(d in S.moods){}var all={};S.habits.forEach(function(h){for(var k in h.done)all[k]=1});for(var k in all){if(dayDone(k))r.push(k)}return r}
function streak(){var closed={},i;closedDates().forEach(function(d){closed[d]=1});var n=0,d=new Date();if(!closed[ds(d)]){d.setDate(d.getDate()-1)}while(closed[ds(d)]){n++;d.setDate(d.getDate()-1)}return n;
 function ds(x){return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()}}
function totalClosed(){return closedDates().length}
function todayPct(){if(S.habits.length===0)return 0;var n=0;S.habits.forEach(function(h){if(hDone(h,tds()))n++});return Math.round(n/S.habits.length*100)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

var MOTIV=['Отлично! Ещё один шаг к цели! 🔥','Молодец, так держать! 💪','Ты сильнее своих отговорок! 🚀','Каждая галочка — победа! ⭐','Дисциплина — твой супероружие! 🏆','Ты на верном пути! ✨'];
var DAYFULL='День закрыт! Серия: ';
var motivMsg='';

function render(){
 var t=document.getElementById('tabs'),c=document.getElementById('content'),h='';
 TABS.forEach(function(x){h+='<button class="'+(cur===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>'});
 t.innerHTML=h;
 if(cur==='hab')c.innerHTML=vHabits();
 else if(cur==='rate')c.innerHTML=vRate();
 else if(cur==='calls')c.innerHTML=vCalls();
 else if(cur==='mood')c.innerHTML=vMood();
 else c.innerHTML=vProf();
}
function setTab(t){cur=t;motivMsg='';render();window.scrollTo(0,0)}

function avaHTML(p,size){var s=size||36;if(p.photo&&p.photo.indexOf('http')===0)return '<span class="ava" style="width:'+s+'px;height:'+s+'px"><img src="'+esc(p.photo)+'" alt=""></span>';var ini=(p.name||'?').charAt(0).toUpperCase();return '<span class="ava" style="width:'+s+'px;height:'+s+'px">'+esc(ini)+'</span>'}

function vHabits(){
 var h='<div class="card"><div class="prof">'+avaHTML(me,42)+'<div><b style="font-size:16px">'+esc(me.name)+'</b><div style="font-size:12px;color:#888">Закрыто дней: '+totalClosed()+' · Серия: '+streak()+'</div></div></div></div>';
 var pct=todayPct();
 h+='<div class="card"><b style="font-size:13px">СЕГОДНЯ</b><div class="bar"><i style="width:'+pct+'%"></i></div><div class="pct">'+pct+'% выполнено</div></div>';
 h+='<div class="h2">МОИ ПРИВЫЧКИ</div><div class="card">';
 if(S.habits.length===0)h+='<div style="color:#999;padding:14px 4px;font-size:14px">Пока пусто. Добавь первую привычку!</div>';
 S.habits.forEach(function(x){
  var dn=hDone(x,tds());
  h+='<div class="row"><button class="circ'+(dn?' on':'')+'" onclick="togHabit('+x.id+')">'+(dn?'✓':'')+'</button><span class="hname'+(dn?' done':'')+'">'+esc(x.name)+'</span><button class="x" onclick="delHabit('+x.id+')">✕</button></div>';
 });
 h+='<input type="text" id="newhabit" placeholder="Название привычки"><button class="btn" onclick="addHabit()">＋ Добавить привычку</button>';
 if(motivMsg)h+='<div class="motiv" style="display:block">'+motivMsg+'</div>';
 h+='</div>';
 var p30=monthPct();
 h+='<div class="h2">ЗА 30 ДНЕЙ</div><div class="card"><div class="bar"><i style="width:'+p30+'%"></i></div><div class="pct">'+p30+'% — средний прогресс за месяц</div></div>';
 h+='<div class="h2">КАЛЕНДАРЬ · ПОСЛЕДНИЕ 5 НЕДЕЛЬ</div><div class="card">'+calHTML('habits')+'</div>';
 return h;
}
function monthPct(){var n=0,t=0;for(var i=0;i<30;i++){var d=new Date();d.setDate(d.getDate()-i);var k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();var dn=S.habits.length?Math.round(S.habits.filter(function(h){return hDone(h,k)}).length/S.habits.length*100):0;n+=dn;t++}return Math.round(n/t)}
function togHabit(id){var h=S.habits.find(function(x){return x.id===id});if(!h)return;var d=tds();h.done=h.done||{};if(h.done[d]){delete h.done[d];motivMsg=''}else{h.done[d]=1;if(dayDone(d)){motivMsg=DAYFULL+streak()+' 🔥'}else{motivMsg=MOTIV[Math.floor(Math.random()*MOTIV.length)]}}save();render()}
function addHabit(){var v=(document.getElementById('newhabit').value||'').trim();if(!v)return;S.habits.push({id:Date.now(),name:v,done:{}});save();render()}
function delHabit(id){S.habits=S.habits.filter(function(x){return x.id!==id});motivMsg='';save();render()}

function calHTML(kind){
 var h='<div class="cal">',['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(function(d){h+='<div class="dn">'+d+'</div>'});
 var start=new Date();start.setDate(start.getDate()-35);start.setDate(start.getDate()-((start.getDay()+6)%7));
 for(var i=0;i<35;i++){
  var dd=new Date(start);dd.setDate(start.getDate()+i);
  var k=dd.getFullYear()+'-'+(dd.getMonth()+1)+'-'+dd.getDate();
  var cls='d',mark='';
  if(kind==='habits'){if(dayDone(k))cls+=' full';else if(S.habits.length&&S.habits.some(function(x){return x.done&&x.done[k]}))cls+=' part'}
  if(kind==='mood'&&S.moods[k]){var v=S.moods[k].v;cls+=' '+(v>=4?'full':(v===3?'part':'')) ;if(v<3)mark='<span style="color:#c0392b">'+dd.getDate()+'</span>'}
  if(k===tds())cls+=' today';
  h+='<div class="'+cls+'">'+(mark||dd.getDate())+'</div>';
 }
 h+='</div>';return h;
}

function fireCount(p){var n=0;for(var d in S.fires){var arr=S.fires[d][p.id];if(arr)n+=arr.length}return n}
function firedTodayByMe(pid){var f=S.fires[tds()];return f&&f[pid]&&f[pid].indexOf('me')>=0}
function allDoneToday(){return S.habits.length>0&&dayDone(tds())}
function vRate(){
 var ps=people().slice().sort(function(a,b){return (b.days||0)-(a.days||0)});
 var h='<div class="h2">РЕЙТИНГ УЧАСТНИКОВ</div>';
 if(allDoneToday())h+='<div class="motiv" style="display:block">Все задания выполнены! День засчитан 🎉</div>';
 h+='<div class="card">';
 ps.forEach(function(p,i){
  var hid=(p.id==='me'&&S.settings.hideName);
  var nm=hid?'Скрытый участник':p.name;
  var medal=i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(i+1)));
  var canFire=p.id!=='me'&&!firedTodayByMe(p.id);
  h+='<div class="row"><span class="medal">'+medal+'</span>'+avaHTML(p,36)+'<div style="flex:1"><b style="font-size:15px">'+esc(nm)+'</b><div style="font-size:12px;color:#888">Дней закрыто: '+(p.id==='me'?totalClosed():(p.days||0))+(allDoneToday()?' · ✅ всё выполнено':'')+'</div></div><span style="font-size:14px">🔥 '+fireCount(p)+'</span>'+(canFire?'<button class="fire" onclick="giveFire(\''+p.id+'\')">🔥 Поддержать</button>':'')+'</div>';
 });
 h+='<div class="note">Участники, вступившие в бот, появятся здесь автоматически — для этого нужен сервер (см. сообщение помощника). Пока рейтинг живёт на твоём устройстве.</div>';
 h+='<button class="btn" onclick="addPerson()">＋ Добавить участника</button></div>';
 return h;
}
function giveFire(pid){var d=tds();S.fires[d]=S.fires[d]||{};S.fires[d][pid]=S.fires[d][pid]||[];if(S.fires[d][pid].indexOf('me')<0){S.fires[d][pid].push('me');save()}render()}
function addPerson(){var n=prompt('Имя участника:');if(!n)return;S.people.push({id:'p'+Date.now(),name:n,photo:null,days:0});save();render()}

function vCalls(){
 var h='<div class="h2">ВЫЗОВЫ</div><div class="card">';
 if(S.calls.length===0)h+='<div style="color:#999;padding:10px 4px;font-size:14px">Вызовов пока нет. Брось первый!</div>';
 S.calls.forEach(function(c){
  var joined=c.joined;var done=c.done?c.done.length:0;
  var pct=Math.min(100,Math.round(done/c.days*100));
  h+='<div style="padding:10px 0;border-bottom:1px solid #f0f0f0"><b style="font-size:16px">'+esc(c.name)+'</b><div style="font-size:12px;color:#888;margin-top:2px">Срок: '+c.days+' дней · Участников: '+(joined?1:0)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="pct">'+done+' из '+c.days+' дней</div>';
  h+='<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">';
  if(!joined)h+='<button class="btn2" onclick="joinCall('+c.id+')">Принять вызов</button>';
  else h+='<button class="btn2" onclick="callDay('+c.id+')">＋ Отметить день</button>';
  h+='<button class="x" onclick="delCall('+c.id+')">✕ Удалить</button></div></div>';
 });
 h+='<input type="text" id="callname" placeholder="Название вызова"><input type="number" id="calldays" placeholder="Срок в днях" style="margin-top:8px" min="1"><button class="btn" onclick="addCall()">⚡ Бросить вызов</button></div>';
 return h;
}
function addCall(){var n=(document.getElementById('callname').value||'').trim();var d=parseInt(document.getElementById('calldays').value)||7;if(!n)return;S.calls.push({id:Date.now(),name:n,days:d,joined:false,done:[]});save();render()}
function joinCall(id){var c=S.calls.find(function(x){return x.id===id});if(c){c.joined=true;save()}render()}
function callDay(id){var c=S.calls.find(function(x){return x.id===id});var d=tds();if(c){c.done=c.done||[];if(c.done.indexOf(d)<0)c.done.push(d);save()}render()}
function delCall(id){S.calls=S.calls.filter(function(x){return x.id!==id});save();render()}

function vMood(){
 var t=S.moods[tds()]||{};
 var h='<div class="h2">КАКОЕ У ТЕБЯ СЕЙЧАС НАСТРОЕНИЕ?</div><div class="card" style="text-align:center">';
 var E=['😄','🙂','😐','🙁','😢'];
 h+='<div style="margin:10px 0">';
 E.forEach(function(e,i){h+='<button class="mood'+(t.v===5-i?' on':'')+'" onclick="setMood('+(5-i)+')">'+e+'</button>'});
 h+='</div><input type="text" id="moodnote" placeholder="Заметка за день (необязательно)" value="'+esc(t.text||'')+'"><button class="btn" onclick="saveMood()">Сохранить</button></div>';
 var keys=Object.keys(S.moods),avg=0;
 if(keys.length){var s=0;keys.forEach(function(k){s+=S.moods[k].v});avg=Math.round(s/keys.length/5*100)}
 h+='<div class="card"><b style="font-size:13px">САМОЧУВСТВИЕ</b><div class="bar"><i style="width:'+avg+'%"></i></div><div class="pct">'+avg+'% — среднее по всем записям</div><button class="btn2" style="margin-top:10px" onclick="showMoodCal()">📅 Календарь</button><div id="mcal"></div></div>';
 h+='<div class="h2">ИСТОРИЯ</div><div class="card">';
 if(!keys.length)h+='<div style="color:#999;font-size:14px">Пока пусто</div>';
 keys.sort().reverse().slice(0,20).forEach(function(k){
  var m=S.moods[k];var e=['😢','🙁','😐','🙂','😄'][m.v-1];
  h+='<div class="row"><span class="emo">'+e+'</span><div style="flex:1"><b style="font-size:14px">'+k+'</b>'+(m.text?'<div style="font-size:12px;color:#888">'+esc(m.text)+'</div>':'')+'</div><button class="x" onclick="delMood(\''+k+'\')">✕</button></div>';
 });
 h+='</div>';return h;
}
function setMood(v){S.moods[tds()]=S.moods[tds()]||{};S.moods[tds()].v=v;save();render()}
function saveMood(){S.moods[tds()]=S.moods[tds()]||{};S.moods[tds()].v=S.moods[tds()].v||3;S.moods[tds()].text=document.getElementById('moodnote').value;save();render()}
function delMood(k){delete S.moods[k];save();render()}
function showMoodCal(){document.getElementById('mcal').innerHTML='<div class="h2">5 НЕДЕЛЬ</div>'+calHTML('mood')}

function achList(){
 var st=streak(),tc=totalClosed();
 var nc=0,ns=0;S.calls.forEach(function(c){if(c.joined&&(c.done||[]).length>=c.days)nc++});
 var fs=0;for(var d in S.fires)for(var p in S.fires[d])if(S.fires[d][p].indexOf('me')>=0)fs++;
 return [['🌱','Первый шаг','Закрыть первый день',tc>=1],['⚡','Разгон','Серия 3 дня подряд',st>=3],['🔥','Неделя дисциплины','Серия 7 дней',st>=7],['💪','Две недели','Серия 14 дней',st>=14],['🏅','Месяц силы','Серия 30 дней',st>=30],['💎','Полсотни','Серия 50 дней',st>=50],['👑','Легенда','Серия 100 дней',st>=100],['📅','30 дней в деле','30 закрытых дней',tc>=30],['🎯','Вызов принят','Пройти вызов до конца',nc>=1],['🏆','Охотник за вызовами','Пройти 5 вызовов',nc>=5],['🤝','Опора сообщества','Поддержать 10 раз',fs>=10]];
}
function sw(id,checked,label,sub,extra){return '<div class="stg"><div class="txt"><b>'+label+'</b><span>'+sub+'</span></div>'+(extra||'')+'<label class="switch"><input type="checkbox" '+(checked?'checked':'')+' onchange="tog(\''+id+'\')"><span class="sl"></span></label></div>'}
function vProf(){
 var a=achList(),n=a.filter(function(x){return x[3]}).length;
 var stg=S.settings;
 var h='<div class="card"><div class="prof">'+avaHTML(me,52)+'<div><b style="font-size:20px">'+esc(stg.hideName?'Скрытый участник':me.name)+'</b><div style="font-size:13px;color:#888">Участник сообщества</div></div></div></div>';
 h+='<div class="card" style="display:flex;gap:8px"><div class="stat"><b>'+streak()+'</b><span>текущая серия</span></div><div class="stat"><b>'+streak()+'</b><span>лучшая серия</span></div><div class="stat"><b>'+totalClosed()+'</b><span>всего дней</span></div></div>';
 h+='<div class="card"><b>❄️ Заморозки: 2 из 2</b><div style="font-size:13px;color:#666;margin-top:4px">Если пропустите день, заморозка сработает сама и сохранит серию. Обновляются каждый месяц.</div></div>';
 h+='<div class="h2">ДОСТИЖЕНИЯ · '+n+' ИЗ 11</div><div class="card">';
 a.forEach(function(x){h+='<div class="ach'+(x[3]?' on':'')+'"><div class="e">'+x[0]+'</div><div class="t">'+x[1]+'</div><div class="d">'+x[2]+'</div></div>'});
 h+='</div>';
 h+='<div class="h2">КАЛЕНДАРЬ · ПОСЛЕДНИЕ 5 НЕДЕЛЬ</div><div class="card">'+calHTML('habits')+'</div>';
 h+='<div class="h2">НАСТРОЙКИ</div><div class="card">';
 h+=sw('morning',stg.morning,'Утреннее напоминание','Задание на день','<input type="time" value="'+stg.morningTime+'" onchange="setTime(\'morningTime\',this.value)">');
 h+=sw('evening',stg.evening,'Вечернее напоминание','Придёт, если день ещё не закрыт','<input type="time" value="'+stg.eveningTime+'" onchange="setTime(\'eveningTime\',this.value)">');
 h+=sw('water',stg.water,'Напоминание пить воду','Время между 10:00 и 20:00','<input type="time" min="10:00" max="20:00" value="'+stg.waterTime+'" onchange="setTime(\'waterTime\',this.value)">');
 h+=sw('hideName',stg.hideName,'Скрыть имя в рейтинге','Другие не увидят твоё имя','');
 h+='<div class="note">Время — по часовому поясу устройства.</div>';
 h+='<button class="btn" style="background:#fff;border:2px solid #c0392b;color:#c0392b" onclick="resetAll()">Сбросить весь прогресс</button>';
 h+='</div>';
 return h;
}
function tog(k){S.settings[k]=!S.settings[k];save();render()}
function setTime(k,v){S.settings[k]=v;save();render()}
function resetAll(){if(confirm('Точно сбросить весь прогресс?')){localStorage.removeItem('lt13');location.reload()}}

render();
</script>
