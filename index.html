<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Трекер LIFE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
body{background:#f2f3f5;min-height:100vh;padding-bottom:90px;color:#111}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.header{background:#FFD60A;padding:18px 0;margin-bottom:14px}
.header .wrap{display:flex;flex-direction:column;align-items:flex-start}
.h-title{font-size:26px;font-weight:800;display:flex;gap:8px;align-items:center}
.badge{background:rgba(0,0,0,.08);border-radius:10px;padding:4px 12px;font-size:14px;font-weight:600;margin-top:8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:#e8e9eb;border:none;border-radius:20px;padding:10px 18px;font-size:15px;font-weight:600;color:#333;cursor:pointer;white-space:nowrap}
.tab.active{background:#111;color:#FFD60A}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pcard{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:#e5e7ea;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#667;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.pname{font-size:20px;font-weight:700}
.pmeta{color:#6b7280;font-size:14px;margin-top:2px}
.bar{height:10px;background:#e9eaec;border-radius:5px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:#FFD60A;border-radius:5px;transition:width .3s}
.small{font-size:13px;color:#6b7280}
.note{background:#fffbe6;border:1px solid #ffe58f;border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f0f1f3}
.hrow:last-child{border-bottom:none}
.hcheck{width:26px;height:26px;border-radius:8px;border:2px solid #c9ccd2;background:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.hcheck.done{background:#FFD60A;border-color:#FFD60A;color:#111}
.hname{flex:1;font-size:16px;font-weight:500}
.hname.done{text-decoration:line-through;color:#9aa0a6}
.hdel{background:none;border:none;color:#c0c4cc;font-size:18px;cursor:pointer;padding:4px}
.inrow{display:flex;gap:8px;margin-top:12px}
.inrow input{flex:1;border:1.5px solid #dfe2e6;border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
.inrow input:focus{border-color:#111}
.btn{background:#111;color:#FFD60A;border:none;border-radius:14px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer}
.btn.wide{width:100%}
.btn.ghost{background:#eef0f2;color:#111}
.seclabel{font-size:12px;font-weight:700;letter-spacing:.08em;color:#9aa0a6;margin:16px 0 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;font-size:11px;color:#9aa0a6;font-weight:600;padding-bottom:2px}
.day{aspect-ratio:1;border-radius:10px;background:#eceef0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#b3b8bf}
.day.ok{background:#FFD60A;color:#111;font-weight:700}
.day.today{outline:2px solid #111;outline-offset:-2px;color:#111;font-weight:700}
.day.mood{position:relative}
.day.mood::after{content:attr(data-e);position:absolute;bottom:2px;font-size:9px}
.rankrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f0f1f3}
.firebtn{background:#fff4e5;border:1.5px solid #ffd8a8;color:#d97b00;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.firebtn.off{background:#f3f4f6;border-color:#e5e7ea;color:#b3b8bf;cursor:default}
.rank-num{width:28px;text-align:center;font-weight:700;font-size:15px}
.donebadge{color:#1a7f37;font-size:13px;font-weight:700}
.fab{position:fixed;bottom:18px;right:18px;width:56px;height:56px;border-radius:50%;background:#FFD60A;border:none;font-size:26px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;display:none;z-index:5}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e9eaec;display:flex;z-index:6;padding:6px 0 10px}
.bn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#8a8f98;cursor:pointer;padding:4px 0}
.bn.active{color:#111;font-weight:700}
.bn .ic{font-size:22px}
.moods{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.moodbtn{font-size:34px;background:#f3f4f6;border:2px solid transparent;border-radius:14px;padding:8px 12px;cursor:pointer}
.moodbtn.sel{border-color:#FFD60A;background:#fffbe6}
.ach{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #f0f1f3}
.ach .ic{width:44px;height:44px;border-radius:12px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ach.got .ic{background:#FFD60A}
.ach .t{font-weight:700;font-size:15px}
.ach.got .t::after{content:" ✅"}
.ach .d{font-size:13px;color:#6b7280}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f0f1f3}
.setrow:last-child{border-bottom:none}
.switch{position:relative;width:50px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.sl{position:absolute;cursor:pointer;inset:0;background:#d8dadd;border-radius:14px;transition:.2s}
.sl::before{content:"";position:absolute;height:22px;width:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .sl{background:#FFD60A}
.switch input:checked + .sl::before{transform:translateX(22px)}
.statrow{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:#f7f8f9;border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:#6b7280;margin-top:2px}
.nameform{display:flex;gap:8px;margin-top:8px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#111;color:#FFD60A;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media(min-width:768px){.fab{display:none}}
</style>
</head>
<body>
<div class="header"><div class="wrap">
  <div class="h-title">🔥 Трекер LIFE</div>
  <span class="badge" id="verbadge">Версия 19</span>
</div></div>
<div class="wrap">
  <div class="tabs" id="topTabs">
    <button class="tab active" data-tab="habits">Привычки</button>
    <button class="tab" data-tab="rating">Рейтинг</button>
    <button class="tab" data-tab="challenges">Вызовы</button>
    <button class="tab" data-tab="mood">Настроение</button>
    <button class="tab" data-tab="profile">Профиль</button>
  </div>
  <div id="content"></div>
</div>
<button class="fab" id="fab" title="Вверх">↑</button>
<div class="bottomnav" id="bnav">
  <button class="bn active" data-tab="habits"><span class="ic">✅</span>Привычки</button>
  <button class="bn" data-tab="rating"><span class="ic">🏆</span>Рейтинг</button>
  <button class="bn" data-tab="challenges"><span class="ic">⚡</span>Вызовы</button>
  <button class="bn" data-tab="mood"><span class="ic">🙂</span>Настроение</button>
  <button class="bn" data-tab="profile"><span class="ic">👤</span>Профиль</button>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============ ВЕРСИЯ 19: логика версии 19 + авторизация из бота вместо «Гостя» ============ */
var VERSION='19';

/* --- профиль: тот, кто авторизовался в боте --- */
function resolveUser(){
  // 1) авторизация Telegram (мини-приложение)
  try{
    var wa=window.Telegram&&window.Telegram.WebApp;
    if(wa&&wa.initDataUnsafe&&wa.initDataUnsafe.user){
      var u=wa.initDataUnsafe.user;
      if(u.first_name||u.username)return{name:(u.first_name||'')+''.trim()||u.username,photo:u.photo_url||''};
      if(u.username)return{name:u.username,photo:u.photo_url||''};
    }
  }catch(e){}
  // 2) запасной путь: данные авторизации из адресной строки
  try{
    var p=new URLSearchParams(location.search);
    var raw=p.get('tgWebAppData');
    if(raw){
      var inner=new URLSearchParams(raw);
      var u2=JSON.parse(inner.get('user')||'null');
      if(u2&&(u2.first_name||u2.username))return{name:u2.first_name||u2.username,photo:u2.photo_url||''};
    }
  }catch(e){}
  // 3) сохранённое имя, введённое вручную
  var saved='';
  try{saved=localStorage.getItem('lt_name')||''}catch(e){}
  if(saved)return{name:saved,photo:''};
  return null;
}
var USER=resolveUser();

/* --- хранилище --- */
function load(){try{return JSON.parse(localStorage.getItem('lt_state_v19')||'{}')}catch(e){return{}}}
function save(){try{localStorage.setItem('lt_state_v19',JSON.stringify(S))}catch(e){}}
var S=Object.assign({habits:[],moods:{},challenges:[],supportsGiven:{},settings:{morning:true,water1:true,water2:true,evening:true,hideName:false},freezes:{},name:''},load());
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dkey(offset){var d=new Date();d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* --- вычисления --- */
function dayDone(k){if(!S.habits.length)return false;return S.habits.every(function(h){return h.history&&h.history[k]})}
function closedDays(){var c=0;for(var i=-365;i<=0;i++){if(dayDone(dkey(i)))c++}return c}
function streak(){var s=0;for(var i=0;i<400;i++){if(dayDone(dkey(-i)))s++;else if(i>0)break;else if(i===0&&!dayDone(dkey(0))){continue}}return s}
function pctToday(){if(!S.habits.length)return 0;var n=0;S.habits.forEach(function(h){if(h.history&&h.history[todayKey()])n++});return Math.round(n/S.habits.length*100)}
function pct30(){if(!S.habits.length)return 0;var tot=0,did=0;for(var i=-29;i<=0;i++){tot+=S.habits.length;S.habits.forEach(function(h){if(h.history&&h.history[dkey(i)])did++})}return tot?Math.round(did/tot*100):0}
function challengesDone(){return S.challenges.filter(function(c){return c.completed}).length}
function supportsCount(){var n=0,k;for(k in S.supportsGiven)n+=S.supportsGiven[k].length;return n}
function fireCount(){var n=0,k;for(k in S.supportsReceived||{})n+=S.supportsReceived[k].length;return n}

/* --- достижения (фиксированный список) --- */
var ACH=[
 {ic:'👣',t:'Первый шаг',d:'Закрыт первый день',f:function(){return closedDays()>=1}},
 {ic:'🚀',t:'Разгон',d:'Серия из 3 дней подряд',f:function(){return streak()>=3}},
 {ic:'📅',t:'Неделя дисциплины',d:'Серия из 7 дней подряд',f:function(){return streak()>=7}},
 {ic:'🗓️',t:'Две недели',d:'Серия из 14 дней подряд',f:function(){return streak()>=14}},
 {ic:'💪',t:'Месяц силы',d:'Серия из 30 дней подряд',f:function(){return streak()>=30}},
 {ic:'⭐',t:'Полсотни',d:'Серия из 50 дней подряд',f:function(){return streak()>=50}},
 {ic:'👑',t:'Легенда',d:'Серия из 100 дней подряд',f:function(){return streak()>=100}},
 {ic:'🎯',t:'30 дней в деле',d:'30 закрытых дней (не обязательно подряд)',f:function(){return closedDays()>=30}},
 {ic:'⚔️',t:'Вызов принят',d:'Пройти один вызов до конца',f:function(){return challengesDone()>=1}},
 {ic:'🏹',t:'Охотник за вызовами',d:'Пройти 5 вызовов до конца',f:function(){return challengesDone()>=5}},
 {ic:'🤝',t:'Опора сообщества',d:'Поддержать участников 10 раз',f:function(){return supportsCount()>=10}}
];

/* --- имя --- */
function userName(){return (USER&&USER.name)||(S.name||'').trim()||''}
function avatarHtml(sz){var n=userName();if(USER&&USER.photo)return '<div class="avatar" style="width:'+(sz||52)+'px;height:'+(sz||52)+'px"><img src="'+esc(USER.photo)+'" alt=""></div>';
 var ch=n?n.charAt(0).toUpperCase():'Γ';return '<div class="avatar" style="width:'+(sz||52)+'px;height:'+(sz||52)+'px">'+esc(ch)+'</div>'}
function profileCardHtml(extra){var n=userName()||'Без имени';
 return '<div class="card pcard">'+avatarHtml(52)+'<div><div class="pname">'+esc(n)+'</div><div class="pmeta">Серия: '+streak()+' · дней: '+closedDays()+'</div>'+(extra||'')+'</div></div>'}

/* --- табы --- */
var CUR='habits';
function setTab(t){CUR=t;document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===t)});
 document.querySelectorAll('.bn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===t)});render()}
document.querySelectorAll('.tab,.bn').forEach(function(b){b.addEventListener('click',function(){setTab(b.dataset.tab)})});
document.getElementById('fab').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}

/* --- РЕНДЕР --- */
function render(){
 try{renderInner()}catch(e){
  document.getElementById('content').innerHTML='<div class="card" style="border:2px solid #f66"><b>Ошибка отрисовки:</b><br>'+esc(e.message)+'</div>';
 }
}
function renderInner(){
 var c=document.getElementById('content');
 if(CUR==='habits')c.innerHTML=tabHabits();
 else if(CUR==='rating')c.innerHTML=tabRating();
 else if(CUR==='challenges')c.innerHTML=tabChallenges();
 else if(CUR==='mood')c.innerHTML=tabMood();
 else c.innerHTML=tabProfile();
 bindContent();
}

/* --- Привычки --- */
function tabHabits(){
 var all=pctToday()===100&&S.habits.length>0;
 var h='<div class="card pcard">'+avatarHtml(52)+'<div><div class="pname">'+esc(userName()||'Без имени')+'</div><div class="pmeta">Серия: '+streak()+' · дней: '+closedDays()+'</div></div></div>';
 h+='<div class="card"><div class="small">Выполнено сегодня: '+pctToday()+'% · за 30 дней: '+pct30()+'%</div><div class="bar"><i style="width:'+pctToday()+'%"></i></div><div class="bar" style="margin-top:8px"><i style="width:'+pct30()+'%;background:#111"></i></div>';
 if(!S.habits.length)h+='<div class="small" style="text-align:center;padding:16px 0">Пока нет привычек. Добавь первую!</div>';
 S.habits.forEach(function(hb,i){
  var done=hb.history&&hb.history[todayKey()];
  h+='<div class="hrow"><div class="hcheck'+(done?' done':'')+'" data-act="toggle" data-i="'+i+'">'+(done?'✓':'')+'</div><div class="hname'+(done?' done':'')+'">'+esc(hb.name)+'</div><button class="hdel" data-act="del" data-i="'+i+'">✕</button></div>';
 });
 h+='<div class="inrow"><input id="newhabit" placeholder="Новая привычка"><button class="btn" data-act="add">+ Добавить</button></div>';
 if(all)h+='<div class="note" style="background:#e9fbe9;border-color:#b7e4c7"><b>🎉 День закрыт!</b> Серия: '+streak()+'. Так держать!</div>';
 else if(S.habits.length)h+='<div class="note">Отметь выполненное — и день закроется!</div>';
 h+='</div><div class="seclabel">КАЛЕНДАРЬ · 5 НЕДЕЛЬ</div><div class="card"><div class="cal">';
 ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(function(d){h+='<div class="dow">'+d+'</div>'});
 var start=new Date();start.setDate(start.getDate()-34);
 var shift=(start.getDay()+6)%7;
 for(var i=0;i<shift;i++)h+='<div></div>';
 for(var i=0;i<35;i++){var off=-34+i;var k=dkey(off);var isT=k===todayKey();
  h+='<div class="day'+(dayDone(k)?' ok':'')+(isT?' today':'')+'">'+parseInt(k.slice(8))+'</div>'}
 h+='</div></div>';
 return h;
}

/* --- Рейтинг --- */
function tabRating(){
 var me=userName()||'Без имени';
 var allDone=S.habits.length>0&&pctToday()===100;
 var supported=S.supportsGiven[todayKey()]||[];
 var supportedSelf=supported.indexOf(me)>=0;
 var h='<div class="card pcard">'+avatarHtml(52)+'<div><div class="pname">'+esc(me)+'</div><div class="pmeta">Твоё место: 1</div></div></div>';
 h+='<div class="card"><div class="rankrow"><div class="rank-num">🥇</div>'+avatarHtml(48)+'<div style="flex:1"><div class="pname" style="font-size:17px">'+esc(me)+'</div><div class="small">Закрыто дней: '+closedDays()+'</div><div class="small">🔥 огоньков: '+fireCount()+'</div>'+(allDone?'<div class="donebadge">✅ всё выполнено</div>':'')+'</div>';
 if(!supportedSelf)h+='<button class="firebtn" data-act="fireself">🔥 Поддержать</button>';
 else h+='<span class="firebtn off">🔥 Уже поддержан сегодня</span>';
 h+='</div><div class="small" style="text-align:center;padding:10px 0">Участники, вступившие в бота, появятся здесь автоматически</div></div>';
 h+='<div class="small" style="text-align:center;padding:6px 0">Поддержать любого участника можно один раз в день, себя — нельзя</div>';
 return h;
}

/* --- Вызовы --- */
function tabChallenges(){
 var h='<div class="card"><div class="inrow"><input id="chname" placeholder="Название вызова"><input id="chdays" type="number" min="1" max="365" value="7" style="max-width:90px"><button class="btn" data-act="chadd">Бросить вызов</button></div></div>';
 if(!S.challenges.length)h+='<div class="card small" style="text-align:center">Вызовов пока нет. Брось первый!</div>';
 S.challenges.forEach(function(ch,i){
  var prog=ch.progress||{};
  var my=prog[userName()]||0;
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="pname" style="font-size:17px">'+esc(ch.name)+'</div><div class="small">Срок: '+ch.days+' дн. · участников: '+(ch.participants?ch.participants.length:1)+'</div></div>'+(ch.completed?'<span class="donebadge">✅ пройден</span>':'')+'</div>';
  h+='<div class="bar" style="margin-top:10px"><i style="width:'+Math.min(100,Math.round(my/ch.days*100))+'%"></i></div>';
  h+='<div class="inrow">'+(!ch.completed?'<button class="btn ghost" data-act="chmark" data-i="'+i+'">Отметить день ('+my+'/'+ch.days+')</button>':'')+'</div></div>';
 });
 return h;
}

/* --- Настроение --- */
var MOODS=['😀','🙂','😐','🙁','😢','😡','🤩','😴'];
function tabMood(){
 var t=todayKey();var m=S.moods[t];
 var total=0,positive=0,k;
 for(k in S.moods){total++;var e=S.moods[k].emoji;if(e==='😀'||e==='🙂'||e==='🤩')positive++}
 var wp=total?Math.round(positive/total*100):0;
 var h='<div class="card"><div class="small" style="text-align:center">Как настроение сегодня?</div><div class="moods">';
 MOODS.forEach(function(e){h+='<button class="moodbtn'+(m&&m.emoji===e?' sel':'')+'" data-act="mood" data-e="'+e+'">'+e+'</button>'});
 h+='</div><div class="inrow"><input id="moodnote" placeholder="Заметка к дню" value="'+esc(m&&m.note||'')+'"><button class="btn" data-act="moodsave">Сохранить</button></div>';
 h+='<div class="small" style="text-align:center;margin-top:10px">Самочувствие за всё время: '+wp+'%</div></div>';
 h+='<div class="seclabel">КАЛЕНДАРЬ НАСТРОЕНИЯ</div><div class="card"><div class="cal">';
 ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(function(d){h+='<div class="dow">'+d+'</div>'});
 var start=new Date();start.setDate(start.getDate()-34);var shift=(start.getDay()+6)%7;
 for(var i=0;i<shift;i++)h+='<div></div>';
 for(var i=0;i<35;i++){var off=-34-i+34;var k2=dkey(-34+i);var md=S.moods[k2];var isT=k2===todayKey();
  h+='<div class="day'+(md?' mood':'')+(isT?' today':'')+'" data-e="'+(md?md.emoji:'')+'">'+parseInt(k2.slice(8))+'</div>'}
 h+='</div></div>';
 return h;
}

/* --- Профиль --- */
function tabProfile(){
 var fr=S.freezes;
 var usedFr=fr[new Date().getFullYear()+'-'+new Date().getMonth()]||0;
 var h=profileCardHtml('<div class="pmeta">'+(S.settings.hideName?'имя скрыто в рейтинге':'видим в рейтинге')+'</div>');
 h+='<div class="card"><div class="statrow"><div class="stat"><div class="v">'+streak()+'</div><div class="l">серия</div></div><div class="stat"><div class="v">'+closedDays()+'</div><div class="l">закрыто дней</div></div><div class="stat"><div class="v">'+pct30()+'%</div><div class="l">30 дней</div></div><div class="stat"><div class="v">'+fireCount()+'</div><div class="l">огоньков 🔥</div></div></div></div>';
 h+='<div class="card"><div class="pname" style="font-size:16px">❄️ Заморозки</div><div class="small">Заморозить день, если нет сил: '+usedFr+' из 2 в этом месяце</div><div class="inrow"><button class="btn ghost" data-act="freeze" '+(usedFr>=2||dayDone(todayKey())?'disabled style="opacity:.5"':'')+'>Заморозить сегодня</button></div></div>';
 h+='<div class="seclabel">ДОСТИЖЕНИЯ</div><div class="card">';
 ACH.forEach(function(a){var got=a.f();h+='<div class="ach'+(got?' got':'')+'"><div class="ic">'+a.ic+'</div><div><div class="t">'+a.t+'</div><div class="d">'+a.d+'</div></div></div>'});
 h+='</div>';
 h+='<div class="seclabel">НАСТРОЙКИ</div><div class="card">';
 h+=setrow('morning','Утреннее напоминание','Задания на день · 08:00');
 h+=setrow('water1','Напоминание пить воду №1','10:00');
 h+=setrow('water2','Напоминание пить воду №2','15:00');
 h+=setrow('evening','Вечернее напоминание','Придёт, если день ещё не закрыт · 20:00');
 h+=setrow('hideName','Скрыть имя в рейтинге','');
 h+='<div class="small" style="padding-top:10px">Время одно для всех: 08:00 · 10:00 · 15:00 · 20:00. Тумблер включает или выключает напоминание.</div></div>';
 if(!USER){h+='<div class="note"><b>Твоё имя:</b><div class="nameform"><input id="nm" placeholder="Например, Света" value="'+esc(S.name||'')+'"><button class="btn" data-act="savename">Сохранить</button></div></div>'}
 h+='<div class="card small" style="text-align:center">Трекер LIFE · версия '+VERSION+'</div>';
 return h;
}
function setrow(key,title,sub){
 return '<div class="setrow"><div><div style="font-weight:600;font-size:15px">'+title+'</div>'+(sub?'<div class="small">'+sub+'</div>':'')+'</div><label class="switch"><input type="checkbox" data-act="set" data-k="'+key+'" '+(S.settings[key]?'checked':'')+'><span class="sl"></span></label></div>';
}

/* --- события --- */
function bindContent(){
 document.querySelectorAll('[data-act]').forEach(function(el){
  el.addEventListener('click',function(){act(el)},true);
 });
 var nm=document.getElementById('nm');
 if(nm)nm.addEventListener('keydown',function(e){if(e.key==='Enter')actSaveName()});
}
function actSaveName(){var i=document.getElementById('nm');if(!i)return;S.name=i.value.trim();save();render()}
function act(el){
 var a=el.dataset.act,i;
 if(a==='savename'){actSaveName();return}
 if(a==='toggle'){i=+el.dataset.i;var hb=S.habits[i];hb.history=hb.history||{};if(hb.history[todayKey()])delete hb.history[todayKey()];else{hb.history[todayKey()]=true;toast(motiv())}save();render();return}
 if(a==='del'){i=+el.dataset.i;if(confirm('Удалить привычку?')){S.habits.splice(i,1);save();render()}return}
 if(a==='add'){var inp=document.getElementById('newhabit');var v=(inp.value||'').trim();if(!v){toast('Введи название привычки');return}S.habits.push({name:v,history:{}});save();render();return}
 if(a==='fireself'){toast('Себя поддержать нельзя 🙂');return}
 if(a==='chadd'){var n=(document.getElementById('chname').value||'').trim();var d=parseInt(document.getElementById('chdays').value)||7;if(!n){toast('Введи название вызова');return}S.challenges.push({name:n,days:d,participants:[userName()||'Я'],progress:{},completed:false});save();render();return}
 if(a==='chmark'){i=+el.dataset.i;var ch=S.challenges[i];var me=userName()||'Я';ch.progress=ch.progress||{};ch.progress[me]=(ch.progress[me]||0)+1;if(ch.progress[me]>=ch.days)ch.completed=true;save();render();return}
 if(a==='mood'){var e2=el.dataset.e;S.moods[todayKey()]={emoji:e2,note:(S.moods[todayKey()]||{}).note||''};save();render();return}
 if(a==='moodsave'){var nt=(document.getElementById('moodnote').value||'').trim();var m=S.moods[todayKey()]||{emoji:'🙂'};m.note=nt;S.moods[todayKey()]=m;save();toast('Сохранено');render();return}
 if(a==='set'){S.settings[el.dataset.k]=el.checked;save();return}
 if(a==='freeze'){var ym=new Date().getFullYear()+'-'+new Date().getMonth();S.freezes[ym]=(S.freezes[ym]||0)+1;save();toast('❄️ День заморожен — серия не пострадает');render();return}
}
function motiv(){
 var all=pctToday()===100;
 if(all)return 'День закрыт! Серия: '+streak();
 var m=['Сила привычки — в каждом дне 💪','Ты справляешься! 🔥','Ещё немного — и день закрыт!','Каждая отметка — шаг к цели ✨'];
 return m[Math.floor(Math.random()*m.length)];
}

/* --- старт --- */
render();
</script>
